apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-game
  labels:
    app: pong-game
spec:
  # A single replica: the style-preferences database is a single SQLite file
  # on a ReadWriteOnce volume, and SQLite is a single-writer store — scaling
  # this out would need a shared/networked database instead.
  replicas: 1
  selector:
    matchLabels:
      app: pong-game
  template:
    metadata:
      labels:
        app: pong-game
    spec:
      containers:
        - name: pong-game
          image: pong-game:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: SQLITE_PATH
              value: "/app/data/preferences.sqlite3"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: SESSION_SECRET
                  optional: true
          volumeMounts:
            - name: preferences-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: preferences-data
          persistentVolumeClaim:
            claimName: pong-game-preferences-data
