apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-game
  labels:
    app: pong-game
spec:
  # A single replica is fine for the app itself now that style-preferences
  # persistence lives in an external MySQL 8.4 database (see DATABASE_URL
  # below) rather than a single-writer SQLite file on a local volume — the
  # app pods themselves are stateless and can be scaled horizontally.
  replicas: 1
  selector:
    matchLabels:
      app: pong-game
  template:
    metadata:
      labels:
        app: pong-game
    spec:
      containers:
        - name: pong-game
          image: pong-game:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: DATABASE_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-game-secrets
                  key: SESSION_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
