apiVersion: apps/v1
kind: Deployment
metadata:
  name: pong-app
  labels:
    app: pong-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pong-app
  template:
    metadata:
      labels:
        app: pong-app
    spec:
      containers:
        - name: pong-app
          image: pong-app:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # MySQL connection string, e.g.
            # "mysql://user:password@host:3306/pong". Read exclusively via
            # DATABASE_URL by prisma/schema.prisma — no other DB config is
            # accepted.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pong-app-secrets
                  key: DATABASE_URL
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: pong-app-secrets
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-app-secrets
                  key: GOOGLE_CLIENT_SECRET
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pong-app-secrets
                  key: SESSION_SECRET
                  optional: true
            - name: GOOGLE_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: pong-app-secrets
                  key: GOOGLE_CALLBACK_URL
                  optional: true
            - name: COOKIE_SECURE
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
