<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /*
     * Cabinet scale unit: 1 design pixel of the 700x790 cabinet. It is 1px
     * on windows big enough to hold the cabinet and shrinks proportionally
     * (by width or height, whichever is tighter) on smaller windows, so the
     * whole cabinet always fits with no scrolling.
     */
    :root {
      --u: min(1px, 100vw / 700, 100vh / 800);
    }

    html, body {
      width: 100%;
      height: 100%;
      /* Lighter purple arcade-room backdrop with a soft radial glow */
      background: #2e2250;
      background: radial-gradient(ellipse at 50% 45%, #46346f 0%, #392a5e 45%, #2e2250 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #00008b;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
      /* Soft rounded edge + drop shadow to lift the canvas off the page */
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* ── Control hints caption ─────────────────────────────────────────────── */
    /*
     * Static semantic caption rendered below the canvas, entirely separate
     * from canvas draw calls. Present at all times regardless of game phase
     * (playing / scored / gameover) — pure DOM/CSS chrome, no JS involved.
     */
    #pong-control-hints {
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      margin-top: 8px;
      font-family: monospace;
    }
    /*
     * Copy audit (text-accuracy-audit): checked against the actual bindings —
     * keydown/keyup handlers key off e.code 'KeyW'/'KeyS' and
     * 'ArrowUp'/'ArrowDown' for paddle movement, and 'Space' triggers
     * startNewGame() while game.phase === 'gameover'. "W/S or ↑/↓" and
     * "Space to play again" match those exactly — no drift found, no text
     * changed.
     */

    /* ── Best-rally readout ──────────────────────────────────────────────── */
    /*
     * A second caption below the control hints, populated by JS only after
     * game-over and only for signed-in players bucketed into the "Best
     * rally" display (see isBestRallyBucketed in server.js). Empty/hidden
     * the rest of the time.
     */
    #pong-best-rally {
      font-size: 0.85rem;
      color: #ffe066;
      text-align: center;
      margin-top: 4px;
      font-family: monospace;
      min-height: 1.2em;
    }
    #pong-best-rally:empty {
      display: none;
    }
    /* ── Slow parallax starfield (pure CSS, behind the cabinet) ───────────── */
    /*
     * Three fixed full-window layers of radial-gradient dots drawn over the
     * purple page background. Each drifts down and to the left by exactly
     * one tile per loop, so the loop has no visible seam. Farther layers
     * are smaller, dimmer and slower.
     */
    .pong-stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-repeat: repeat;
      animation: pong-stars-drift linear infinite;
    }
    @keyframes pong-stars-drift {
      from { background-position: 0 0; }
      to   { background-position: calc(-1 * var(--tile)) var(--tile); }
    }
    #pong-stars-far {
      --tile: 300px;
      opacity: 0.35;
      background-size: 300px 300px;
      background-image:
        radial-gradient(circle at 20px 40px, #fff 0.5px, transparent 1px),
        radial-gradient(circle at 110px 210px, #fff 0.5px, transparent 1px),
        radial-gradient(circle at 190px 90px, #fff 0.5px, transparent 1px),
        radial-gradient(circle at 270px 250px, #fff 0.5px, transparent 1px),
        radial-gradient(circle at 60px 140px, #fff 0.5px, transparent 1px),
        radial-gradient(circle at 240px 160px, #fff 0.5px, transparent 1px);
      animation-duration: 240s;
    }
    #pong-stars-mid {
      --tile: 420px;
      opacity: 0.5;
      background-size: 420px 420px;
      background-image:
        radial-gradient(circle at 50px 80px, #fff 0.75px, transparent 1.25px),
        radial-gradient(circle at 300px 40px, #fff 0.75px, transparent 1.25px),
        radial-gradient(circle at 160px 250px, #fff 0.75px, transparent 1.25px),
        radial-gradient(circle at 370px 330px, #fff 0.75px, transparent 1.25px),
        radial-gradient(circle at 90px 380px, #fff 0.75px, transparent 1.25px);
      animation-duration: 160s;
    }
    #pong-stars-near {
      --tile: 600px;
      opacity: 0.6;
      background-size: 600px 600px;
      background-image:
        radial-gradient(circle at 120px 100px, #fff 1px, transparent 1.5px),
        radial-gradient(circle at 460px 180px, #fff 1px, transparent 1.5px),
        radial-gradient(circle at 280px 420px, #fff 1px, transparent 1.5px),
        radial-gradient(circle at 540px 520px, #fff 1px, transparent 1.5px);
      animation-duration: 100s;
    }
    @media (prefers-reduced-motion: reduce) {
      .pong-stars { animation: none; }
    }

    /* ── Arcade cabinet (pure CSS frame around the game) ─────────────────── */
    /*
     * Every dimension is a multiple of --u so the whole cabinet scales
     * proportionally. The canvas keeps its 800x600 internal resolution and
     * is simply displayed at 560x420 design pixels inside the bezel.
     */
    #pong-cabinet {
      position: relative;
      z-index: 1;
      flex: none;
      width: calc(700 * var(--u));
      height: calc(790 * var(--u));
      overflow: hidden;
      border-radius: calc(60 * var(--u)) calc(60 * var(--u)) 0 0;
      background: linear-gradient(90deg, #5e1a14 0%, #8f2b1f 14%, #8f2b1f 86%, #5e1a14 100%);
      box-shadow: 0 calc(10 * var(--u)) calc(40 * var(--u)) rgba(0, 0, 0, 0.45);
    }
    #pong-marquee {
      position: absolute;
      left: calc(68 * var(--u));
      top: calc(15 * var(--u));
      width: calc(564 * var(--u));
      height: calc(65 * var(--u));
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffd644;
      border: calc(3 * var(--u)) solid #4a1410;
      border-radius: calc(10 * var(--u));
      box-shadow: 0 calc(3 * var(--u)) calc(8 * var(--u)) rgba(0, 0, 0, 0.5);
      font-size: calc(40 * var(--u));
      font-weight: bold;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: #b3261e;
      text-shadow: calc(2 * var(--u)) calc(2 * var(--u)) 0 #5a120d;
    }
    #pong-bezel {
      position: absolute;
      left: calc(48 * var(--u));
      top: calc(96 * var(--u));
      width: calc(604 * var(--u));
      height: calc(464 * var(--u));
      background: #111;
      border-radius: calc(32 * var(--u));
      box-shadow: inset 0 0 calc(12 * var(--u)) #000;
    }
    #pong-screen {
      position: absolute;
      left: calc(70 * var(--u));
      top: calc(118 * var(--u));
      width: calc(560 * var(--u));
      height: calc(420 * var(--u));
      overflow: hidden;
      border-radius: calc(20 * var(--u));
      background: #000022;
    }
    #pong-screen canvas {
      width: 100%;
      height: 100%;
    }
    #pong-control-panel {
      position: absolute;
      left: calc(50 * var(--u));
      top: calc(576 * var(--u));
      width: calc(600 * var(--u));
      height: calc(156 * var(--u));
      background: #2b2b30;
      border-top: calc(5 * var(--u)) solid #46464d;
      border-radius: calc(14 * var(--u)) calc(14 * var(--u)) 0 0;
    }
    #pong-cabinet-base {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(732 * var(--u));
      bottom: 0;
      background: #3a0f0a;
    }
    #pong-panel-button {
      position: absolute;
      left: calc(50 * var(--u));
      top: calc(41 * var(--u));
      width: calc(70 * var(--u));
      height: calc(70 * var(--u));
      border-radius: 50%;
      background: radial-gradient(circle at 50% 50%, #ff5a5a 0%, #d82a2a 55%, #b01e1e 100%);
      box-shadow: 0 calc(6 * var(--u)) 0 #6b0f0f;
      cursor: pointer;
    }
    #pong-panel-button:active {
      transform: translateY(calc(4 * var(--u)));
      box-shadow: 0 calc(2 * var(--u)) 0 #6b0f0f;
    }
    #pong-panel-button:focus-visible {
      outline: calc(3 * var(--u)) solid #ffd84a;
      outline-offset: calc(3 * var(--u));
    }
    #pong-panel-joystick {
      position: absolute;
      left: calc(524 * var(--u));
      top: calc(36 * var(--u));
      width: calc(26 * var(--u));
      height: calc(80 * var(--u));
      border-radius: calc(13 * var(--u));
      background: #111;
      box-shadow: inset 0 0 calc(4 * var(--u)) #000;
    }
    #pong-panel-readout {
      position: absolute;
      left: calc(125 * var(--u));
      width: calc(390 * var(--u));
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Hints and best-rally caption keep their own rules above; on the
       control panel they take the arcade-yellow colour and scale with it. */
    #pong-cabinet #pong-control-hints {
      font-size: calc(14 * var(--u));
      color: #ffe066;
      margin-top: 0;
      white-space: nowrap;
    }
    #pong-cabinet #pong-best-rally {
      font-size: calc(12 * var(--u));
      margin-top: calc(4 * var(--u));
    }
    /* Daily-play streak badge and signed-out invitation: hidden while empty. */
    #pong-streak,
    #pong-streak-note {
      font-family: monospace;
      text-align: center;
      font-size: calc(13 * var(--u));
      margin-bottom: calc(4 * var(--u));
      white-space: nowrap;
    }
    #pong-streak { color: #ff9f43; font-weight: bold; }
    #pong-streak-note a { color: #ffe066; text-decoration: none; }
    #pong-streak:empty,
    #pong-streak-note:empty { display: none; }
    /* 'Beat your yesterday' toast: fades in over the canvas, never blocks input. */
    #pong-yesterday-toast {
      position: absolute;
      left: 50%;
      top: calc(40 * var(--u));
      transform: translateX(-50%);
      z-index: 9;
      padding: calc(8 * var(--u)) calc(18 * var(--u));
      border-radius: calc(16 * var(--u));
      background: rgba(0, 0, 0, 0.7);
      color: #ffe066;
      font-family: monospace;
      font-size: calc(16 * var(--u));
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #pong-yesterday-toast.visible { opacity: 1; }
    /* Fun-mode announcement: a big centred splash at game start, then a small
       corner badge. Both sit inside the screen, under the game-over overlay. */
    #pong-mode-splash {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-family: monospace;
      font-size: calc(56 * var(--u));
      font-weight: bold;
      letter-spacing: 0.08em;
      color: #ffd84a;
      text-align: center;
      text-shadow: 0 0 calc(24 * var(--u)) rgba(255, 216, 74, 0.7), 0 calc(3 * var(--u)) 0 #000;
    }
    #pong-mode-badge {
      position: absolute;
      left: calc(10 * var(--u));
      bottom: calc(10 * var(--u));
      z-index: 5;
      pointer-events: none;
      padding: calc(3 * var(--u)) calc(10 * var(--u));
      border-radius: calc(10 * var(--u));
      font-family: monospace;
      font-size: calc(13 * var(--u));
      letter-spacing: 0.06em;
      color: #1a1a1a;
      background: #ffd84a;
      opacity: 0.9;
    }
    /* Power-Ups effect badge: stacked chips with a countdown, mirroring the
       mode badge at bottom-left. The 'bottom-right-corner' placement is the
       default; the element is hidden while no effect is active. */
    #pong-effect-badge {
      position: absolute;
      /* Sits over the screen's bottom-right corner (the screen spans x 70-630,
         y 118-538 of the 700x790 cabinet), 10 units in from each edge. */
      right: calc(80 * var(--u));
      bottom: calc(262 * var(--u));
      z-index: 5;
      pointer-events: none;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: calc(4 * var(--u));
      font-family: monospace;
      font-size: calc(13 * var(--u));
      letter-spacing: 0.06em;
    }
    #pong-effect-badge[hidden] { display: none; }
    /* 'top-centre' placement: a row of chips along the top centre of the
       screen (x 70-630, y 118-538 of the cabinet), 10 units below its top edge. */
    #pong-effect-badge[data-placement="top-centre"] {
      left: calc(350 * var(--u));
      right: auto;
      top: calc(128 * var(--u));
      bottom: auto;
      transform: translateX(-50%);
      flex-direction: row;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }
    /* 'beside-player-paddle' placement: the chips are drawn on the canvas next
       to the player's paddle (lib/effect-badge-placements/beside-player-paddle.js),
       so the DOM badge stays out of the way. */
    #pong-effect-badge[data-placement="beside-player-paddle"] { display: none; }
    .pong-effect-chip {
      padding: calc(3 * var(--u)) calc(10 * var(--u));
      border-radius: calc(10 * var(--u));
      color: #1a1a1a;
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div id="pong-stars-far" class="pong-stars" aria-hidden="true"></div>
  <div id="pong-stars-mid" class="pong-stars" aria-hidden="true"></div>
  <div id="pong-stars-near" class="pong-stars" aria-hidden="true"></div>
  <div id="pong-cabinet">
    <div id="pong-marquee">PONG</div>
    <div id="pong-bezel"></div>
    <div id="pong-screen">
      <canvas id="gameCanvas"></canvas>
    </div>
    <div id="pong-effect-badge" data-placement="bottom-right-corner" hidden></div>
    <div id="pong-control-panel">
      <div id="pong-panel-button" role="button" tabindex="0" aria-label="Fun mode: start a new game in a random mode" title="Fun mode: start a new game in a random mode"></div>
      <div id="pong-panel-readout">
        <p id="pong-streak"></p>
        <p id="pong-streak-note"></p>
        <p id="pong-control-hints">Move: W/S or ↑/↓ &nbsp;•&nbsp; Space to play again</p>
        <p id="pong-best-rally"></p>
      </div>
      <div id="pong-panel-joystick"></div>
    </div>
    <div id="pong-cabinet-base"></div>
  </div>

  <script src="/engagement-client.js"></script>
  <script src="/lib/effect-badge-placements/beside-player-paddle.js"></script>
  <script src="/lib/ghost-balls/on.js"></script>
  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score
    const BIG_PADDLE_FACTOR = 1.6;   // player paddle height multiplier in 'bigPaddle' mode
    const EXTRA_BALL_COUNT  = 2;     // balls added to the primary one in 'multiBall' mode
    const EXTRA_BALL_SPREAD = 40;    // px between stacked balls at serve in 'multiBall' mode
    const PICKUP_SIZE       = 24;    // px, side of a 'powerUps' pickup square
    const SLOW_MO_FACTOR    = 0.5;   // ball time scale while Slow-Mo is active
    const GHOST_NOISE       = 140;   // px, max offset of the AI's ghost target
    const GHOST_REROLL_S    = 0.6;   // seconds the AI's ghost target stays stale
    const SPLASH_MS         = 1500;  // how long the mode name is shown large at game start
    const FUN_BUTTON_DEBOUNCE_MS = 400;  // ignore a second fun-button trigger inside this window

    // The 'powerUps' mode's four timed pickups (mirrors game-logic.js).
    const POWER_UP_KINDS = {
      slowMo:    { name: 'Slow-Mo',    colour: '#4fc3f7' },
      ghostBall: { name: 'Ghost Ball', colour: '#ce93d8' },
      bigPaddle: { name: 'Big Paddle', colour: '#81c784' },
      freezeAi:  { name: 'Freeze AI',  colour: '#ffffff' },
    };
    const POWER_UP_KEYS = Object.keys(POWER_UP_KINDS);

    // Pickup spawn rate and effect lengths: the 'steady' pacing, replaced by the
    // server's setting from GET /api/config (see loadPowerUpConfig).
    const DEFAULT_PACING = {
      pacing: 'steady',
      spawnIntervalS: 6,
      pickupLifetimeS: 8,
      effectDurationsS: { slowMo: 5, ghostBall: 5, bigPaddle: 5, freezeAi: 2 },
    };
    let powerUpPacing = DEFAULT_PACING;

    // Which pickups can spawn: the 'original-four' set, replaced by the server's
    // setting from GET /api/config (see loadPowerUpConfig).
    const DEFAULT_POWER_UP_SET = {
      set: 'original-four',
      kinds: ['slowMo', 'ghostBall', 'bigPaddle', 'freezeAi'],
    };
    let powerUpSet = DEFAULT_POWER_UP_SET;

    // Fixed rectangles in the middle of the field for 'bouncyBarriers' mode.
    // They leave the centre spawn point clear.
    const BARRIER_LAYOUT = [
      { x: 380, y: 120, w: 40, h: 110 },
      { x: 380, y: 370, w: 40, h: 110 },
      { x: 250, y: 270, w: 20, h: 60 },
      { x: 530, y: 270, w: 20, h: 60 },
    ];

    // Longest nickname the Settings modal accepts — mirrors
    // NICKNAME_MAX_LENGTH in server.js so the live character count never
    // shows a value the server would go on to reject.
    const NICKNAME_MAX_LENGTH = 20;

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject pulsing button animation style ─────────────────────────────────
    //
    // A <style> tag is injected once into <head> so the 'Play Again' button can
    // use a CSS keyframe animation without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }
        #pong-overlay {
          position: absolute;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.72);
          backdrop-filter: blur(2px);
          gap: calc(12 * var(--u));
          font-family: monospace;
        }
        #pong-overlay h1 {
          font-size: calc(40 * var(--u));
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: calc(14 * var(--u));
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: calc(12 * var(--u));
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-overlay .personal-best {
          font-size: calc(13 * var(--u));
          color: rgba(255,255,255,0.6);
          letter-spacing: 0.06em;
          margin-top: -6px;
        }
        #pong-overlay .last-played {
          font-size: calc(12 * var(--u));
          color: rgba(255,255,255,0.5);
          letter-spacing: 0.05em;
          margin-top: -6px;
        }
        #pong-overlay .signin-link {
          font-size: calc(12 * var(--u));
          color: #ffe066;
          letter-spacing: 0.05em;
          margin-top: -6px;
          text-decoration: underline;
        }
        #pong-overlay .signin-link:hover,
        #pong-overlay .signin-link:focus {
          color: #fff;
        }
        #pong-play-again {
          margin-top: calc(4 * var(--u));
          padding: calc(12 * var(--u)) calc(32 * var(--u));
          font-family: monospace;
          font-size: calc(14 * var(--u));
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Auth bar (Google OAuth) ─────────────────────────────────────── */
        #pong-auth-bar {
          position: fixed;
          top: 14px;
          right: 16px;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 10px;
          font-family: monospace;
        }
        .pong-auth-btn {
          padding: 8px 16px;
          font-family: monospace;
          font-size: 0.8rem;
          font-weight: bold;
          letter-spacing: 0.05em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s, opacity 0.15s;
        }
        .pong-auth-btn:hover,
        .pong-auth-btn:focus {
          background: #ffe066;
          outline: none;
        }
        .pong-auth-btn:disabled {
          opacity: 0.6;
          cursor: default;
        }
        .pong-auth-btn-ghost {
          background: transparent;
          color: rgba(255,255,255,0.7);
          border: 1px solid rgba(255,255,255,0.35);
