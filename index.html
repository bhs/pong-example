<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject pulsing button animation style ─────────────────────────────────
    //
    // A <style> tag is injected once into <head> so the 'Play Again' button can
    // use a CSS keyframe animation without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }
        #pong-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.72);
          backdrop-filter: blur(2px);
          gap: 18px;
          font-family: monospace;
        }
        #pong-overlay h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: clamp(1rem, 3vw, 1.5rem);
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-play-again {
          margin-top: 8px;
          padding: 14px 40px;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Auth bar (Google OAuth) ─────────────────────────────────────── */
        #pong-auth-bar {
          position: fixed;
          top: 14px;
          right: 16px;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 10px;
          font-family: monospace;
        }
        .pong-auth-btn {
          padding: 8px 16px;
          font-family: monospace;
          font-size: 0.8rem;
          font-weight: bold;
          letter-spacing: 0.05em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s, opacity 0.15s;
        }
        .pong-auth-btn:hover,
        .pong-auth-btn:focus {
          background: #ffe066;
          outline: none;
        }
        .pong-auth-btn:disabled {
          opacity: 0.6;
          cursor: default;
        }
        .pong-auth-btn-ghost {
          background: transparent;
          color: rgba(255,255,255,0.7);
          border: 1px solid rgba(255,255,255,0.35);
        }
        .pong-auth-btn-ghost:hover,
        .pong-auth-btn-ghost:focus {
          background: rgba(255,255,255,0.1);
          color: #fff;
        }
        #pong-user-avatar {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 1px solid rgba(255,255,255,0.4);
        }
        #pong-user-label {
          color: rgba(255,255,255,0.85);
          font-size: 0.8rem;
          letter-spacing: 0.03em;
          max-width: 160px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
      `;
      document.head.appendChild(style);
    })();

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in small, independent modules below
    // (ball / paddle / score / rally / game phase), each owning only its own
    // slice and each registering its own 'game:restart' listener.
    //
    // ── GameController (event-driven restart) ───────────────────────────────
    //
    // A tiny in-file pub/sub hub. Instead of a monolithic "reset everything"
    // pass, the controller only ever broadcasts a single 'game:restart'
    // CustomEvent — every module below (ball / paddle / score / rally / game
    // phase) independently listens for it and resets *only* its own local
    // state. Nothing here needs to know what ball.js or paddle.js contain,
    // which is what makes it easy to bolt on more listeners later (e.g. a
    // multiplayer reset, or a pause/resume module) without touching this file.
    //
    // `running` is the flag the main loop checks each frame: false pauses
    // requestAnimationFrame scheduling (game-over) and true resumes it
    // (restart) — no full re-initialization pass is required either way.
    const GameController = Object.assign(new EventTarget(), {
      running: true,

      /**
       * Wire up the Space-key restart shortcut once. This is deliberately
       * the only restart trigger registered here — the 'Play Again' button
       * itself is created fresh inside a new overlay each game-over, so it
       * attaches its own click listener directly (see showGameOverOverlay).
       * Both paths ultimately call startNewGame(), which removes the
       * overlay, broadcasts 'game:restart', and resumes the RAF loop.
       */
      init() {
        window.addEventListener('keydown', (e) => {
          if (e.code === 'Space' && !this.running) {
            startNewGame();
          }
        });
      },

      /** Pause the RAF loop (called once when a game-over is reached). */
      pause() {
        this.running = false;
      },

      /** Broadcast a restart request, then resume the loop. */
      restart() {
        this.dispatchEvent(new CustomEvent('game:restart'));
        this.running = true;
      },
    });

    // ── Preferences ───────────────────────────────────────────────────────────
    //
    // Settings that must survive a restart untouched. No 'game:restart'
    // listener below ever writes to this object — restart only resets
    // gameplay state (ball / paddle / score / rally / phase), never
    // configuration — which is exactly what keeps preferences stable across
    // a full restart cycle.
    const preferences = {
      scoreToWin: SCORE_WIN,
      aiLerp:     AI_LERP,
    };

    // ── Ball module ───────────────────────────────────────────────────────────
    //
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // On restart the ball only resets its own position/velocity — it has no
    // opinion on scores, paddle positions, or preferences.
    GameController.addEventListener('game:restart', () => {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = 0;
      ball.angle = 0;
      ball.vx    = 0;
      ball.vy    = 0;
    });

    // ── Paddle module ─────────────────────────────────────────────────────────
    //
    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
    };

    // On restart, paddles only re-centre themselves vertically.
    GameController.addEventListener('game:restart', () => {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
    });

    // ── Score module ──────────────────────────────────────────────────────────
    //
    // Scores live in their own module-scoped object, decoupled from the
    // paddles, so a restart can zero them out without the paddle module
    // needing to know scores exist at all.
    const scoreboard = {
      player: 0,
      ai:     0,
    };

    // On restart the score module only zeroes its own two counters.
    GameController.addEventListener('game:restart', () => {
      scoreboard.player = 0;
      scoreboard.ai     = 0;
    });

    // ── Game-phase module ─────────────────────────────────────────────────────
    //
    // gamePhase can be: 'playing' | 'scored' | 'gameover'
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    GameController.addEventListener('game:restart', () => {
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
    });

    // ── Rally module ──────────────────────────────────────────────────────────
    //
    // Tracks consecutive paddle hits for difficulty escalation and the short
    // score-flash effect.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    GameController.addEventListener('game:restart', () => {
      rally.rallyCount  = 0;
      rally.flashFrames = 0;
    });

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Wire up the Space-key / Play-Again restart triggers (see above).
    GameController.init();

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * Returns a value in [-MAX_DEFLECT_ANGLE, +MAX_DEFLECT_ANGLE].
     */
    function deflectAngle(relY) {
      const norm = clamp(relY / (PADDLE_H / 2), -1, 1);
      return norm * MAX_DEFLECT_ANGLE;
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     * Resets the rally counter.
     */
    function resetBall(dirSign) {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = BALL_SPEED_INIT;
      rally.rallyCount = 0;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      ball.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(ball);
    }

    /**
     * Ask every module to reset its own local state for a fresh game.
     *
     * Rather than reaching into ball / paddle / score / rally / game and
     * mutating each one directly, this broadcasts a single 'game:restart'
     * event via the GameController — the listeners registered alongside
     * each module (above) do the actual resetting. Preferences are never
     * touched by any of them.
     */
    function resetGame() {
      GameController.restart();
    }

    // ── Live-traffic experiment instrumentation ─────────────────────────────
    //
    // Reports the declared events for this hop's experiment (see
    // mendel-metrics.js on the server):
    //   game_over_shown   — the overlay above was just displayed
    //   play_again_click  — Play Again was clicked, or Space was pressed
    //   page_reload       — the page was reloaded while a game-over overlay
    //                        was showing, instead of using Play Again
    //
    // sessionStorage (survives a reload, cleared per-tab) is used to detect
    // the "reload instead of Play Again" case: the flag is set the moment
    // the overlay appears and cleared the moment Play Again is used. If the
    // flag is still set on the very next page load, a reload happened first.

    const GAME_OVER_FLAG_KEY = 'pong_game_over_shown';

    /** POST a declared event type to the server. Never throws. */
    function reportEvent(type) {
      try {
        fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ type }),
          keepalive: true,
        }).catch(() => {});
      } catch (err) {
        // never let telemetry break the game
      }
    }

    function markGameOverShown() {
      try { sessionStorage.setItem(GAME_OVER_FLAG_KEY, '1'); } catch (err) {}
      reportEvent('game_over_shown');
    }

    function clearGameOverFlag() {
      try { sessionStorage.removeItem(GAME_OVER_FLAG_KEY); } catch (err) {}
    }

    // Run once at script load: if the flag from a previous game-over is
    // still set, the player reloaded the page instead of clicking Play
    // Again (or pressing Space).
    (function detectReloadAfterGameOver() {
      try {
        if (sessionStorage.getItem(GAME_OVER_FLAG_KEY) === '1') {
          reportEvent('page_reload');
          sessionStorage.removeItem(GAME_OVER_FLAG_KEY);
        }
      } catch (err) {
        // sessionStorage unavailable (e.g. privacy mode) — nothing to detect
      }
    })();

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a full-screen semi-transparent div injected
    // into the document via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the full-screen game-over overlay.
     * Attaches a 'Play Again' button that calls startNewGame() on click.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();
      markGameOverShown();

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      document.body.appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    // ── Auth bar (Google OAuth) ─────────────────────────────────────────────
    //
    // A small fixed panel in the top-right corner shows either a
    // 'Sign in with Google' button (signed out) or the user's avatar/email
    // plus 'Save Score' and 'Log out' buttons (signed in). Session state is
    // fetched from GET /me on load — the actual login state lives in an
    // HttpOnly cookie set by the server, so the client never touches tokens.

    /**
     * Create (or return the existing) auth bar container element.
     */
    function getAuthBar() {
      let bar = document.getElementById('pong-auth-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'pong-auth-bar';
        document.body.appendChild(bar);
      }
      return bar;
    }

    /**
     * Render the signed-out state: a single 'Sign in with Google' button
     * that navigates to the server-side OAuth redirect endpoint.
     */
    function renderSignedOut(bar) {
      bar.innerHTML = '';

      const btn = document.createElement('button');
      btn.id = 'pong-google-signin';
      btn.className = 'pong-auth-btn';
      btn.textContent = 'Sign in with Google';
      btn.addEventListener('click', () => {
        window.location.href = '/auth/google';
      });
      bar.appendChild(btn);
    }

    /**
     * Render the signed-in state: avatar (if any), display name/email,
     * a 'Save Score' button, and a 'Log out' button.
     *
     * @param {HTMLElement} bar
     * @param {{id:string, email:?string, name:?string, avatar:?string}} user
     */
    function renderSignedIn(bar, user) {
      bar.innerHTML = '';

      if (user.avatar) {
        const img = document.createElement('img');
        img.id = 'pong-user-avatar';
        img.src = user.avatar;
        img.alt = user.name || user.email || 'Signed-in user avatar';
        bar.appendChild(img);
      }

      const label = document.createElement('span');
      label.id = 'pong-user-label';
      label.textContent = user.name || user.email || 'Signed in';
      bar.appendChild(label);

      const saveBtn = document.createElement('button');
      saveBtn.id = 'pong-save-score';
      saveBtn.className = 'pong-auth-btn';
      saveBtn.textContent = 'Save Score';
      saveBtn.addEventListener('click', () => saveScore(saveBtn));
      bar.appendChild(saveBtn);

      const logoutBtn = document.createElement('button');
      logoutBtn.id = 'pong-logout';
      logoutBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      logoutBtn.textContent = 'Log out';
      logoutBtn.addEventListener('click', () => {
        window.location.href = '/auth/logout';
      });
      bar.appendChild(logoutBtn);
    }

    /**
     * POST the player's current score to the server. No player name is
     * sent — the server resolves identity from the HttpOnly session cookie
     * established during Google OAuth login.
     *
     * @param {HTMLButtonElement} btn
     */
    async function saveScore(btn) {
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ score: scoreboard.player }),
        });
        btn.textContent = res.ok ? 'Saved!' : 'Failed';
      } catch (err) {
        btn.textContent = 'Failed';
      } finally {
        setTimeout(() => {
          btn.textContent = original;
          btn.disabled = false;
        }, 1500);
      }
    }

    /**
     * Fetch the current session's user (if any) from GET /me and render
     * the appropriate auth bar state. Called once on page load.
     */
    async function initAuthBar() {
      const bar = getAuthBar();
      try {
        const res  = await fetch('/me', { credentials: 'same-origin' });
        const data = await res.json();
        if (data && data.user) {
          renderSignedIn(bar, data.user);
        } else {
          renderSignedOut(bar);
        }
      } catch (err) {
        renderSignedOut(bar);
      }
    }

    initAuthBar();

    /**
     * Tear down the current overlay, reset all state, and restart the animation loop.
     * Called by the 'Play Again' button click and the Space keyboard shortcut.
     */
    function startNewGame() {
      reportEvent('play_again_click');
      clearGameOverFlag();
      removeGameOverOverlay();
      resetGame();
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The main loop checks GameController.running each frame and stops
      // scheduling itself once it's false, so update() is not even called
      // while paused — this check just guards a stray call defensively.
      if (game.phase === 'gameover' || !GameController.running) return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = scoreboard.ai > scoreboard.player ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — lerp toward ball centre; lerp speed increases
      // slightly each rally hit (difficulty escalation).
      const ballCentreY   = ball.y + BALL_SIZE / 2;
      const aiCentreY     = aiPaddle.y + PADDLE_H / 2;
      const aiDiff        = ballCentreY - aiCentreY;
      const effectiveLerp = preferences.aiLerp + rally.rallyCount * AI_LERP_RALLY_INC;
      const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (ball.y <= 0) {
        ball.y     = 0;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y     = CANVAS_H - BALL_SIZE;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      }

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        ball.vx < 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        ball.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (ball.y + BALL_SIZE / 2) - (playerPaddle.y + PADDLE_H / 2);
        ball.angle  = deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        ball.vx > 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        ball.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (ball.y + BALL_SIZE / 2) - (aiPaddle.y + PADDLE_H / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        ball.angle  = Math.PI - deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        scoreboard.ai += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (scoreboard.ai >= preferences.scoreToWin) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        scoreboard.player += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (scoreboard.player >= preferences.scoreToWin) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to black
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(scoreboard.player, CANVAS_W / 4, 20);
      ctx.fillText(scoreboard.ai, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = '#fff';
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // The loop checks GameController.running each frame — it's set to false
    // the moment game.phase becomes 'gameover' (pausing the loop and showing
    // the HTML overlay) and back to true by GameController.restart() (Play
    // Again click / Space press), which resumes scheduling without needing
    // a full re-initialization pass.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      if (game.phase === 'gameover' && GameController.running) {
        // Pause the loop and present the DOM overlay
        GameController.pause();
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        showGameOverOverlay(winnerLabel, scoreboard.player, scoreboard.ai);
      }

      if (!GameController.running) {
        rafId = null;
        return; // do NOT schedule next frame while paused
      }

      rafId = requestAnimationFrame(loop);
    }

    // Kick off the animation loop
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
