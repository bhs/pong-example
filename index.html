<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    'use strict';

    // ── MockBackend ───────────────────────────────────────────────────────────
    //
    // In-memory mock backend that mimics a REST API with async methods.
    // All data lives in module-scope Maps/arrays and persists for the lifetime
    // of the browser tab.  Passwords are hashed with the Web Crypto API.
    // The "token" is a base64-encoded user ID — no JWT library needed.
    //
    // API surface (mirrors a real fetch()-based API so swapping in a real
    // backend only requires updating this class, not the game or UI code):
    //
    //   register(email, password)         → { ok, error? }
    //   login(email, password)            → { ok, token?, error? }
    //   getScores()                       → { ok, scores: [{email, score, date}] }
    //   postScore(token, score)           → { ok, error? }

    class MockBackend {
      constructor() {
        // Map<email, { id: number, email: string, passwordHash: ArrayBuffer }>
        this._users  = new Map();
        // Array<{ userId: number, email: string, score: number, date: string }>
        this._scores = [];
        this._nextId = 1;
      }

      // ── Internal helpers ────────────────────────────────────────────────────

      /**
       * Hash a UTF-8 password string with SHA-256 via the Web Crypto API.
       * Returns a Promise<ArrayBuffer>.
       */
      async _hashPassword(password) {
        const encoded = new TextEncoder().encode(password);
        return crypto.subtle.digest('SHA-256', encoded);
      }

      /**
       * Constant-time-ish comparison of two ArrayBuffers (avoids early-exit).
       */
      _buffersEqual(a, b) {
        if (a.byteLength !== b.byteLength) return false;
        const va = new Uint8Array(a);
        const vb = new Uint8Array(b);
        let diff = 0;
        for (let i = 0; i < va.length; i++) {
          diff |= va[i] ^ vb[i];
        }
        return diff === 0;
      }

      /**
       * Encode a numeric user ID as a base64 string to use as a token.
       * Format: base64(userId + ':' + email) — opaque to callers.
       */
      _makeToken(userId, email) {
        const raw = `${userId}:${email}`;
        return btoa(raw);
      }

      /**
       * Decode a token back to { userId, email }, or null if malformed.
       */
      _decodeToken(token) {
        try {
          const raw   = atob(token);
          const colon = raw.indexOf(':');
          if (colon === -1) return null;
          const userId = parseInt(raw.slice(0, colon), 10);
          const email  = raw.slice(colon + 1);
          return { userId, email };
        } catch (_) {
          return null;
        }
      }

      // ── Public API ──────────────────────────────────────────────────────────

      /**
       * Register a new user.
       * Resolves with { ok: true } or { ok: false, error: string }.
       */
      async register(email, password) {
        if (!email || !password) {
          return { ok: false, error: 'Email and password are required.' };
        }
        if (this._users.has(email)) {
          return { ok: false, error: 'An account with that email already exists.' };
        }
        const passwordHash = await this._hashPassword(password);
        const id = this._nextId++;
        this._users.set(email, { id, email, passwordHash });
        return { ok: true };
      }

      /**
       * Log in an existing user.
       * Resolves with { ok: true, token: string } or { ok: false, error: string }.
       */
      async login(email, password) {
        if (!email || !password) {
          return { ok: false, error: 'Email and password are required.' };
        }
        const user = this._users.get(email);
        if (!user) {
          return { ok: false, error: 'Invalid email or password.' };
        }
        const hash = await this._hashPassword(password);
        if (!this._buffersEqual(hash, user.passwordHash)) {
          return { ok: false, error: 'Invalid email or password.' };
        }
        const token = this._makeToken(user.id, user.email);
        return { ok: true, token };
      }

      /**
       * Fetch the global leaderboard (all scores, newest first, top 10).
       * Resolves with { ok: true, scores: Array<{email, score, date}> }.
       */
      async getScores() {
        const sorted = this._scores
          .slice()
          .sort((a, b) => b.score - a.score || new Date(b.date) - new Date(a.date))
          .slice(0, 10)
          .map(({ email, score, date }) => ({ email, score, date }));
        return { ok: true, scores: sorted };
      }

      /**
       * Submit a score for the authenticated user.
       * token: the token returned by login().
       * score: numeric score to record.
       * Resolves with { ok: true } or { ok: false, error: string }.
       */
      async postScore(token, score) {
        if (!token) {
          return { ok: false, error: 'Not authenticated.' };
        }
        const decoded = this._decodeToken(token);
        if (!decoded) {
          return { ok: false, error: 'Invalid token.' };
        }
        const { email } = decoded;
        if (!this._users.has(email)) {
          return { ok: false, error: 'User not found.' };
        }
        this._scores.push({
          userId: decoded.userId,
          email,
          score: Number(score),
          date: new Date().toISOString(),
        });
        return { ok: true };
      }
    }

    // Single module-level backend instance — persists for the tab's lifetime.
    const backend = new MockBackend();

    // ── Auth state ────────────────────────────────────────────────────────────
    //
    // Holds the current session token and email after login.
    // null when the user is not logged in (guest mode — can play but cannot save).

    const auth = {
      token: null,
      email: null,
    };

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject overlay and auth styles ────────────────────────────────────────
    //
    // A <style> tag is injected once into <head> so overlays can use CSS
    // keyframe animations without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }

        /* ── Shared overlay backdrop ── */
        #pong-overlay,
        #pong-auth-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.82);
          backdrop-filter: blur(2px);
          gap: 14px;
          font-family: monospace;
        }

        /* ── Game-over overlay ── */
        #pong-overlay h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: clamp(1rem, 3vw, 1.5rem);
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-overlay .leaderboard {
          min-width: 260px;
          max-width: 340px;
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.15);
          border-radius: 6px;
          padding: 12px 16px;
          margin-top: 4px;
        }
        #pong-overlay .leaderboard h2 {
          font-size: 0.8rem;
          color: rgba(255,255,255,0.5);
          letter-spacing: 0.12em;
          text-transform: uppercase;
          margin-bottom: 8px;
          text-align: center;
        }
        #pong-overlay .leaderboard ol {
          list-style: decimal inside;
          padding: 0;
        }
        #pong-overlay .leaderboard li {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.8);
          padding: 3px 0;
          display: flex;
          justify-content: space-between;
          gap: 12px;
        }
        #pong-overlay .leaderboard li .lb-email {
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          flex: 1;
          color: rgba(255,255,255,0.55);
        }
        #pong-overlay .leaderboard li .lb-score {
          font-weight: bold;
          color: #ffe066;
          flex-shrink: 0;
        }
        #pong-overlay .score-status {
          font-size: 0.8rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          text-align: center;
        }
        #pong-play-again {
          margin-top: 4px;
          padding: 14px 40px;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Auth overlay ── */
        #pong-auth-overlay h1 {
          font-size: clamp(1.6rem, 4vw, 2.4rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 20px rgba(255,255,255,0.4);
          text-align: center;
          margin-bottom: 4px;
        }
        #pong-auth-overlay .auth-subtitle {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.06em;
          text-align: center;
        }
        .auth-form {
          display: flex;
          flex-direction: column;
          gap: 10px;
          width: min(320px, 90vw);
          margin-top: 4px;
        }
        .auth-form input[type="email"],
        .auth-form input[type="password"] {
          padding: 10px 12px;
          font-family: monospace;
          font-size: 0.95rem;
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.25);
          border-radius: 4px;
          color: #fff;
          outline: none;
          transition: border-color 0.15s;
        }
        .auth-form input:focus {
          border-color: rgba(255,255,255,0.6);
        }
        .auth-form input::placeholder {
          color: rgba(255,255,255,0.3);
        }
        .auth-btn-row {
          display: flex;
          gap: 8px;
          margin-top: 4px;
        }
        .auth-btn {
          flex: 1;
          padding: 11px 0;
          font-family: monospace;
          font-size: 0.95rem;
          font-weight: bold;
          letter-spacing: 0.08em;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s, opacity 0.15s;
        }
        .auth-btn:disabled {
          opacity: 0.45;
          cursor: default;
        }
        .auth-btn-primary {
          background: #fff;
          color: #000;
        }
        .auth-btn-primary:hover:not(:disabled),
        .auth-btn-primary:focus:not(:disabled) {
          background: #ffe066;
          outline: none;
        }
        .auth-btn-secondary {
          background: rgba(255,255,255,0.1);
          color: rgba(255,255,255,0.75);
          border: 1px solid rgba(255,255,255,0.2);
        }
        .auth-btn-secondary:hover:not(:disabled),
        .auth-btn-secondary:focus:not(:disabled) {
          background: rgba(255,255,255,0.2);
          outline: none;
        }
        .auth-error {
          font-size: 0.82rem;
          color: #ff6b6b;
          text-align: center;
          min-height: 1.1em;
          letter-spacing: 0.03em;
        }
        .auth-skip {
          font-size: 0.8rem;
          color: rgba(255,255,255,0.3);
          cursor: pointer;
          background: none;
          border: none;
          font-family: monospace;
          letter-spacing: 0.05em;
          text-decoration: underline;
          padding: 0;
          transition: color 0.15s;
        }
        .auth-skip:hover {
          color: rgba(255,255,255,0.6);
        }
        .auth-user-badge {
          position: fixed;
          top: 10px;
          right: 14px;
          z-index: 5;
          font-family: monospace;
          font-size: 0.75rem;
          color: rgba(255,255,255,0.35);
          letter-spacing: 0.04em;
        }
      `;
      document.head.appendChild(style);
    })();

    // ── Auth UI ───────────────────────────────────────────────────────────────
    //
    // Full-screen overlay shown before the first game.  The player can register,
    // log in, or skip (guest mode).  Guest mode allows play but disables score
    // submission.  Wired exclusively through MockBackend — swap the backend
    // instance to connect to a real server with zero game-code changes.

    /**
     * Show the auth overlay.  Resolves once the user has logged in, registered,
     * or clicked "Play as Guest".
     * Returns a Promise that resolves when the overlay is dismissed.
     */
    function showAuthOverlay() {
      return new Promise((resolve) => {
        removeAuthOverlay();

        const overlay = document.createElement('div');
        overlay.id = 'pong-auth-overlay';

        // Title
        const h1 = document.createElement('h1');
        h1.textContent = 'PONG';
        overlay.appendChild(h1);

        const subtitle = document.createElement('p');
        subtitle.className = 'auth-subtitle';
        subtitle.textContent = 'Log in or register to save your scores';
        overlay.appendChild(subtitle);

        // Form
        const form = document.createElement('div');
        form.className = 'auth-form';

        const emailInput = document.createElement('input');
        emailInput.type        = 'email';
        emailInput.placeholder = 'Email';
        emailInput.autocomplete = 'email';
        form.appendChild(emailInput);

        const passwordInput = document.createElement('input');
        passwordInput.type        = 'password';
        passwordInput.placeholder = 'Password';
        passwordInput.autocomplete = 'current-password';
        form.appendChild(passwordInput);

        // Error message
        const errorEl = document.createElement('p');
        errorEl.className = 'auth-error';
        form.appendChild(errorEl);

        // Buttons row
        const btnRow = document.createElement('div');
        btnRow.className = 'auth-btn-row';

        const loginBtn = document.createElement('button');
        loginBtn.className = 'auth-btn auth-btn-primary';
        loginBtn.textContent = 'Log In';

        const registerBtn = document.createElement('button');
        registerBtn.className = 'auth-btn auth-btn-secondary';
        registerBtn.textContent = 'Register';

        btnRow.appendChild(loginBtn);
        btnRow.appendChild(registerBtn);
        form.appendChild(btnRow);

        overlay.appendChild(form);

        // Skip / guest mode
        const skipBtn = document.createElement('button');
        skipBtn.className = 'auth-skip';
        skipBtn.textContent = 'Play as Guest (scores not saved)';
        overlay.appendChild(skipBtn);

        document.body.appendChild(overlay);
        emailInput.focus();

        // ── Shared helpers ──────────────────────────────────────────────────

        function setLoading(loading) {
          loginBtn.disabled    = loading;
          registerBtn.disabled = loading;
          skipBtn.disabled     = loading;
          emailInput.disabled  = loading;
          passwordInput.disabled = loading;
        }

        function showError(msg) {
          errorEl.textContent = msg;
        }

        function dismiss(token, email) {
          auth.token = token || null;
          auth.email = email || null;
          removeAuthOverlay();
          updateUserBadge();
          resolve();
        }

        // ── Login ───────────────────────────────────────────────────────────

        async function handleLogin() {
          showError('');
          setLoading(true);
          const result = await backend.login(
            emailInput.value.trim(),
            passwordInput.value
          );
          setLoading(false);
          if (result.ok) {
            dismiss(result.token, emailInput.value.trim());
          } else {
            showError(result.error);
          }
        }

        // ── Register ────────────────────────────────────────────────────────

        async function handleRegister() {
          showError('');
          setLoading(true);
          const email    = emailInput.value.trim();
          const password = passwordInput.value;
          const regResult = await backend.register(email, password);
          if (!regResult.ok) {
            setLoading(false);
            showError(regResult.error);
            return;
          }
          // Auto-login after successful registration
          const loginResult = await backend.login(email, password);
          setLoading(false);
          if (loginResult.ok) {
            dismiss(loginResult.token, email);
          } else {
            showError(loginResult.error);
          }
        }

        // ── Event bindings ──────────────────────────────────────────────────

        loginBtn.addEventListener('click', handleLogin);
        registerBtn.addEventListener('click', handleRegister);
        skipBtn.addEventListener('click', () => dismiss(null, null));

        // Submit on Enter key
        function handleKey(e) {
          if (e.key === 'Enter') handleLogin();
        }
        emailInput.addEventListener('keydown', handleKey);
        passwordInput.addEventListener('keydown', handleKey);
      });
    }

    /**
     * Remove the auth overlay if it exists.
     */
    function removeAuthOverlay() {
      const el = document.getElementById('pong-auth-overlay');
      if (el) el.remove();
    }

    /**
     * Update (or create) the small "logged in as …" badge in the top-right corner.
     */
    function updateUserBadge() {
      let badge = document.getElementById('pong-user-badge');
      if (!badge) {
        badge = document.createElement('div');
        badge.id = 'pong-user-badge';
        badge.className = 'auth-user-badge';
        document.body.appendChild(badge);
      }
      badge.textContent = auth.email ? `▶ ${auth.email}` : '';
    }

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.
    //
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // gameState can be: 'playing' | 'scored' | 'gameover'
    // (replaces the original 'won' phase; the overlay handles that display layer)
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    // Rally state — tracks consecutive paddle hits for difficulty escalation
    // and the short score-flash effect.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      // Space triggers restart when overlay is visible (accessibility shortcut)
      if (e.code === 'Space' && game.phase === 'gameover') {
        startNewGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * Returns a value in [-MAX_DEFLECT_ANGLE, +MAX_DEFLECT_ANGLE].
     */
    function deflectAngle(relY) {
      const norm = clamp(relY / (PADDLE_H / 2), -1, 1);
      return norm * MAX_DEFLECT_ANGLE;
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     * Resets the rally counter.
     */
    function resetBall(dirSign) {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = BALL_SPEED_INIT;
      rally.rallyCount = 0;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      ball.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(ball);
    }

    /**
     * Reset both paddles and scores; start fresh.
     */
    function resetGame() {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
      rally.rallyCount  = 0;
      rally.flashFrames = 0;
    }

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a full-screen semi-transparent div injected
    // into the document via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the full-screen game-over overlay.
     * Submits the player's score (if authenticated) then fetches and renders
     * the leaderboard.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    async function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Score submission status
      const statusEl = document.createElement('p');
      statusEl.className = 'score-status';
      overlay.appendChild(statusEl);

      // Leaderboard placeholder
      const lbEl = document.createElement('div');
      lbEl.className = 'leaderboard';
      const lbTitle = document.createElement('h2');
      lbTitle.textContent = 'Leaderboard';
      lbEl.appendChild(lbTitle);
      const lbList = document.createElement('ol');
      lbEl.appendChild(lbList);
      overlay.appendChild(lbEl);

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      document.body.appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();

      // ── Score submission ──────────────────────────────────────────────────
      // Call postScore exactly as we would with a real fetch()-based backend.

      if (auth.token && game.winner === 'player') {
        statusEl.textContent = 'Saving score…';
        const postResult = await backend.postScore(auth.token, playerScore);
        if (postResult.ok) {
          statusEl.textContent = `Score saved! (${auth.email})`;
        } else {
          statusEl.textContent = `Could not save score: ${postResult.error}`;
        }
      } else if (!auth.token) {
        statusEl.textContent = 'Log in to save your score.';
      }

      // ── Leaderboard ───────────────────────────────────────────────────────
      // Fetch scores exactly as we would from a real REST endpoint.

      const scoresResult = await backend.getScores();
      lbList.innerHTML = '';
      if (scoresResult.ok && scoresResult.scores.length > 0) {
        scoresResult.scores.forEach(({ email, score }) => {
          const li = document.createElement('li');

          const emailSpan = document.createElement('span');
          emailSpan.className = 'lb-email';
          emailSpan.textContent = email;

          const scoreSpan = document.createElement('span');
          scoreSpan.className = 'lb-score';
          scoreSpan.textContent = score;

          li.appendChild(emailSpan);
          li.appendChild(scoreSpan);
          lbList.appendChild(li);
        });
      } else {
        const empty = document.createElement('li');
        empty.style.color = 'rgba(255,255,255,0.3)';
        empty.style.listStyle = 'none';
        empty.style.textAlign = 'center';
        empty.textContent = 'No scores yet.';
        lbList.appendChild(empty);
      }
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    /**
     * Tear down the current overlay, reset all state, and restart the animation loop.
     * Called by the 'Play Again' button click and the Space keyboard shortcut.
     */
    function startNewGame() {
      removeGameOverOverlay();
      resetGame();
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The RAF loop is paused when gameover; nothing to update.
      if (game.phase === 'gameover') return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — lerp toward ball centre; lerp speed increases
      // slightly each rally hit (difficulty escalation).
      const ballCentreY   = ball.y + BALL_SIZE / 2;
      const aiCentreY     = aiPaddle.y + PADDLE_H / 2;
      const aiDiff        = ballCentreY - aiCentreY;
      const effectiveLerp = AI_LERP + rally.rallyCount * AI_LERP_RALLY_INC;
      const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (ball.y <= 0) {
        ball.y     = 0;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y     = CANVAS_H - BALL_SIZE;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      }

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        ball.vx < 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        ball.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (ball.y + BALL_SIZE / 2) - (playerPaddle.y + PADDLE_H / 2);
        ball.angle  = deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        ball.vx > 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        ball.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (ball.y + BALL_SIZE / 2) - (aiPaddle.y + PADDLE_H / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        ball.angle  = Math.PI - deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        playerPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to black
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = '#fff';
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // When game.phase becomes 'gameover' the loop stops scheduling itself and
    // shows the HTML overlay instead.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      if (game.phase === 'gameover') {
        // Pause the loop and present the DOM overlay
        rafId = null;
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        // showGameOverOverlay is async (score submission + leaderboard fetch)
        showGameOverOverlay(winnerLabel, playerPaddle.score, aiPaddle.score);
        return; // do NOT schedule next frame
      }

      rafId = requestAnimationFrame(loop);
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    //
    // Show the auth overlay first; start the game loop once it is dismissed.

    showAuthOverlay().then(() => {
      updateUserBadge();
      rafId = requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
