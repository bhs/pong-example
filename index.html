<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject pulsing button animation style ─────────────────────────────────
    //
    // A <style> tag is injected once into <head> so the 'Play Again' button can
    // use a CSS keyframe animation without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }
        #pong-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.72);
          backdrop-filter: blur(2px);
          gap: 18px;
          font-family: monospace;
        }
        #pong-overlay h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: clamp(1rem, 3vw, 1.5rem);
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-play-again {
          margin-top: 8px;
          padding: 14px 40px;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Auth bar (Google OAuth) ─────────────────────────────────────── */
        #pong-auth-bar {
          position: fixed;
          top: 14px;
          right: 16px;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 10px;
          font-family: monospace;
        }
        .pong-auth-btn {
          padding: 8px 16px;
          font-family: monospace;
          font-size: 0.8rem;
          font-weight: bold;
          letter-spacing: 0.05em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s, opacity 0.15s;
        }
        .pong-auth-btn:hover,
        .pong-auth-btn:focus {
          background: #ffe066;
          outline: none;
        }
        .pong-auth-btn:disabled {
          opacity: 0.6;
          cursor: default;
        }
        .pong-auth-btn-ghost {
          background: transparent;
          color: rgba(255,255,255,0.7);
          border: 1px solid rgba(255,255,255,0.35);
        }
        .pong-auth-btn-ghost:hover,
        .pong-auth-btn-ghost:focus {
          background: rgba(255,255,255,0.1);
          color: #fff;
        }
        #pong-user-avatar {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 1px solid rgba(255,255,255,0.4);
        }
        #pong-user-label {
          color: rgba(255,255,255,0.85);
          font-size: 0.8rem;
          letter-spacing: 0.03em;
          max-width: 160px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        /* ── Preferences modal ───────────────────────────────────────────── */
        .pong-modal-overlay {
          position: fixed;
          inset: 0;
          z-index: 30;
          display: flex;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.6);
          backdrop-filter: blur(2px);
        }
        .pong-modal-panel {
          display: flex;
          flex-direction: column;
          gap: 14px;
          min-width: 280px;
          padding: 24px 28px;
          background: #1a1a1a;
          border: 1px solid rgba(255,255,255,0.15);
          border-radius: 8px;
          font-family: monospace;
          box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .pong-modal-panel h2 {
          color: #fff;
          font-size: 1.1rem;
          letter-spacing: 0.05em;
          margin-bottom: 4px;
        }
        .pong-prefs-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 16px;
          color: rgba(255,255,255,0.85);
          font-size: 0.85rem;
        }
        .pong-prefs-row input[type="color"] {
          width: 44px;
          height: 28px;
          padding: 0;
          border: 1px solid rgba(255,255,255,0.3);
          border-radius: 4px;
          background: none;
          cursor: pointer;
        }
        .pong-prefs-presets {
          display: flex;
          gap: 10px;
          margin-top: 4px;
        }
        .pong-prefs-presets .pong-auth-btn {
          flex: 1;
        }
      `;
      document.head.appendChild(style);
    })();

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.
    //
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // gameState can be: 'playing' | 'scored' | 'gameover'
    // (replaces the original 'won' phase; the overlay handles that display layer)
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    // Rally state — tracks consecutive paddle hits for difficulty escalation
    // and the short score-flash effect.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // ── User style preferences (paddle / ball / background colors) ───────────
    //
    // render() reads these globals every frame, so changing them (e.g. from
    // the preferences modal below) takes effect on the very next frame —
    // before the PUT to the server even completes. Defaults reproduce the
    // game's original monochrome look; a signed-in user's saved values
    // (fetched from GET /api/preferences in loadPreferences()) override
    // these before the render loop starts. Guests always see the defaults.

    let paddleColor = '#ffffff';
    let ballColor   = '#ffffff';
    let bgColor     = '#000000';

    // Preset-style buttons offered in the preferences modal.
    const PREFERENCE_PRESETS = {
      classic: { paddleColor: '#ffffff', ballColor: '#ffffff', bgColor: '#000000' },
      neon:    { paddleColor: '#39ff14', ballColor: '#ff00ff', bgColor: '#0d0221' },
    };

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      // Space triggers restart when overlay is visible (accessibility shortcut)
      if (e.code === 'Space' && game.phase === 'gameover') {
        startNewGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * Returns a value in [-MAX_DEFLECT_ANGLE, +MAX_DEFLECT_ANGLE].
     */
    function deflectAngle(relY) {
      const norm = clamp(relY / (PADDLE_H / 2), -1, 1);
      return norm * MAX_DEFLECT_ANGLE;
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     * Resets the rally counter.
     */
    function resetBall(dirSign) {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = BALL_SPEED_INIT;
      rally.rallyCount = 0;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      ball.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(ball);
    }

    /**
     * Reset both paddles and scores; start fresh.
     */
    function resetGame() {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
      rally.rallyCount  = 0;
      rally.flashFrames = 0;
    }

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a full-screen semi-transparent div injected
    // into the document via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the full-screen game-over overlay.
     * Attaches a 'Play Again' button that calls startNewGame() on click.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      document.body.appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    // ── Auth bar (Google OAuth) ─────────────────────────────────────────────
    //
    // A small fixed panel in the top-right corner shows either a
    // 'Sign in with Google' button (signed out) or the user's avatar/email
    // plus 'Save Score' and 'Log out' buttons (signed in). Session state is
    // fetched from GET /me on load — the actual login state lives in an
    // HttpOnly cookie set by the server, so the client never touches tokens.

    /**
     * Create (or return the existing) auth bar container element.
     */
    function getAuthBar() {
      let bar = document.getElementById('pong-auth-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'pong-auth-bar';
        document.body.appendChild(bar);
      }
      return bar;
    }

    /**
     * Render the signed-out state: a single 'Sign in with Google' button
     * that navigates to the server-side OAuth redirect endpoint.
     */
    function renderSignedOut(bar) {
      bar.innerHTML = '';
      removePreferencesModal();

      const btn = document.createElement('button');
      btn.id = 'pong-google-signin';
      btn.className = 'pong-auth-btn';
      btn.textContent = 'Sign in with Google';
      btn.addEventListener('click', () => {
        window.location.href = '/auth/google';
      });
      bar.appendChild(btn);
    }

    /**
     * Render the signed-in state: avatar (if any), display name/email,
     * a 'Preferences' button, a 'Save Score' button, and a 'Log out' button.
     *
     * @param {HTMLElement} bar
     * @param {{id:string, email:?string, name:?string, avatar:?string}} user
     */
    function renderSignedIn(bar, user) {
      bar.innerHTML = '';

      if (user.avatar) {
        const img = document.createElement('img');
        img.id = 'pong-user-avatar';
        img.src = user.avatar;
        img.alt = user.name || user.email || 'Signed-in user avatar';
        bar.appendChild(img);
      }

      const label = document.createElement('span');
      label.id = 'pong-user-label';
      label.textContent = user.name || user.email || 'Signed in';
      bar.appendChild(label);

      const prefsBtn = document.createElement('button');
      prefsBtn.id = 'pong-preferences';
      prefsBtn.className = 'pong-auth-btn';
      prefsBtn.textContent = 'Preferences';
      prefsBtn.addEventListener('click', showPreferencesModal);
      bar.appendChild(prefsBtn);

      const saveBtn = document.createElement('button');
      saveBtn.id = 'pong-save-score';
      saveBtn.className = 'pong-auth-btn';
      saveBtn.textContent = 'Save Score';
      saveBtn.addEventListener('click', () => saveScore(saveBtn));
      bar.appendChild(saveBtn);

      const logoutBtn = document.createElement('button');
      logoutBtn.id = 'pong-logout';
      logoutBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      logoutBtn.textContent = 'Log out';
      logoutBtn.addEventListener('click', () => {
        removePreferencesModal();
        window.location.href = '/auth/logout';
      });
      bar.appendChild(logoutBtn);
    }

    // ── Preferences modal (signed-in users only) ──────────────────────────
    //
    // A DOM modal offering three <input type="color"> pickers (paddle, ball,
    // background) plus 'Classic'/'Neon' preset buttons. render() reads the
    // paddleColor/ballColor/bgColor globals every frame, so moving a picker
    // updates the game's look instantly — well before the PUT below
    // completes (or even if it fails). The server is the durable source of
    // truth: preferences are written to a persistent SQLite database keyed
    // by the signed-in user's Google id, so GET /api/preferences on any
    // other browser/device (or after a server restart) returns exactly what
    // was last saved here.

    // <input> element refs for the currently-open modal, so preset buttons
    // can update the visible swatches; null while the modal is closed.
    let prefsFieldRefs = null;

    /**
     * Build one "label — color swatch" row for the preferences modal.
     *
     * @param {string} labelText
     * @param {string} initialValue - "#rrggbb"
     * @param {(value: string, commit: boolean) => void} onChange - called on
     *        every drag tick (commit=false, 'input' event) and once more
     *        when the picker is closed/confirmed (commit=true, 'change').
     */
    function buildColorField(labelText, initialValue, onChange) {
      const row = document.createElement('label');
      row.className = 'pong-prefs-row';

      const span = document.createElement('span');
      span.textContent = labelText;
      row.appendChild(span);

      const input = document.createElement('input');
      input.type  = 'color';
      input.value = initialValue;
      input.addEventListener('input',  (e) => onChange(e.target.value, false));
      input.addEventListener('change', (e) => onChange(e.target.value, true));
      row.appendChild(input);

      row._input = input; // stashed so applyPreset() can update the swatch
      return row;
    }

    /**
     * Build and show the preferences modal, pre-filled with the current
     * in-memory colors.
     */
    function showPreferencesModal() {
      removePreferencesModal();

      const overlay = document.createElement('div');
      overlay.id = 'pong-prefs-overlay';
      overlay.className = 'pong-modal-overlay';

      const panel = document.createElement('div');
      panel.className = 'pong-modal-panel';

      const heading = document.createElement('h2');
      heading.textContent = 'Preferences';
      panel.appendChild(heading);

      const paddleRow = buildColorField('Paddle color', paddleColor, (val, commit) => {
        paddleColor = val;
        if (commit) savePreferences();
      });
      const ballRow = buildColorField('Ball color', ballColor, (val, commit) => {
        ballColor = val;
        if (commit) savePreferences();
      });
      const bgRow = buildColorField('Background color', bgColor, (val, commit) => {
        bgColor = val;
        if (commit) savePreferences();
      });

      panel.appendChild(paddleRow);
      panel.appendChild(ballRow);
      panel.appendChild(bgRow);

      prefsFieldRefs = { paddle: paddleRow._input, ball: ballRow._input, bg: bgRow._input };

      const presetsRow = document.createElement('div');
      presetsRow.className = 'pong-prefs-presets';

      const classicBtn = document.createElement('button');
      classicBtn.className = 'pong-auth-btn';
      classicBtn.textContent = 'Classic';
      classicBtn.addEventListener('click', () => applyPreset(PREFERENCE_PRESETS.classic));
      presetsRow.appendChild(classicBtn);

      const neonBtn = document.createElement('button');
      neonBtn.className = 'pong-auth-btn';
      neonBtn.textContent = 'Neon';
      neonBtn.addEventListener('click', () => applyPreset(PREFERENCE_PRESETS.neon));
      presetsRow.appendChild(neonBtn);

      panel.appendChild(presetsRow);

      const closeBtn = document.createElement('button');
      closeBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      closeBtn.textContent = 'Close';
      closeBtn.addEventListener('click', removePreferencesModal);
      panel.appendChild(closeBtn);

      overlay.appendChild(panel);
      document.body.appendChild(overlay);
    }

    /**
     * Remove the preferences modal from the DOM if it exists.
     */
    function removePreferencesModal() {
      const existing = document.getElementById('pong-prefs-overlay');
      if (existing) existing.remove();
      prefsFieldRefs = null;
    }

    /**
     * Apply a named preset: update the global color variables (instant
     * visual feedback via render()), reflect them in the open modal's color
     * swatches (if the modal is open), then persist server-side.
     *
     * @param {{paddleColor:string, ballColor:string, bgColor:string}} preset
     */
    function applyPreset(preset) {
      paddleColor = preset.paddleColor;
      ballColor   = preset.ballColor;
      bgColor     = preset.bgColor;

      if (prefsFieldRefs) {
        prefsFieldRefs.paddle.value = paddleColor;
        prefsFieldRefs.ball.value   = ballColor;
        prefsFieldRefs.bg.value     = bgColor;
      }

      savePreferences();
    }

    /**
     * PUT the current in-memory color preferences to the server. Only ever
     * invoked for signed-in users (the modal that calls this is only
     * reachable via the signed-in auth bar's 'Preferences' button).
     * Best-effort: on failure the local colors (already applied) stay as-is
     * for this session, they just won't have persisted server-side.
     */
    async function savePreferences() {
      try {
        await fetch('/api/preferences', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ paddleColor, ballColor, bgColor }),
        });
      } catch (err) {
        // Best-effort; local colors already applied for this session.
      }
    }

    /**
     * Apply a preferences record (as returned by GET /api/preferences) to
     * the local paddleColor/ballColor/bgColor globals.
     */
    function applyPreferencesLocally(prefs) {
      if (prefs.paddleColor) paddleColor = prefs.paddleColor;
      if (prefs.ballColor)   ballColor   = prefs.ballColor;
      if (prefs.bgColor)     bgColor     = prefs.bgColor;
    }

    /**
     * Fetch this session's saved style preferences from the server and
     * apply them locally. Guests (no session) and network failures silently
     * keep the built-in defaults already assigned above — this call is
     * best-effort and never blocks the game from starting. Always fetched
     * fresh from the server (never cached client-side), so a signed-in
     * user's colors follow them to any browser/device they log in from.
     */
    async function loadPreferences() {
      try {
        const res  = await fetch('/api/preferences', { credentials: 'same-origin' });
        const data = await res.json();
        if (data && data.preferences) {
          applyPreferencesLocally(data.preferences);
        }
      } catch (err) {
        // Network failure — keep defaults.
      }
    }

    /**
     * POST the player's current score to the server. No player name is
     * sent — the server resolves identity from the HttpOnly session cookie
     * established during Google OAuth login.
     *
     * @param {HTMLButtonElement} btn
     */
    async function saveScore(btn) {
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ score: playerPaddle.score }),
        });
        btn.textContent = res.ok ? 'Saved!' : 'Failed';
      } catch (err) {
        btn.textContent = 'Failed';
      } finally {
        setTimeout(() => {
          btn.textContent = original;
          btn.disabled = false;
        }, 1500);
      }
    }

    /**
     * Fetch the current session's user (if any) from GET /me and render
     * the appropriate auth bar state. Called once on page load.
     */
    async function initAuthBar() {
      const bar = getAuthBar();
      try {
        const res  = await fetch('/me', { credentials: 'same-origin' });
        const data = await res.json();
        if (data && data.user) {
          renderSignedIn(bar, data.user);
        } else {
          renderSignedOut(bar);
        }
      } catch (err) {
        renderSignedOut(bar);
      }
    }

    /**
     * Tear down the current overlay, reset all state, and restart the animation loop.
     * Called by the 'Play Again' button click and the Space keyboard shortcut.
     */
    function startNewGame() {
      removeGameOverOverlay();
      resetGame();
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The RAF loop is paused when gameover; nothing to update.
      if (game.phase === 'gameover') return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — lerp toward ball centre; lerp speed increases
      // slightly each rally hit (difficulty escalation).
      const ballCentreY   = ball.y + BALL_SIZE / 2;
      const aiCentreY     = aiPaddle.y + PADDLE_H / 2;
      const aiDiff        = ballCentreY - aiCentreY;
      const effectiveLerp = AI_LERP + rally.rallyCount * AI_LERP_RALLY_INC;
      const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (ball.y <= 0) {
        ball.y     = 0;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y     = CANVAS_H - BALL_SIZE;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      }

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        ball.vx < 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        ball.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (ball.y + BALL_SIZE / 2) - (playerPaddle.y + PADDLE_H / 2);
        ball.angle  = deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        ball.vx > 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        ball.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (ball.y + BALL_SIZE / 2) - (aiPaddle.y + PADDLE_H / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        ball.angle  = Math.PI - deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        playerPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to the user's background color (default black)
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = paddleColor;
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillStyle = ballColor;
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // When game.phase becomes 'gameover' the loop stops scheduling itself and
    // shows the HTML overlay instead.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      if (game.phase === 'gameover') {
        // Pause the loop and present the DOM overlay
        rafId = null;
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        showGameOverOverlay(winnerLabel, playerPaddle.score, aiPaddle.score);
        return; // do NOT schedule next frame
      }

      rafId = requestAnimationFrame(loop);
    }

    // ── Boot sequence ─────────────────────────────────────────────────────────
    //
    // Render the auth bar and fetch any saved style preferences in parallel,
    // then start the render loop. Preferences are always fetched fresh from
    // the server (never cached client-side) so a signed-in user sees the
    // same paddle/ball/background colors no matter which browser or device
    // they log in from; guests simply keep the built-in defaults.

    async function init() {
      await Promise.all([initAuthBar(), loadPreferences()]);
      rafId = requestAnimationFrame(loop);
    }

    init();
  </script>
</body>
</html>
