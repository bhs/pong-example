<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W        = 800;
    const CANVAS_H        = 600;
    const PADDLE_W        = 12;
    const PADDLE_H        = 80;
    const BALL_SIZE       = 12;
    const PADDLE_SPEED    = 350;   // px / second
    const BALL_SPEED_INIT = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX  = 700;   // px / second
    const BALL_SPEED_INC  = 25;    // |vx| added on each paddle hit
    const MIN_VY          = 40;    // minimum |vy| so ball never travels perfectly horizontal
    const AI_LERP         = 4.5;   // AI lerp factor (higher = faster)
    const SCORE_WIN       = 7;     // first to this wins
    const DIVIDER_DASH    = 20;    // centre-line dash length
    const DIVIDER_GAP     = 10;    // centre-line gap length

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:  CANVAS_W / 2,
      y:  CANVAS_H / 2,
      vx: 0,
      vy: 0,
      w:  BALL_SIZE,
      h:  BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Phase can be: 'playing' | 'scored' | 'won'
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Swept-position helper: compute the interpolation factor t ∈ [0,1] at
     * which the ball's leading horizontal edge first crossed the paddle's
     * facing edge during this frame.
     *
     * vx < 0 (moving left):  leading edge = ball.x, target = paddle right face (bx+bw)
     * vx > 0 (moving right): leading edge = ball right edge = ball.x + BALL_SIZE,
     *                         equivalently ball.x target = bx − BALL_SIZE
     *
     * Returns 1 when the crossing did not occur within [0,1].
     */
    function sweepT(px, cx, bx, bw, vx) {
      const edgeX = vx < 0 ? bx + bw : bx - BALL_SIZE;
      const dx    = cx - px;
      if (Math.abs(dx) < 1e-10) return 1;
      const t = (edgeX - px) / dx;
      return (t >= 0 && t <= 1) ? t : 1;
    }

    /**
     * Full swept paddle collision check.
     * Uses swept edge crossing first; falls back to AABB overlap.
     *
     * Returns { hit: boolean, t: number } where t is used to interpolate hitY.
     */
    function checkPaddleHit(px, py, cx, cy, vx, pad) {
      // Swept crossing
      const t = sweepT(px, cx, pad.x, pad.w, vx);
      if (t < 1) {
        const hitY = py + (cy - py) * t;
        if (hitY + BALL_SIZE > pad.y && hitY < pad.y + pad.h) {
          return { hit: true, t };
        }
      }

      // AABB fallback
      if (aabbOverlap(cx, cy, BALL_SIZE, BALL_SIZE, pad.x, pad.y, pad.w, pad.h)) {
        return { hit: true, t: 1 };
      }

      return { hit: false, t: 1 };
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     */
    function resetBall(dirSign) {
      ball.x  = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y  = CANVAS_H / 2 - BALL_SIZE / 2;
      // Horizontal component always toward the player who just lost the point
      const angle = rand(-Math.PI / 4, Math.PI / 4);
      ball.vx = dirSign * BALL_SPEED_INIT * Math.cos(angle);
      ball.vy = BALL_SPEED_INIT * Math.sin(angle);
      // Apply minimum |vy| guard on serve so ball never starts horizontal
      if (Math.abs(ball.vy) < MIN_VY) {
        ball.vy = ball.vy >= 0 ? MIN_VY : -MIN_VY;
      }
    }

    /**
     * Reset both paddles and scores; start fresh.
     */
    function resetGame() {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: won ──────────────────────────────────────────────────────────
      if (game.phase === 'won') {
        // Any key restarts the game
        if (Object.values(keys).some(Boolean)) {
          resetGame();
        }
        return;
      }

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      // Player paddle movement — clamp to canvas bounds each frame
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — linear interpolation toward the ball's centre,
      // clamped to canvas bounds each frame
      const ballCentreY = ball.y + BALL_SIZE / 2;
      const aiCentreY   = aiPaddle.y + PADDLE_H / 2;
      const aiDiff      = ballCentreY - aiCentreY;
      const aiMove      = clamp(aiDiff * AI_LERP * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Record previous position for swept-collision interpolation
      const prevX = ball.x;
      const prevY = ball.y;

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Negate vy on contact; clamp position.
      if (ball.y <= 0) {
        ball.y  = 0;
        ball.vy = -ball.vy;
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y  = CANVAS_H - BALL_SIZE;
        ball.vy = -ball.vy;
      }

      // ── Ball vs player paddle (vector-swept AABB) ─────────────────────────
      if (ball.vx < 0) {
        const { hit, t } = checkPaddleHit(prevX, prevY, ball.x, ball.y, ball.vx, playerPaddle);
        if (hit) {
          // Interpolate back to the contact y using the swept or current t
          const hitY = prevY + (ball.y - prevY) * t;

          // Nudge ball outside the paddle rect (no tunneling)
          ball.x = playerPaddle.x + playerPaddle.w;

          // Negate vx and increase its magnitude by BALL_SPEED_INC, capped at BALL_SPEED_MAX
          const newVxMag = clamp(Math.abs(ball.vx) + BALL_SPEED_INC, BALL_SPEED_INIT, BALL_SPEED_MAX);
          ball.vx = newVxMag;   // positive → moving right

          // Adjust vy proportionally to off-centre offset: ±0.5 of current |vy|
          const ballCY   = hitY + BALL_SIZE / 2;
          const paddleCY = playerPaddle.y + PADDLE_H / 2;
          const norm     = clamp((ballCY - paddleCY) / (PADDLE_H / 2), -1, 1);
          ball.vy += norm * 0.5 * Math.abs(ball.vy);
        }
      }

      // ── Ball vs AI paddle (vector-swept AABB) ─────────────────────────────
      if (ball.vx > 0) {
        const { hit, t } = checkPaddleHit(prevX, prevY, ball.x, ball.y, ball.vx, aiPaddle);
        if (hit) {
          const hitY = prevY + (ball.y - prevY) * t;

          // Nudge ball outside the paddle rect
          ball.x = aiPaddle.x - BALL_SIZE;

          // Negate vx and increase its magnitude
          const newVxMag = clamp(Math.abs(ball.vx) + BALL_SPEED_INC, BALL_SPEED_INIT, BALL_SPEED_MAX);
          ball.vx = -newVxMag;  // negative → moving left

          // Adjust vy proportional to off-centre offset
          const ballCY   = hitY + BALL_SIZE / 2;
          const paddleCY = aiPaddle.y + PADDLE_H / 2;
          const norm     = clamp((ballCY - paddleCY) / (PADDLE_H / 2), -1, 1);
          ball.vy += norm * 0.5 * Math.abs(ball.vy);
        }
      }

      // ── Minimum |vy| guard ────────────────────────────────────────────────
      // Ensure the ball never travels perfectly horizontally.
      if (Math.abs(ball.vy) < MIN_VY) {
        ball.vy = ball.vy >= 0 ? MIN_VY : -MIN_VY;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'won';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        playerPaddle.score += 1;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'won';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.

    function render() {
      // Clear
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // Scores
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = '#fff';
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // Overlay messages
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      if (game.phase === 'won') {
        const msg = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 56px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(msg, CANVAS_W / 2, CANVAS_H / 2 - 40);

        ctx.font = '22px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fillText('Press any key to play again', CANVAS_W / 2, CANVAS_H / 2 + 30);
      }
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame with performance.now() timestamps.
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
