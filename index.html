      document.head.appendChild(style);
    })();

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.
    //
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // gameState can be: 'playing' | 'scored' | 'gameover'
    // (replaces the original 'won' phase; the overlay handles that display layer)
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
      mode:       'normal',   // key of MODES
      extraBalls: [],         // balls besides `ball` ('multiBall' mode)
      barriers:   [],         // rectangles the ball bounces off ('bouncyBarriers' mode)
      pickups:    [],         // pickups on the field ('powerUps' mode)
      effects:    [],         // active timed effects ('powerUps' mode)
      pickupTimer: 0,         // seconds until the next pickup spawns ('powerUps' mode)
    };

    // Rally state — tracks consecutive paddle hits for difficulty escalation
    // and the short score-flash effect.
    //
    // maxRally tracks the highest rallyCount reached at any point during the
    // *current game* — unlike rallyCount it is never reset by a miss, only
    // by resetGame(). It's the "longest rally" value sent to POST
    // /api/scores and shown in the best-rally readout after game-over.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      maxRally:    0,   // peak rallyCount this game; resets each new game
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    // Total elapsed play time (seconds) for the current game — accumulated
    // in update() while game.phase === 'playing', reset by resetGame().
    // Sent alongside the score when the player clicks 'Save Score' so
    // GameHistory rows carry a real duration.
    let gameElapsedSeconds = 0;

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // Signed-in user (from GET /me) and whether they're in the ~50% bucket
    // shown the "Best rally" readout after game-over (see
    // isBestRallyBucketed in server.js). Both null/false until /me resolves.
    let currentUser      = null;
    let bestRallyBucket  = false;

    // ── Experiment telemetry (client-side event pings) ───────────────────────
    //
    // Fire-and-forget pings to the server so it can count a handful of
    // browser-only events (game_over_shown, play_again_click, page_reload)
    // through its OpenTelemetry instrumentation. Never affects gameplay: any
    // failure here (network, storage, etc.) is silently swallowed.

    const MENDEL_GAME_OVER_FLAG = 'mendelGameOverShown';

    function sendMendelEvent(eventName, detail) {
      try {
        const payload = JSON.stringify(Object.assign({ event: eventName }, detail));
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/client-events', new Blob([payload], { type: 'application/json' }));
        } else {
          fetch('/api/client-events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true,
            credentials: 'same-origin',
          }).catch(() => {});
        }
      } catch (err) {
        // Telemetry must never break gameplay.
      }
    }

    // A full browser page reload while the game-over overlay was showing
    // leaves this sessionStorage flag set — it's only cleared by the in-page
    // 'Play Again' restart — so finding it set here means the page just
    // reloaded instead of restarting without a navigation.
    try {
      if (sessionStorage.getItem(MENDEL_GAME_OVER_FLAG) === '1') {
        sessionStorage.removeItem(MENDEL_GAME_OVER_FLAG);
        sendMendelEvent('page_reload');
      }
    } catch (err) {
      // sessionStorage may be unavailable (e.g. private browsing) — ignore.
    }

    // One 'visit' per page load — backs the games-started-per-visit metric
    // (games_started / visit) alongside 'game_started' below.
    sendMendelEvent('visit');
    sendMendelEvent('page_view');

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      // Space triggers restart when overlay is visible (accessibility shortcut)
      if (e.code === 'Space' && game.phase === 'gameover') {
        startNewGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * paddleH is the height of the paddle that was hit.
     * Returns a value in [-MAX_DEFLECT_ANGLE, +MAX_DEFLECT_ANGLE].
     */
    function deflectAngle(relY, paddleH) {
      const norm = clamp(relY / (paddleH / 2), -1, 1);
      return norm * MAX_DEFLECT_ANGLE;
    }

    /**
     * Put one ball at the centre (shifted down by yOffset) and launch it in a
     * random direction (dirSign: +1 = toward AI, -1 = toward player).
     */
    function launchBall(b, dirSign, yOffset) {
      b.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      b.y     = CANVAS_H / 2 - BALL_SIZE / 2 + yOffset;
      b.speed = BALL_SPEED_INIT;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      b.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(b);
    }

    /**
     * Make `count` extra balls, stacked vertically around the centre spawn.
     */
    function makeExtraBalls(count) {
      const balls = [];
      for (let i = 0; i < count; i++) {
        balls.push({ x: 0, y: 0, speed: 0, angle: 0, vx: 0, vy: 0, w: BALL_SIZE, h: BALL_SIZE });
      }
      return balls;
    }

    /**
     * Reset the ball (and every extra ball in multi-ball mode) to the centre
     * and launch toward dirSign. Resets the rally counter.
     */
    function resetBall(dirSign) {
      rally.rallyCount = 0;
      launchBall(ball, dirSign, 0);
      game.extraBalls.forEach((b, i) => {
        const step = Math.floor(i / 2) + 1;
        launchBall(b, dirSign, (i % 2 === 0 ? -1 : 1) * step * EXTRA_BALL_SPREAD);
      });
    }

    // ── Game modes ────────────────────────────────────────────────────────────
    //
    // Each mode has a display name, whether the fun button may pick it, and a
    // setup / teardown pair. applyMode() always tears the previous mode down
    // first, so every effect is removed again when the next game starts in
    // Normal. To add a mode, add an entry here (and its effect in update /
    // render if it needs one); the fun button picks it up automatically.

    function centrePaddle(paddle) {
      paddle.y = clamp(CANVAS_H / 2 - paddle.h / 2, 0, CANVAS_H - paddle.h);
    }

    // ── Power-Ups: pickups and timed effects ──────────────────────────────────
    //
    // Mirrors the pure functions in game-logic.js. game.pickups holds at most
    // one pickup; game.effects holds at most one entry per kind.

    function findEffect(kind) {
      return game.effects.find((e) => e.kind === kind) || null;
    }

    /**
     * Opacity the balls are drawn at: Ghost Ball makes them semi-transparent
     * and flickering (lib/ghost-balls/on.js). Drawing only; collisions are
     * untouched.
     */
    function ballAlpha() {
      const ghost = findEffect('ghostBall');
      return ghost && window.PongGhostBallOn ? window.PongGhostBallOn.ballAlpha(ghost.remaining) : 1;
    }

    /** Time scale applied to every ball's movement: Slow-Mo halves it. */
    function ballTimeScale() {
      return findEffect('slowMo') ? SLOW_MO_FACTOR : 1;
    }

    /** True while Freeze AI is active: the AI paddle does not move. */
    function isAiFrozen() {
      return findEffect('freezeAi') !== null;
    }

    function spawnPickup(rng = Math.random) {
      if (game.pickups.length > 0) return null;
      const kinds = powerUpSet.kinds.filter((k) => POWER_UP_KINDS[k]);
      if (kinds.length === 0) return null;
      const pick = clamp(Math.floor(rng() * kinds.length), 0, kinds.length - 1);
      const pickup = {
        kind: kinds[pick],
        x:    Math.round(200 + rng() * (CANVAS_W - 400 - PICKUP_SIZE)),
        y:    Math.round(60 + rng() * (CANVAS_H - 120 - PICKUP_SIZE)),
        w:    PICKUP_SIZE,
        h:    PICKUP_SIZE,
        ttl:  powerUpPacing.pickupLifetimeS,
      };
      game.pickups.push(pickup);
      return pickup;
    }

    function collectPickup(b) {
      const i = game.pickups.findIndex((p) => aabbOverlap(b.x, b.y, b.w, b.h, p.x, p.y, p.w, p.h));
      return i === -1 ? null : game.pickups.splice(i, 1)[0];
    }

    function endEffect(effect) {
      if (effect.kind === 'bigPaddle') {
        const centre = playerPaddle.y + playerPaddle.h / 2;
        playerPaddle.h = PADDLE_H;
        playerPaddle.y = clamp(centre - PADDLE_H / 2, 0, CANVAS_H - PADDLE_H);
      }
    }

    function applyEffect(kind, rng = Math.random) {
      if (!POWER_UP_KINDS[kind]) return null;
      const duration = powerUpPacing.effectDurationsS[kind];
      const existing = findEffect(kind);
      if (existing) {
        existing.remaining = duration;
        return existing;
      }
      const effect = { kind, remaining: duration };
      if (kind === 'bigPaddle') {
        const centre = playerPaddle.y + playerPaddle.h / 2;
        playerPaddle.h = Math.round(PADDLE_H * BIG_PADDLE_FACTOR);
        playerPaddle.y = clamp(centre - playerPaddle.h / 2, 0, CANVAS_H - playerPaddle.h);
      } else if (kind === 'ghostBall') {
        effect.offset = (rng() * 2 - 1) * GHOST_NOISE;
        effect.rerollIn = GHOST_REROLL_S;
      }
      game.effects.push(effect);
      return effect;
    }

    /** Advance every effect; expired ones are removed and undone. */
    function tickEffects(dt, rng = Math.random) {
      const active = [];
      for (const effect of game.effects) {
        effect.remaining -= dt;
        if (effect.remaining <= 0) {
          endEffect(effect);
          continue;
        }
        if (effect.kind === 'ghostBall') {
          effect.rerollIn -= dt;
          if (effect.rerollIn <= 0) {
            effect.offset = (rng() * 2 - 1) * GHOST_NOISE;
            effect.rerollIn = GHOST_REROLL_S;
          }
        }
        active.push(effect);
      }
      game.effects = active;
    }

    /**
     * Remove every pickup and effect, restoring paddle heights, and restart
     * the spawn timer. Used at point end, game end and on every mode change.
     */
    function clearPowerUps() {
      game.effects.forEach(endEffect);
      game.effects = [];
      game.pickups = [];
      game.pickupTimer = powerUpPacing.spawnIntervalS;
      updateEffectBadge();
    }

    /** One tick of the Power-Ups mode while a point is being played. */
    function updatePowerUps(dt) {
      tickEffects(dt);
      game.pickups = game.pickups.filter((p) => { p.ttl -= dt; return p.ttl > 0; });
      game.pickupTimer -= dt;
      if (game.pickupTimer <= 0 && spawnPickup()) game.pickupTimer = powerUpPacing.spawnIntervalS;
      for (const b of [ball].concat(game.extraBalls)) {
        const pickup = collectPickup(b);
        if (pickup) applyEffect(pickup.kind);
      }
    }

    // ── Effect badge: 'bottom-right-corner' ───────────────────────────────────
    //
    // Active effects as stacked chips with the seconds left, in the corner
    // opposite the mode badge. Hidden when no effect is active; the chips are
    // only rewritten when what they say changes.

    let effectBadgeSignature = '';

    function updateEffectBadge() {
      const el = document.getElementById('pong-effect-badge');
      if (!el) return;
      const signature = game.effects.map((e) => e.kind + ':' + Math.ceil(e.remaining)).join('|');
      if (signature === effectBadgeSignature) return;
      effectBadgeSignature = signature;
      el.textContent = '';
      game.effects.forEach((e) => {
        const chip = document.createElement('div');
        chip.className = 'pong-effect-chip';
        chip.style.background = POWER_UP_KINDS[e.kind].colour;
        chip.textContent = POWER_UP_KINDS[e.kind].name + ' ' + Math.ceil(e.remaining) + 's';
        el.appendChild(chip);
      });
      el.hidden = game.effects.length === 0;
    }

    const MODES = {
      normal: {
        name: 'Normal',
        fun:  false,
        setup() {},
        teardown() {},
      },
      bigPaddle: {
        name: 'Big Paddle',
        fun:  true,
        setup()    { playerPaddle.h = Math.round(PADDLE_H * BIG_PADDLE_FACTOR); centrePaddle(playerPaddle); },
        teardown() { playerPaddle.h = PADDLE_H; centrePaddle(playerPaddle); },
      },
      multiBall: {
        name: 'Multi-Ball',
        fun:  true,
        setup()    { game.extraBalls = makeExtraBalls(EXTRA_BALL_COUNT); },
        teardown() { game.extraBalls = []; },
      },
      bouncyBarriers: {
        name: 'Bouncy Barriers',
        fun:  true,
        setup()    { game.barriers = BARRIER_LAYOUT.map((b) => Object.assign({}, b)); },
        teardown() { game.barriers = []; },
      },
      powerUps: {
        name: 'Power-Ups',
        fun:  true,
        setup()    { clearPowerUps(); },
        teardown() {
          clearPowerUps();
          playerPaddle.h = PADDLE_H;
          aiPaddle.h     = PADDLE_H;
        },
      },
    };

    const FUN_MODE_KEYS = Object.keys(MODES).filter((key) => MODES[key].fun);

    /**
     * Pick one fun mode key. `rng` returns a float in [0, 1) and is injectable
     * so tests can fix the pick.
     */
    function pickFunMode(rng = Math.random) {
      const i = Math.floor(rng() * FUN_MODE_KEYS.length);
      return FUN_MODE_KEYS[clamp(i, 0, FUN_MODE_KEYS.length - 1)];
    }

    /**
     * Switch to `modeKey` (unknown keys fall back to 'normal'): tear down the
     * current mode, then set up the new one.
     */
    function applyMode(modeKey) {
      const next = MODES[modeKey] ? modeKey : 'normal';
      MODES[game.mode].teardown();
      game.mode = next;
      MODES[next].setup();
    }

    /**
     * Reset both paddles and scores, and return to Normal play; start fresh.
     */
    function resetGame() {
      applyMode('normal');
      centrePaddle(playerPaddle);
      centrePaddle(aiPaddle);
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
      rally.rallyCount  = 0;
      rally.maxRally    = 0;
      rally.flashFrames = 0;
      gameElapsedSeconds = 0;
    }

    // ── Mode announcement: 'splash-then-badge' ────────────────────────────────
    //
    // The mode name is shown large in the centre of the screen for SPLASH_MS as
    // the game starts, then a small badge stays in a corner for the rest of the
    // game. Normal play shows neither. Every call first clears the previous
    // splash timer, splash and badge, so nothing stale survives a restart.

    let splashTimer = null;

    function clearModeAnnouncement() {
      if (splashTimer !== null) {
        clearTimeout(splashTimer);
        splashTimer = null;
      }
      ['pong-mode-splash', 'pong-mode-badge'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.remove();
      });
    }

    function announceSplashThenBadge(modeKey) {
      clearModeAnnouncement();
      const mode = MODES[modeKey];
      if (!mode || !mode.fun) return;

      const screen = document.getElementById('pong-screen');

      const badge = document.createElement('div');
      badge.id = 'pong-mode-badge';
      badge.textContent = mode.name;
      screen.appendChild(badge);

      const splash = document.createElement('div');
      splash.id = 'pong-mode-splash';
      splash.textContent = mode.name;
      screen.appendChild(splash);
      splashTimer = setTimeout(() => {
        splashTimer = null;
        splash.remove();
      }, SPLASH_MS);
    }

    // ── Fun button: the control panel button ──────────────────────────────────
    //
    // The red button on the cabinet control panel starts a fresh game in a
    // random fun mode, in any game phase. Enter on the focused button does the
    // same; Space is left to the game's own shortcut. The button gives up focus
    // after each press so a later Space cannot press it again, and presses
    // inside FUN_BUTTON_DEBOUNCE_MS of the last one are ignored.

    let lastFunStartAt = -Infinity;

    function onFunButtonPress(e) {
      if (e.type === 'keydown' && (e.code !== 'Enter' || e.repeat)) return;
      e.preventDefault();
      const el = e.currentTarget;
      if (el && el.blur) el.blur();
      const now = Date.now();
      if (now - lastFunStartAt < FUN_BUTTON_DEBOUNCE_MS) return;
      lastFunStartAt = now;
      startFunGame();
    }

    function wireControlPanelButton() {
      const btn = document.getElementById('pong-panel-button');
      btn.addEventListener('click', onFunButtonPress);
      btn.addEventListener('keydown', onFunButtonPress);
    }

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a semi-transparent div, confined to the
    // cabinet's screen area, injected via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the game-over overlay over the cabinet screen.
     * Attaches a 'Play Again' button that calls startNewGame() on click.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();

      try { sessionStorage.setItem(MENDEL_GAME_OVER_FLAG, '1'); } catch (err) { /* ignore */ }
      sendMendelEvent('game_over_shown');

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      document.getElementById('pong-screen').appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();

      // Fire-and-render the personal-best badge (see 'Personal best badge'
      // section below). Runs after the overlay is already in the DOM so the
      // badge line can simply be appended once the network round-trip(s)
      // resolve.
      renderPersonalBestBadge(overlay, playerScore);
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    // ── Personal best badge ─────────────────────────────────────────────────
    //
    // Right after a round ends, POST the final score (plus this game's
    // duration and longest rally) to POST /api/scores — the same endpoint
    // the 'Save Score' button uses, keyed by the signed-in user's session,
    // and it only overwrites the stored HighScore when the new score beats
    // it (see server.js). It also always records a GameHistory row for this
    // finished game, and unconditionally bumps User.lastPlayedAt regardless
    // of whether the score improved. Once that resolves, GET
    // /api/scores/:userId reads back the (possibly just-updated) personal
    // best and appends a small 'Personal Best: N' line, immediately followed
    // by a 'Last played: <timestamp>' line (the freshly-bumped
    // lastPlayedAt, formatted with toLocaleString()), to the game-over
    // overlay. Both requests carry the HttpOnly session cookie
    // (credentials: 'include'), so identity is resolved server-side — no
    // player name is ever sent. If there is no session at all (GET /me
    // returns { user: null }), the overlay shows a 'Sign in with Google to
    // save your score' link instead, and neither POST /api/scores nor GET
    // /api/scores/:userId is called.

    /**
     * @param {HTMLElement} overlay    - the game-over overlay div, already in the DOM
     * @param {number}      finalScore - the player's final score for this round
     */
    async function renderPersonalBestBadge(overlay, finalScore) {
      let user = null;
      try {
        const meRes  = await fetch('/me', { credentials: 'include' });
        const meData = await meRes.json();
        user = (meData && meData.user) || null;
      } catch (err) {
        user = null;
      }

      if (!user) {
        appendSignInLink(overlay);
        return;
      }

      try {
        await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            score:        finalScore,
            duration:     Math.round(gameElapsedSeconds),
            longestRally: rally.maxRally,
          }),
        });
      } catch (err) {
        // Network error posting the score — fall through and still try to
        // read back whatever best is on record.
      }

      // The finished game may have extended today's streak.
      if (engagementUI) engagementUI.refresh();

      try {
        const res = await fetch(`/api/scores/${encodeURIComponent(user.id)}`, { credentials: 'include' });

        if (res.status === 404) {
          // No HighScore row could be read back (shouldn't normally happen
          // right after a successful POST) — fall back to this round's score.
          appendPersonalBestLine(overlay, finalScore);
        } else {
          const data  = await res.json();
          const best  = data && data.entry && typeof data.entry.score === 'number'
            ? data.entry.score
            : finalScore;
          appendPersonalBestLine(overlay, best);
          appendLastPlayedLine(overlay, data && data.entry && data.entry.lastPlayedAt);
        }
      } catch (err) {
        // Network error — fail silently, no badge shown for this round.
      }
    }

    /**
     * Append a 'Personal Best: N' line to the game-over overlay.
     * @param {HTMLElement} overlay
     * @param {number} best
     */
    function appendPersonalBestLine(overlay, best) {
      if (!document.body.contains(overlay)) return; // overlay dismissed already
      const el = document.createElement('p');
      el.id = 'pong-personal-best';
      el.className = 'personal-best';
      el.textContent = `Personal Best: ${best}`;
      overlay.appendChild(el);
    }

    /**
     * Append a 'Last played: <timestamp>' line directly under the
     * Personal Best badge, formatted with toLocaleString() for a
     * locale-aware, human-readable timestamp. `lastPlayedAt` comes from the
     * attached User row on the GET /api/scores/:userId response (see
     * server.js's toScoreEntry) — a number of milliseconds since the epoch,
     * or null if this user hasn't finished a game since that column
     * existed, in which case no line is appended.
     * @param {HTMLElement} overlay
     * @param {number|null|undefined} lastPlayedAt
     */
    function appendLastPlayedLine(overlay, lastPlayedAt) {
      if (!document.body.contains(overlay)) return; // overlay dismissed already
      if (lastPlayedAt === null || lastPlayedAt === undefined) return;

      const date = new Date(lastPlayedAt);
      if (Number.isNaN(date.getTime())) return;

      const el = document.createElement('p');
      el.id = 'pong-last-played';
      el.className = 'last-played';
      el.textContent = `Last played: ${date.toLocaleString()}`;
      overlay.appendChild(el);
    }

    /**
     * Append a 'Sign in with Google to save your score' link to the
     * game-over overlay for signed-out players.
     * @param {HTMLElement} overlay
     */
    function appendSignInLink(overlay) {
      if (!document.body.contains(overlay)) return; // overlay dismissed already
      const a = document.createElement('a');
      a.id = 'pong-personal-best-signin';
      a.className = 'signin-link';
      a.href = '/auth/google';
      a.textContent = 'Sign in with Google to save your score';
      overlay.appendChild(a);
    }

    // ── Best-rally readout ────────────────────────────────────────────────
    //
    // Populates the static #pong-best-rally caption (below the canvas, not
    // part of the full-screen overlay) with this game's longest rally — but
    // only for signed-in players in the ~50% display bucket (see
    // isBestRallyBucketed in server.js / bestRallyBucket above). Everyone
    // else keeps seeing an empty (hidden) caption, exactly as before this
    // feature existed.

    function updateBestRallyDisplay() {
      const el = document.getElementById('pong-best-rally');
      if (!el) return;
      if (currentUser && bestRallyBucket) {
        const hits = rally.maxRally === 1 ? 'hit' : 'hits';
        el.textContent = `Best rally this game: ${rally.maxRally} ${hits}`;
      } else {
        el.textContent = '';
      }
    }

    function clearBestRallyDisplay() {
      const el = document.getElementById('pong-best-rally');
      if (el) el.textContent = '';
    }

    // ── Auth bar (Google OAuth) ─────────────────────────────────────────────
    //
    // A small fixed panel in the top-right corner shows either a
    // 'Sign in with Google' button (signed out) or the user's avatar/email
    // plus 'Save Score' and 'Log out' buttons (signed in). Session state is
    // fetched from GET /me on load — the actual login state lives in an
    // HttpOnly cookie set by the server, so the client never touches tokens.

    /**
     * Create (or return the existing) auth bar container element.
     */
    function getAuthBar() {
      let bar = document.getElementById('pong-auth-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'pong-auth-bar';
        document.body.appendChild(bar);
      }
      return bar;
    }

    /**
     * Render the signed-out state: a single 'Sign in with Google' button
     * that navigates to the server-side OAuth redirect endpoint.
     */
    function renderSignedOut(bar) {
      bar.innerHTML = '';

      const btn = document.createElement('button');
      btn.id = 'pong-google-signin';
      btn.className = 'pong-auth-btn';
      btn.textContent = 'Sign in with Google';
      btn.addEventListener('click', () => {
        window.location.href = '/auth/google';
      });
      bar.appendChild(btn);
      appendLeaderboardButton(bar);
    }

    /**
     * Render the signed-in state: avatar (if any), display name/nickname,
     * a gear icon that opens the Settings modal, a 'Save Score' button, and
     * a 'Log out' button.
     *
     * @param {HTMLElement} bar
     * @param {{id:string, email:?string, name:?string, avatar:?string, nickname:?string}} user
     */
    function renderSignedIn(bar, user) {
      bar.innerHTML = '';

      appendLeaderboardButton(bar);

      if (user.avatar) {
        const img = document.createElement('img');
        img.id = 'pong-user-avatar';
        img.src = user.avatar;
        img.alt = user.name || user.email || 'Signed-in user avatar';
        bar.appendChild(img);
      }

      const label = document.createElement('span');
      label.id = 'pong-user-label';
      label.textContent = displayName(user);
      bar.appendChild(label);

      const settingsBtn = document.createElement('button');
      settingsBtn.id = 'pong-settings-gear';
      settingsBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      settingsBtn.textContent = '⚙';
      settingsBtn.title = 'Settings';
      settingsBtn.setAttribute('aria-label', 'Settings');
      settingsBtn.addEventListener('click', () => openSettingsModal());
      bar.appendChild(settingsBtn);

      const saveBtn = document.createElement('button');
      saveBtn.id = 'pong-save-score';
      saveBtn.className = 'pong-auth-btn';
      saveBtn.textContent = 'Save Score';
      saveBtn.addEventListener('click', () => saveScore(saveBtn));
      bar.appendChild(saveBtn);

      const logoutBtn = document.createElement('button');
      logoutBtn.id = 'pong-logout';
      logoutBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      logoutBtn.textContent = 'Log out';
      logoutBtn.addEventListener('click', () => {
        window.location.href = '/auth/logout';
      });
      bar.appendChild(logoutBtn);
    }

    /**
     * The player's best available display identity: their saved nickname
     * (see the Settings modal / PATCH /api/user/nickname) takes priority
     * over their Google display name or email, and 'Player' is shown once
     * none of those are available.
     *
     * @param {?{name:?string, email:?string, nickname:?string}} user
     */
    function displayName(user) {
      if (!user) return 'Player';
      return user.nickname || user.name || user.email || 'Player';
    }

    /**
     * POST the player's current score to the server. No player name is
     * sent — the server resolves identity from the HttpOnly session cookie
     * established during Google OAuth login.
     *
     * @param {HTMLButtonElement} btn
     */
    async function saveScore(btn) {
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            score:        playerPaddle.score,
            duration:     Math.round(gameElapsedSeconds),
            longestRally: rally.maxRally,
          }),
        });
        btn.textContent = res.ok ? 'Saved!' : 'Failed';
        if (res.ok) refreshRecentGames();
      } catch (err) {
        btn.textContent = 'Failed';
      } finally {
        setTimeout(() => {
          btn.textContent = original;
          btn.disabled = false;
        }, 1500);
      }
    }

    // ── Settings modal (nickname editing) ─────────────────────────────────
    //
    // Same DOM-overlay pattern as the game-over screen: a JS-injected,
    // full-screen semi-transparent div (with styling supplied by the
    // injected <style> tag above) holding a small centred card. Opened by
    // the gear icon next to the avatar; shows the player's current nickname
    // (or a blank field if unset) in a text input with live character-count
    // validation, and Save/Cancel buttons. Save PATCHes
    // /api/user/nickname, updates currentUser + the rest of the UI, and
    // closes the modal after a brief success flash.

    /**
     * Build and show the Settings modal.
     */
    function openSettingsModal() {
      closeSettingsModal(); // defensive guard against a pre-existing modal

      const overlay = document.createElement('div');
      overlay.id = 'pong-settings-modal';
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeSettingsModal();
      });

      const card = document.createElement('div');
      card.id = 'pong-settings-card';

      const h2 = document.createElement('h2');
      h2.textContent = 'Settings';
      card.appendChild(h2);

      const label = document.createElement('label');
      label.setAttribute('for', 'pong-nickname-input');
      label.textContent = 'Nickname';
      card.appendChild(label);

      const input = document.createElement('input');
      input.id = 'pong-nickname-input';
      input.type = 'text';
      input.maxLength = NICKNAME_MAX_LENGTH;
      input.autocomplete = 'off';
      input.value = (currentUser && currentUser.nickname) || '';
      card.appendChild(input);

      const count = document.createElement('div');
      count.id = 'pong-nickname-count';
      card.appendChild(count);

      const flash = document.createElement('div');
      flash.id = 'pong-settings-flash';
      card.appendChild(flash);

      const actions = document.createElement('div');
      actions.id = 'pong-settings-actions';

      const cancelBtn = document.createElement('button');
      cancelBtn.id = 'pong-settings-cancel';
      cancelBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => closeSettingsModal());
      actions.appendChild(cancelBtn);

      const saveBtn = document.createElement('button');
      saveBtn.id = 'pong-settings-save';
      saveBtn.className = 'pong-auth-btn';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', () => saveNickname(input, saveBtn, flash));
      actions.appendChild(saveBtn);

      card.appendChild(actions);
      overlay.appendChild(card);
      document.body.appendChild(overlay);

      updateNicknameCount(input, count, saveBtn);
      input.addEventListener('input', () => updateNicknameCount(input, count, saveBtn));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !saveBtn.disabled) saveNickname(input, saveBtn, flash);
        if (e.key === 'Escape') closeSettingsModal();
      });

      input.focus();
      input.select();
    }

    /**
     * Remove the Settings modal from the DOM if present.
     */
    function closeSettingsModal() {
      const existing = document.getElementById('pong-settings-modal');
      if (existing) existing.remove();
    }

    /**
     * Update the live "N/20" character count next to the nickname input,
     * flagging it (and disabling Save) when the trimmed value is over the
     * limit — mirrors the NICKNAME_MAX_LENGTH the server enforces.
     */
    function updateNicknameCount(input, count, saveBtn) {
      const len = input.value.trim().length;
      count.textContent = `${len}/${NICKNAME_MAX_LENGTH}`;
      const invalid = len > NICKNAME_MAX_LENGTH;
      count.classList.toggle('invalid', invalid);
      input.classList.toggle('invalid', invalid);
      saveBtn.disabled = invalid;
    }

    /**
     * PATCH /api/user/nickname with the trimmed input value (an empty
     * value clears the nickname back to unset), then update currentUser and
     * every place the nickname is displayed, flash a brief success message,
     * and close the modal.
     */
    async function saveNickname(input, saveBtn, flash) {
      const nickname = input.value.trim();
      saveBtn.disabled = true;
      const original = saveBtn.textContent;
      saveBtn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/user/nickname', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ nickname: nickname.length ? nickname : null }),
        });

        if (!res.ok) {
          flash.style.color = '#ff6b6b';
          flash.textContent = 'Could not save — try again';
          saveBtn.textContent = original;
          saveBtn.disabled = false;
          return;
        }

        const data = await res.json();
        currentUser = data.user;

        // Refresh every place the nickname is displayed.
        const label = document.getElementById('pong-user-label');
        if (label) label.textContent = displayName(currentUser);
        updatePlayingAsLine();

        flash.style.color = '#7CFC9C';
        flash.textContent = 'Saved!';
        setTimeout(() => closeSettingsModal(), 700);
      } catch (err) {
        flash.style.color = '#ff6b6b';
        flash.textContent = 'Could not save — try again';
        saveBtn.textContent = original;
        saveBtn.disabled = false;
      }
    }

    // ── Global leaderboard (modal from a trophy button) ───────────────────
    //
    // A trophy button in the auth bar opens a modal, styled like the Settings
    // modal, listing the top players from the public GET /api/scores (the
    // board size comes from GET /api/config, with a default if that can't be
    // fetched). The
    // board is fetched afresh on every open and shows loading / empty / error
    // states. The row whose userId matches the signed-in user (from GET /me)
    // is highlighted; signed-out visitors see the whole board plus a sign-in
    // link.

    const LEADERBOARD_DEFAULT_CONFIG = { placement: 'modal-from-a-button', limit: 10 };
    let leaderboardConfig = LEADERBOARD_DEFAULT_CONFIG;

    /**
     * Ask the server for the leaderboard settings. Any failure keeps the
     * defaults.
     */
    async function loadLeaderboardConfig() {
      try {
        const res = await fetch('/api/config', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.leaderboard && data.leaderboard.placement) {
          leaderboardConfig = Object.assign({}, LEADERBOARD_DEFAULT_CONFIG, data.leaderboard);
        }

      } catch (err) {
        // keep the default
      }
    }

    /**
     * Ask the server for the Power-Ups pickup pacing and where the effect
     * badge sits. Any failure keeps the defaults.
     */
    async function loadPowerUpConfig() {
      try {
        const res = await fetch('/api/config', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        const cfg = data && data.powerUps;
        if (cfg && cfg.pacing && cfg.pacing.effectDurationsS) {
          powerUpPacing = Object.assign({}, DEFAULT_PACING, cfg.pacing);
        }
        if (cfg && cfg.set && Array.isArray(cfg.set.kinds)) {
          powerUpSet = Object.assign({}, DEFAULT_POWER_UP_SET, cfg.set);
        }
        if (cfg && cfg.badge && cfg.badge.placement) {
          const el = document.getElementById('pong-effect-badge');
          if (el) el.dataset.placement = cfg.badge.placement;
        }
      } catch (err) {
        // keep the defaults
      }
    }

    /**
     * Add the trophy button to the auth bar.
     */
    function appendLeaderboardButton(bar) {
      const btn = document.createElement('button');
      btn.id = 'pong-leaderboard-btn';
      btn.className = 'pong-auth-btn pong-auth-btn-ghost';
      btn.textContent = '🏆';
      btn.title = 'Leaderboard';
      btn.setAttribute('aria-label', 'Leaderboard');
      btn.addEventListener('click', () => openLeaderboardModal());
      bar.appendChild(btn);
    }

    /**
     * Escape a value for safe insertion into HTML text/attributes (player
     * names are user-chosen).
     */
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    /**
     * Pure: the HTML for the modal body.
     *
     * @param {{status:'loading'|'error'|'ready', scores?:Array}} state
     * @param {?string} myUserId  the signed-in user's id, or null when signed out
     */
    function renderLeaderboardBody(state, myUserId) {
      if (state.status === 'loading') {
        return '<div class="pong-lb-status" id="pong-lb-loading">Loading leaderboard…</div>';
      }
      if (state.status === 'error') {
        return '<div class="pong-lb-status error" id="pong-lb-error">Could not load the leaderboard — try again.</div>';
      }

      const scores = state.scores || [];
      let html = '';
      if (scores.length === 0) {
        html += '<div class="pong-lb-status" id="pong-lb-empty">No scores yet — be the first on the board!</div>';
      } else {
        html += '<table class="pong-lb-table"><thead><tr>'
          + '<th class="pong-lb-rank">#</th>'
          + '<th class="pong-lb-player">Player</th>'
          + '<th>Score</th>'
          + '<th>Longest rally</th>'
          + '</tr></thead><tbody>';
        scores.forEach((entry, i) => {
          const rank = entry.rank || i + 1;
          const isMe = Boolean(myUserId) && entry.userId === myUserId;
          const classes = [];
          if (rank <= 3) classes.push('pong-lb-top');
          if (isMe) classes.push('pong-lb-me');
          html += `<tr${classes.length ? ` class="${classes.join(' ')}"` : ''}>`
            + `<td class="pong-lb-rank">${escapeHtml(rank)}</td>`
            + `<td class="pong-lb-player">${escapeHtml(entry.player)}${isMe ? ' (you)' : ''}</td>`
            + `<td>${escapeHtml(entry.score)}</td>`
            + `<td>${escapeHtml(entry.longestRally || 0)}</td>`
            + '</tr>';
        });
        html += '</tbody></table>';
      }

      if (!myUserId) {
        html += '<div class="pong-lb-note"><a id="pong-lb-signin" href="/auth/google">Sign in with Google to get on the board</a></div>';
      } else if (scores.length > 0 && !scores.some((e) => e.userId === myUserId)) {
        html += '<div class="pong-lb-note" id="pong-lb-not-ranked">Finish a game to climb onto the board.</div>';
      }
      return html;
    }

    /**
     * Build and show the Leaderboard modal, then fetch the board.
     */
    function openLeaderboardModal() {
      closeLeaderboardModal(); // defensive guard against a pre-existing modal

      const overlay = document.createElement('div');
      overlay.id = 'pong-leaderboard-modal';
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeLeaderboardModal();
      });

      const card = document.createElement('div');
      card.id = 'pong-leaderboard-card';
      card.setAttribute('role', 'dialog');
      card.setAttribute('aria-label', 'Leaderboard');

      const h2 = document.createElement('h2');
      h2.textContent = '🏆 Leaderboard — Top ' + leaderboardConfig.limit;
      card.appendChild(h2);

      const body = document.createElement('div');
      body.id = 'pong-leaderboard-body';
      card.appendChild(body);

      const actions = document.createElement('div');
      actions.id = 'pong-leaderboard-actions';
      const closeBtn = document.createElement('button');
      closeBtn.id = 'pong-leaderboard-close';
      closeBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      closeBtn.textContent = 'Close';
      closeBtn.addEventListener('click', () => closeLeaderboardModal());
      actions.appendChild(closeBtn);
      card.appendChild(actions);

      overlay.appendChild(card);
      document.body.appendChild(overlay);
      closeBtn.focus();

      const onKey = (e) => {
        if (e.key === 'Escape') closeLeaderboardModal();
      };
      document.addEventListener('keydown', onKey);
      overlay.addEventListener('pong-leaderboard-closed', () => document.removeEventListener('keydown', onKey));

      loadLeaderboardInto(body);
    }

    /**
     * Fetch GET /api/scores?limit=N (every time the modal opens) and render
     * the result into the modal body. Ignores a response that arrives after
     * the modal was closed or re-opened.
     */
    async function loadLeaderboardInto(body) {
      const myUserId = currentUser ? currentUser.id : null;
      body.innerHTML = renderLeaderboardBody({ status: 'loading' }, myUserId);
      try {
        const res = await fetch(`/api/scores?limit=${encodeURIComponent(leaderboardConfig.limit)}`, { credentials: 'same-origin' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!document.body.contains(body)) return;
        body.innerHTML = renderLeaderboardBody({ status: 'ready', scores: data.scores || [] }, myUserId);
      } catch (err) {
        if (!document.body.contains(body)) return;
        body.innerHTML = renderLeaderboardBody({ status: 'error' }, myUserId);
      }
    }

    /**
     * Remove the Leaderboard modal from the DOM if present.
     */
    function closeLeaderboardModal() {
      const existing = document.getElementById('pong-leaderboard-modal');
      if (existing) {
        existing.dispatchEvent(new Event('pong-leaderboard-closed'));
        existing.remove();
      }
    }

    /**
     * Fetch the current session's user (if any) from GET /me and render
     * the appropriate auth bar state. Called once on page load.
     */
    async function initAuthBar() {
      const bar = getAuthBar();
      await loadLeaderboardConfig();
      try {
        const res  = await fetch('/me', { credentials: 'same-origin' });
        const data = await res.json();
        if (data && data.user) {
          currentUser     = data.user;
          bestRallyBucket = Boolean(data.bestRallyBucket);
          renderSignedIn(bar, data.user);
          refreshRecentGames();
          if (engagementUI) engagementUI.load(data.engagement);
        } else {
          currentUser     = null;
          bestRallyBucket = false;
          renderSignedOut(bar);
          removeRecentGamesPanel();
          if (engagementUI) engagementUI.showSignedOut(data && data.engagement);
        }
      } catch (err) {
        currentUser     = null;
        bestRallyBucket = false;
        renderSignedOut(bar);
        removeRecentGamesPanel();
        if (engagementUI) engagementUI.showSignedOut(null);
      }
    }

    // Daily-play streak badge and 'beat your yesterday' toast (engagement-client.js).
    const engagementUI = window.PongEngagement
      ? window.PongEngagement.create({ document, window, fetch: window.fetch.bind(window) })
      : null;

    initAuthBar();

    // ── Recent Games panel ────────────────────────────────────────────────
    //
    // A small fixed panel, shown only while signed in, listing the
    // authenticated player's 10 most recent finished games (score, duration,
    // finished-at) fetched from GET /api/game-history. Refreshed each time a
    // score is successfully saved.

    /**
     * Create (or return the existing) recent-games panel element.
     */
    function getRecentGamesPanel() {
      let panel = document.getElementById('pong-recent-games');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'pong-recent-games';
        document.body.appendChild(panel);
      }
      return panel;
    }

    /**
     * Remove the recent-games panel from the DOM if present (signed-out state).
     */
    function removeRecentGamesPanel() {
      const existing = document.getElementById('pong-recent-games');
      if (existing) existing.remove();
    }

    /**
     * Render the panel from an array of { score, duration, finishedAt } entries.
     * Each render starts with a "Playing as: <nickname or 'Player'>" line
     * (see displayName / updatePlayingAsLine) — the panel is always the
     * signed-in player's own game history, so this is who "row" is for.
     */
    function renderRecentGames(games) {
      const panel = getRecentGamesPanel();
      panel.innerHTML = '';

      const heading = document.createElement('h2');
      heading.textContent = 'Recent Games';
      panel.appendChild(heading);

      const playingAs = document.createElement('p');
      playingAs.className = 'playing-as';
      playingAs.id = 'pong-playing-as';
      playingAs.textContent = `Playing as: ${displayName(currentUser)}`;
      panel.appendChild(playingAs);

      if (!games || games.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No games played yet';
        panel.appendChild(empty);
        return;
      }

      const list = document.createElement('ul');
      games.forEach((g) => {
        const item = document.createElement('li');
        const when = new Date(g.finishedAt);
        const timeLabel = isNaN(when.getTime()) ? '' : when.toLocaleTimeString();
        item.innerHTML =
          `<span>Score ${g.score}</span><span>${g.duration}s · ${timeLabel}</span>`;
        list.appendChild(item);
      });
      panel.appendChild(list);
    }

    /**
     * Refresh the "Playing as: …" line in the recent-games panel (e.g.
     * right after a nickname save) without re-fetching game history.
     */
    function updatePlayingAsLine() {
      const el = document.getElementById('pong-playing-as');
      if (el) el.textContent = `Playing as: ${displayName(currentUser)}`;
    }

    /**
     * Fetch GET /api/game-history and render the panel. Silently does
     * nothing on failure (e.g. session expired) rather than breaking gameplay.
     */
    async function refreshRecentGames() {
      try {
        const res = await fetch('/api/game-history', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        renderRecentGames(data.games || []);
      } catch (err) {
        // Non-critical — leave whatever was last rendered (or nothing).
      }
    }

    /**
     * Tear down the current overlay, reset all state to `modeKey`, announce the
     * mode and restart the animation loop. Safe in any game phase.
     */
    function beginGame(modeKey) {
      if (game.phase === 'gameover') {
        try { sessionStorage.removeItem(MENDEL_GAME_OVER_FLAG); } catch (err) { /* ignore */ }
      }
      removeGameOverOverlay();
      clearBestRallyDisplay();
      resetGame();
      applyMode(modeKey);
      announceSplashThenBadge(modeKey);
      sendMendelEvent('game_started');
      if (MODES[modeKey].fun) sendMendelEvent('fun_mode_started', { mode: modeKey });
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    /**
     * Start a fresh Normal game. Called by the 'Play Again' button click and
     * the Space keyboard shortcut.
     */
    function startNewGame() {
      if (game.phase === 'gameover') sendMendelEvent('play_again_click');
      beginGame('normal');
    }

    /**
     * Start a fresh game in a random fun mode (the control panel button).
     */
    function startFunGame() {
      beginGame(pickFunMode());
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The RAF loop is paused when gameover; nothing to update.
      if (game.phase === 'gameover') return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      gameElapsedSeconds += dt;

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - playerPaddle.h);

      // AI paddle movement — lerp toward the ball centre (in multi-ball mode,
      // the incoming ball nearest the AI); lerp speed increases slightly each
      // rally hit (difficulty escalation).
      // Freeze AI (Power-Ups) leaves the paddle where it is.
      if (!isAiFrozen()) {
        const target        = pickAiTarget();
        const ballCentreY   = target.y + BALL_SIZE / 2;
        const aiCentreY     = aiPaddle.y + aiPaddle.h / 2;
        const aiDiff        = ballCentreY - aiCentreY;
        const effectiveLerp = AI_LERP + rally.rallyCount * AI_LERP_RALLY_INC;
        const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
        aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - aiPaddle.h);
      }

      // Move every ball (Slow-Mo scales their time). The first to leave the
      // field scores the point and ends the play phase, so the rest are not
      // advanced this frame.
      const ballDt = dt * ballTimeScale();
      for (const b of [ball].concat(game.extraBalls)) {
        if (game.phase !== 'playing') break;
        updateBall(b, ballDt);
      }

      // Power-Ups: pickups and timed effects (only while a point is still live).
      if (game.mode === 'powerUps' && game.phase === 'playing') updatePowerUps(dt);
    }

    /**
     * The ball the AI chases: the incoming ball nearest its paddle, or the
     * primary ball when none is heading its way.
     */
    function pickAiTarget() {
      const incoming = [ball].concat(game.extraBalls).filter((b) => b.vx > 0);
      const target = incoming.length === 0
        ? ball
        : incoming.reduce((best, b) => (b.x > best.x ? b : best));
      // Ghost Ball: the AI chases a stale, offset copy of the ball's position.
      const ghost = findEffect('ghostBall');
      if (!ghost) return target;
      return { x: target.x, y: target.y + ghost.offset };
    }

    /**
     * Reflect `b` off any barrier it overlaps, along the axis of least
     * penetration, and push it back out. A ball already moving away from the
     * face it penetrates is left alone so it cannot get stuck.
     */
    function bounceOffBarriers(b) {
      for (const bar of game.barriers) {
        if (!aabbOverlap(b.x, b.y, b.w, b.h, bar.x, bar.y, bar.w, bar.h)) continue;

        const fromLeft   = b.x + b.w - bar.x;
        const fromRight  = bar.x + bar.w - b.x;
        const fromTop    = b.y + b.h - bar.y;
        const fromBottom = bar.y + bar.h - b.y;
        const least      = Math.min(fromLeft, fromRight, fromTop, fromBottom);

        if (least === fromLeft && b.vx > 0) {
          b.x = bar.x - b.w;
          b.angle = Math.PI - b.angle;
        } else if (least === fromRight && b.vx < 0) {
          b.x = bar.x + bar.w;
          b.angle = Math.PI - b.angle;
        } else if (least === fromTop && b.vy > 0) {
          b.y = bar.y - b.h;
          b.angle = -b.angle;
        } else if (least === fromBottom && b.vy < 0) {
          b.y = bar.y + bar.h;
          b.angle = -b.angle;
        } else {
          continue;
        }
        syncBallVelocity(b);
      }
    }

    /**
     * Advance one ball a tick and resolve walls, barriers, paddles and exits.
     */
    function updateBall(b, dt) {
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (b.y <= 0) {
        b.y     = 0;
        b.angle = -b.angle;
        syncBallVelocity(b);
      } else if (b.y + BALL_SIZE >= CANVAS_H) {
        b.y     = CANVAS_H - BALL_SIZE;
        b.angle = -b.angle;
        syncBallVelocity(b);
      }

      // ── Ball vs barriers (none outside 'bouncyBarriers' mode) ─────────────
      bounceOffBarriers(b);

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        b.vx < 0 &&
        aabbOverlap(b.x, b.y, b.w, b.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        b.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (b.y + BALL_SIZE / 2) - (playerPaddle.y + playerPaddle.h / 2);
        b.angle  = deflectAngle(relY, playerPaddle.h);
        b.speed  = clamp(b.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(b);
        rally.rallyCount += 1;
        if (rally.rallyCount > rally.maxRally) rally.maxRally = rally.rallyCount;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        b.vx > 0 &&
        aabbOverlap(b.x, b.y, b.w, b.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        b.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (b.y + BALL_SIZE / 2) - (aiPaddle.y + aiPaddle.h / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        b.angle  = Math.PI - deflectAngle(relY, aiPaddle.h);
        b.speed  = clamp(b.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(b);
        rally.rallyCount += 1;
        if (rally.rallyCount > rally.maxRally) rally.maxRally = rally.rallyCount;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (b.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
        clearPowerUps();
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (b.x > CANVAS_W) {
        playerPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
        clearPowerUps();
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to dark blue
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#00008b';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#4a5a8f';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = '#fff';
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Barriers ('bouncyBarriers' mode; the list is empty otherwise)
      ctx.fillStyle = '#ffb000';
      game.barriers.forEach((bar) => ctx.fillRect(bar.x, bar.y, bar.w, bar.h));
      ctx.fillStyle = '#fff';

      // Power-Ups pickups (the list is empty outside 'powerUps' mode)
      game.pickups.forEach((p) => {
        ctx.fillStyle = POWER_UP_KINDS[p.kind].colour;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y, p.w, p.h);
      });
      ctx.fillStyle = '#fff';
      updateEffectBadge();

      // 'beside-player-paddle' badge placement: chips drawn next to the paddle
      const badgeEl = document.getElementById('pong-effect-badge');
      if (badgeEl && badgeEl.dataset.placement === 'beside-player-paddle' && window.PongBesidePaddleBadge) {
        window.PongBesidePaddleBadge.drawChips(
          ctx, game.effects, playerPaddle, POWER_UP_KINDS, powerUpPacing.effectDurationsS, CANVAS_H);
        ctx.fillStyle = '#fff';
      }

      // Balls (only when playing; extra balls only in 'multiBall' mode)
      if (game.phase === 'playing') {
        ctx.globalAlpha = ballAlpha();
        [ball].concat(game.extraBalls).forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));
        ctx.globalAlpha = 1;
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // When game.phase becomes 'gameover' the loop stops scheduling itself and
    // shows the HTML overlay instead.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      if (game.phase === 'gameover') {
        // Pause the loop and present the DOM overlay
        rafId = null;
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        updateBestRallyDisplay();
        showGameOverOverlay(winnerLabel, playerPaddle.score, aiPaddle.score);
        return; // do NOT schedule next frame
      }

      rafId = requestAnimationFrame(loop);
    }

    // Kick off the animation loop
    wireControlPanelButton();
    loadPowerUpConfig();
    sendMendelEvent('game_started');
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
