<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>

  <!-- Supabase JS SDK (CDN) ─────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    'use strict';

    // ── Supabase Configuration ─────────────────────────────────────────────────
    //
    // SUPABASE_URL and SUPABASE_ANON_KEY are the public-safe values exposed in
    // every Supabase project.  Row Level Security policies on high_scores ensure
    // users can only write their own rows despite the key being public.
    //
    // These values are intentionally hardcoded anon keys (not secrets).
    // Replace with your actual project URL and anon key.

    const SUPABASE_URL      = window.__SUPABASE_URL__      || 'https://your-project.supabase.co';
    const SUPABASE_ANON_KEY = window.__SUPABASE_ANON_KEY__ || 'your-anon-key';

    const supabase = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    // ── Auth State ────────────────────────────────────────────────────────────
    let currentUser = null;

    if (supabase) {
      // Restore session on load and keep currentUser in sync.
      supabase.auth.getSession().then(({ data: { session } }) => {
        currentUser = session ? session.user : null;
        updateAuthUI();
      });

      supabase.auth.onAuthStateChange((_event, session) => {
        currentUser = session ? session.user : null;
        updateAuthUI();
      });
    }

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject pulsing button animation style ─────────────────────────────────
    //
    // A <style> tag is injected once into <head> so the 'Play Again' button can
    // use a CSS keyframe animation without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }

        /* ── Shared overlay base ──────────────────────────────────────────── */
        #pong-overlay,
        #pong-auth-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.82);
          backdrop-filter: blur(3px);
          gap: 14px;
          font-family: monospace;
        }

        /* ── Game-over overlay ────────────────────────────────────────────── */
        #pong-overlay h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: clamp(1rem, 3vw, 1.5rem);
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-play-again {
          margin-top: 8px;
          padding: 14px 40px;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Leaderboard ──────────────────────────────────────────────────── */
        #pong-leaderboard {
          min-width: 220px;
          max-width: 320px;
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(255,255,255,0.15);
          border-radius: 6px;
          padding: 12px 18px;
          color: #fff;
          font-size: 0.85rem;
          letter-spacing: 0.04em;
        }
        #pong-leaderboard h2 {
          font-size: 0.9rem;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          color: rgba(255,255,255,0.6);
          margin-bottom: 8px;
          text-align: center;
        }
        #pong-leaderboard ol {
          list-style: none;
          padding: 0;
          margin: 0;
        }
        #pong-leaderboard li {
          display: flex;
          justify-content: space-between;
          padding: 3px 0;
          border-bottom: 1px solid rgba(255,255,255,0.07);
          color: rgba(255,255,255,0.8);
        }
        #pong-leaderboard li:last-child { border-bottom: none; }
        #pong-leaderboard li.current-user {
          color: #ffe066;
          font-weight: bold;
        }
        #pong-leaderboard .lb-rank   { width: 28px; color: rgba(255,255,255,0.4); }
        #pong-leaderboard .lb-email  { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #pong-leaderboard .lb-score  { margin-left: 12px; font-weight: bold; }
        #pong-leaderboard .lb-empty  { color: rgba(255,255,255,0.35); text-align: center; padding: 6px 0; }

        /* ── Score-saved notice ───────────────────────────────────────────── */
        #pong-score-notice {
          font-size: 0.8rem;
          color: #ffe066;
          letter-spacing: 0.04em;
          min-height: 1.2em;
          text-align: center;
        }

        /* ── Auth overlay ─────────────────────────────────────────────────── */
        #pong-auth-overlay h2 {
          font-size: 1.6rem;
          color: #fff;
          letter-spacing: 0.08em;
          text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }
        #pong-auth-overlay .auth-subtitle {
          font-size: 0.82rem;
          color: rgba(255,255,255,0.45);
          letter-spacing: 0.05em;
        }
        .auth-form {
          display: flex;
          flex-direction: column;
          gap: 10px;
          width: 260px;
        }
        .auth-form input {
          padding: 10px 14px;
          font-family: monospace;
          font-size: 0.95rem;
          background: rgba(255,255,255,0.08);
          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 4px;
          color: #fff;
          outline: none;
          transition: border-color 0.15s;
        }
        .auth-form input::placeholder { color: rgba(255,255,255,0.3); }
        .auth-form input:focus { border-color: rgba(255,255,255,0.6); }
        .auth-btn-row {
          display: flex;
          gap: 8px;
          margin-top: 2px;
        }
        .auth-btn {
          flex: 1;
          padding: 10px 0;
          font-family: monospace;
          font-size: 0.9rem;
          font-weight: bold;
          letter-spacing: 0.08em;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: opacity 0.15s;
        }
        .auth-btn:hover { opacity: 0.85; }
        .auth-btn-primary { background: #fff; color: #000; }
        .auth-btn-secondary { background: rgba(255,255,255,0.12); color: #fff; }
        .auth-error {
          font-size: 0.78rem;
          color: #ff6b6b;
          text-align: center;
          min-height: 1.1em;
        }
        .auth-skip {
          font-size: 0.78rem;
          color: rgba(255,255,255,0.35);
          cursor: pointer;
          background: none;
          border: none;
          font-family: monospace;
          letter-spacing: 0.04em;
          margin-top: 2px;
          text-decoration: underline;
          text-underline-offset: 2px;
        }
        .auth-skip:hover { color: rgba(255,255,255,0.6); }

        /* ── Persistent auth status bar ───────────────────────────────────── */
        #pong-auth-bar {
          position: fixed;
          top: 8px;
          right: 12px;
          z-index: 5;
          display: flex;
          align-items: center;
          gap: 10px;
          font-family: monospace;
          font-size: 0.72rem;
          color: rgba(255,255,255,0.4);
          pointer-events: none;
        }
        #pong-auth-bar button {
          pointer-events: all;
          background: none;
          border: 1px solid rgba(255,255,255,0.25);
          border-radius: 3px;
          color: rgba(255,255,255,0.5);
          font-family: monospace;
          font-size: 0.72rem;
          padding: 2px 8px;
          cursor: pointer;
          transition: color 0.15s, border-color 0.15s;
        }
        #pong-auth-bar button:hover {
          color: #fff;
          border-color: rgba(255,255,255,0.6);
        }
      `;
      document.head.appendChild(style);
    })();

    // ── Auth Status Bar ───────────────────────────────────────────────────────
    //
    // A small persistent bar in the top-right corner shows the current user's
    // email (or a "Sign In" button when logged out).

    const authBar = document.createElement('div');
    authBar.id = 'pong-auth-bar';
    document.body.appendChild(authBar);

    function updateAuthUI() {
      authBar.innerHTML = '';
      if (currentUser) {
        const emailSpan = document.createElement('span');
        // Truncate long emails for display
        emailSpan.textContent = currentUser.email || 'signed in';
        authBar.appendChild(emailSpan);

        const signOutBtn = document.createElement('button');
        signOutBtn.textContent = 'Sign out';
        signOutBtn.addEventListener('click', async () => {
          if (supabase) await supabase.auth.signOut();
        });
        authBar.appendChild(signOutBtn);
      } else {
        const signInBtn = document.createElement('button');
        signInBtn.textContent = 'Sign in / Register';
        signInBtn.addEventListener('click', () => showAuthOverlay());
        authBar.appendChild(signInBtn);
      }
    }

    // ── Auth Overlay ──────────────────────────────────────────────────────────
    //
    // A full-screen overlay with email + password fields and Sign In / Sign Up
    // buttons.  Dismissible via "Play as guest" so auth is never mandatory.

    function showAuthOverlay(afterAuthCallback) {
      removeAuthOverlay();

      const overlay = document.createElement('div');
      overlay.id = 'pong-auth-overlay';

      const title = document.createElement('h2');
      title.textContent = '🏓 Pong';
      overlay.appendChild(title);

      const subtitle = document.createElement('p');
      subtitle.className = 'auth-subtitle';
      subtitle.textContent = 'Sign in to save scores & compete on the leaderboard';
      overlay.appendChild(subtitle);

      const form = document.createElement('div');
      form.className = 'auth-form';

      const emailInput = document.createElement('input');
      emailInput.type = 'email';
      emailInput.placeholder = 'Email';
      emailInput.autocomplete = 'email';
      emailInput.id = 'pong-auth-email';
      form.appendChild(emailInput);

      const passInput = document.createElement('input');
      passInput.type = 'password';
      passInput.placeholder = 'Password';
      passInput.autocomplete = 'current-password';
      passInput.id = 'pong-auth-password';
      form.appendChild(passInput);

      const btnRow = document.createElement('div');
      btnRow.className = 'auth-btn-row';

      const signInBtn = document.createElement('button');
      signInBtn.className = 'auth-btn auth-btn-primary';
      signInBtn.textContent = 'Sign In';
      signInBtn.id = 'pong-signin-btn';

      const signUpBtn = document.createElement('button');
      signUpBtn.className = 'auth-btn auth-btn-secondary';
      signUpBtn.textContent = 'Sign Up';
      signUpBtn.id = 'pong-signup-btn';

      btnRow.appendChild(signInBtn);
      btnRow.appendChild(signUpBtn);
      form.appendChild(btnRow);

      const errorMsg = document.createElement('p');
      errorMsg.className = 'auth-error';
      errorMsg.id = 'pong-auth-error';
      form.appendChild(errorMsg);

      overlay.appendChild(form);

      const skipBtn = document.createElement('button');
      skipBtn.className = 'auth-skip';
      skipBtn.textContent = 'Play as guest (scores won\'t be saved)';
      overlay.appendChild(skipBtn);

      document.body.appendChild(overlay);

      // Focus email input immediately
      emailInput.focus();

      function setError(msg) {
        const el = document.getElementById('pong-auth-error');
        if (el) el.textContent = msg;
      }

      async function handleSignIn() {
        if (!supabase) { setError('Supabase not configured.'); return; }
        const email = emailInput.value.trim();
        const password = passInput.value;
        if (!email || !password) { setError('Please enter email and password.'); return; }
        signInBtn.disabled = true;
        signInBtn.textContent = '…';
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        signInBtn.disabled = false;
        signInBtn.textContent = 'Sign In';
        if (error) {
          setError(error.message);
        } else {
          removeAuthOverlay();
          if (afterAuthCallback) afterAuthCallback();
        }
      }

      async function handleSignUp() {
        if (!supabase) { setError('Supabase not configured.'); return; }
        const email = emailInput.value.trim();
        const password = passInput.value;
        if (!email || !password) { setError('Please enter email and password.'); return; }
        if (password.length < 6) { setError('Password must be at least 6 characters.'); return; }
        signUpBtn.disabled = true;
        signUpBtn.textContent = '…';
        const { error } = await supabase.auth.signUp({ email, password });
        signUpBtn.disabled = false;
        signUpBtn.textContent = 'Sign Up';
        if (error) {
          setError(error.message);
        } else {
          setError('');
          // Sign-up may require email confirmation; try auto-sign-in.
          const { error: siErr } = await supabase.auth.signInWithPassword({ email, password });
          if (!siErr) {
            removeAuthOverlay();
            if (afterAuthCallback) afterAuthCallback();
          } else {
            setError('Account created! Check your email to confirm, then sign in.');
          }
        }
      }

      signInBtn.addEventListener('click', handleSignIn);
      signUpBtn.addEventListener('click', handleSignUp);
      skipBtn.addEventListener('click', () => removeAuthOverlay());

      // Allow Enter key to trigger sign-in
      passInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleSignIn();
      });
      emailInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') passInput.focus();
      });
    }

    function removeAuthOverlay() {
      const existing = document.getElementById('pong-auth-overlay');
      if (existing) existing.remove();
    }

    // ── Supabase High-Score Helpers ───────────────────────────────────────────

    /**
     * Persist a player score to the high_scores table.
     * Only called when the player wins and is authenticated.
     * Uses upsert so only the user's personal best is stored per user.
     *
     * @param {number} score - The player's winning score (always SCORE_WIN when they win)
     * @param {number} aiScore - The AI's score at game end
     * @returns {Promise<{ saved: boolean, error: any }>}
     */
    async function saveHighScore(score, aiScore) {
      if (!supabase || !currentUser) return { saved: false, error: null };
      try {
        // Fetch current personal best for this user
        const { data: existing } = await supabase
          .from('high_scores')
          .select('score')
          .eq('user_id', currentUser.id)
          .maybeSingle();

        const currentBest = existing ? existing.score : -1;

        // Composite score: player score * 100 + (SCORE_WIN - ai score) for tiebreak
        const compositeScore = score * 100 + (SCORE_WIN - aiScore);

        if (compositeScore <= currentBest) {
          return { saved: false, error: null, reason: 'not-a-new-best' };
        }

        const { error } = await supabase
          .from('high_scores')
          .upsert(
            { user_id: currentUser.id, score: compositeScore },
            { onConflict: 'user_id' }
          );

        return { saved: !error, error };
      } catch (err) {
        return { saved: false, error: err };
      }
    }

    /**
     * Fetch the top-10 high scores.
     * Returns an array of { email, score } objects.
     *
     * @returns {Promise<Array<{ email: string, score: number }>>}
     */
    async function fetchLeaderboard() {
      if (!supabase) return [];
      try {
        const { data, error } = await supabase
          .from('high_scores')
          .select('score, users:user_id(email)')
          .order('score', { ascending: false })
          .limit(10);

        if (error || !data) return [];

        return data.map((row) => ({
          email: (row.users && row.users.email) ? row.users.email : 'anonymous',
          score: row.score,
          user_id: row.user_id,
        }));
      } catch (_err) {
        return [];
      }
    }

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.
    //
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // gameState can be: 'playing' | 'scored' | 'gameover'
    // (replaces the original 'won' phase; the overlay handles that display layer)
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    // Rally state — tracks consecutive paddle hits for difficulty escalation
    // and the short score-flash effect.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      // Space triggers restart when overlay is visible (accessibility shortcut)
      if (e.code === 'Space' && game.phase === 'gameover') {
        startNewGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * Returns a value in [-MAX_DEFLECT_ANGLE, +MAX_DEFLECT_ANGLE].
     */
    function deflectAngle(relY) {
      const norm = clamp(relY / (PADDLE_H / 2), -1, 1);
      return norm * MAX_DEFLECT_ANGLE;
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     * Resets the rally counter.
     */
    function resetBall(dirSign) {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = BALL_SPEED_INIT;
      rally.rallyCount = 0;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      ball.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(ball);
    }

    /**
     * Reset both paddles and scores; start fresh.
     */
    function resetGame() {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
      rally.rallyCount  = 0;
      rally.flashFrames = 0;
    }

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a full-screen semi-transparent div injected
    // into the document via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the full-screen game-over overlay.
     * When the player wins and is authenticated, saves the score and shows a
     * leaderboard.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    async function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Score-saved notice (only relevant when player wins)
      const noticeEl = document.createElement('p');
      noticeEl.id = 'pong-score-notice';
      overlay.appendChild(noticeEl);

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      // Leaderboard container (populated asynchronously)
      const lbContainer = document.createElement('div');
      lbContainer.id = 'pong-leaderboard';
      const lbTitle = document.createElement('h2');
      lbTitle.textContent = 'Top 10';
      lbContainer.appendChild(lbTitle);
      const lbList = document.createElement('ol');
      lbList.id = 'pong-leaderboard-list';
      lbContainer.appendChild(lbList);
      overlay.appendChild(lbContainer);

      document.body.appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();

      // ── Async: save score then refresh leaderboard ─────────────────────────

      if (game.winner === 'player') {
        if (!currentUser && supabase) {
          // Prompt the player to sign in so their score can be saved
          noticeEl.textContent = 'Sign in to save your score!';
          const signInPromptBtn = document.createElement('button');
          signInPromptBtn.style.cssText = 'background:none;border:1px solid rgba(255,255,255,0.35);border-radius:3px;color:rgba(255,255,255,0.7);font-family:monospace;font-size:0.8rem;padding:4px 12px;cursor:pointer;margin-top:-4px;';
          signInPromptBtn.textContent = 'Sign in / Register';
          signInPromptBtn.addEventListener('click', () => {
            showAuthOverlay(async () => {
              // After auth, try saving the score
              const result = await saveHighScore(playerScore, aiScore);
              if (result.saved) {
                noticeEl.textContent = '✓ Score saved!';
                signInPromptBtn.remove();
              }
              await refreshLeaderboard(lbList);
            });
          });
          overlay.insertBefore(signInPromptBtn, lbContainer);
        } else if (currentUser) {
          noticeEl.textContent = 'Saving score…';
          const result = await saveHighScore(playerScore, aiScore);
          if (result.saved) {
            noticeEl.textContent = '✓ New personal best saved!';
          } else if (result.reason === 'not-a-new-best') {
            noticeEl.textContent = 'Good game! (Not a new personal best)';
          } else {
            noticeEl.textContent = '';
          }
        }
      }

      // Refresh leaderboard after potential score save
      await refreshLeaderboard(lbList);
    }

    /**
     * Populate or refresh the leaderboard list element with fresh data.
     * @param {HTMLElement} listEl - The <ol> to populate
     */
    async function refreshLeaderboard(listEl) {
      listEl.innerHTML = '';
      const rows = await fetchLeaderboard();

      if (rows.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'lb-empty';
        empty.textContent = supabase ? 'No scores yet — be the first!' : 'Sign in to see scores';
        listEl.appendChild(empty);
        return;
      }

      rows.forEach((row, idx) => {
        const li = document.createElement('li');
        // Highlight the current user's row
        if (currentUser && row.user_id === currentUser.id) {
          li.className = 'current-user';
        }

        const rank = document.createElement('span');
        rank.className = 'lb-rank';
        rank.textContent = `${idx + 1}.`;

        const email = document.createElement('span');
        email.className = 'lb-email';
        // Partially mask email for privacy: show first 3 chars + domain
        email.textContent = maskEmail(row.email);
        email.title = row.email;  // full email on hover for own entry

        const score = document.createElement('span');
        score.className = 'lb-score';
        // Display human-friendly score (strip composite tiebreak encoding)
        score.textContent = Math.floor(row.score / 100);

        li.appendChild(rank);
        li.appendChild(email);
        li.appendChild(score);
        listEl.appendChild(li);
      });
    }

    /**
     * Partially mask an email for leaderboard display.
     * "alice@example.com" → "ali***@example.com"
     */
    function maskEmail(email) {
      if (!email || !email.includes('@')) return email;
      const [local, domain] = email.split('@');
      const visible = local.length > 3 ? local.slice(0, 3) : local.slice(0, 1);
      return `${visible}***@${domain}`;
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    /**
     * Tear down the current overlay, reset all state, and restart the animation loop.
     * Called by the 'Play Again' button click and the Space keyboard shortcut.
     */
    function startNewGame() {
      removeGameOverOverlay();
      resetGame();
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The RAF loop is paused when gameover; nothing to update.
      if (game.phase === 'gameover') return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — lerp toward ball centre; lerp speed increases
      // slightly each rally hit (difficulty escalation).
      const ballCentreY   = ball.y + BALL_SIZE / 2;
      const aiCentreY     = aiPaddle.y + PADDLE_H / 2;
      const aiDiff        = ballCentreY - aiCentreY;
      const effectiveLerp = AI_LERP + rally.rallyCount * AI_LERP_RALLY_INC;
      const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (ball.y <= 0) {
        ball.y     = 0;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y     = CANVAS_H - BALL_SIZE;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      }

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        ball.vx < 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        ball.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (ball.y + BALL_SIZE / 2) - (playerPaddle.y + PADDLE_H / 2);
        ball.angle  = deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        ball.vx > 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        ball.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (ball.y + BALL_SIZE / 2) - (aiPaddle.y + PADDLE_H / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        ball.angle  = Math.PI - deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        playerPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to black
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = '#fff';
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // When game.phase becomes 'gameover' the loop stops scheduling itself and
    // shows the HTML overlay instead.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      if (game.phase === 'gameover') {
        // Pause the loop and present the DOM overlay
        rafId = null;
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        // showGameOverOverlay is async (saves score + fetches leaderboard)
        showGameOverOverlay(winnerLabel, playerPaddle.score, aiPaddle.score);
        return; // do NOT schedule next frame
      }

      rafId = requestAnimationFrame(loop);
    }

    // Kick off the animation loop
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
