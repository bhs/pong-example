<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
      /* Soft rounded edge + drop shadow to lift the canvas off the page */
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* ── Control hints caption ─────────────────────────────────────────────── */
    /*
     * Static semantic caption rendered below the canvas, entirely separate
     * from canvas draw calls. Present at all times regardless of game phase
     * (playing / scored / gameover) — pure DOM/CSS chrome, no JS involved.
     */
    #pong-control-hints {
      font-size: 0.85rem;
      color: #888;
      text-align: center;
      margin-top: 8px;
      font-family: monospace;
    }
    /*
     * Copy audit (text-accuracy-audit): checked against the actual bindings —
     * keydown/keyup handlers key off e.code 'KeyW'/'KeyS' and
     * 'ArrowUp'/'ArrowDown' for paddle movement, and 'Space' triggers
     * startNewGame() while game.phase === 'gameover'. "W/S or ↑/↓" and
     * "Space to play again" match those exactly — no drift found, no text
     * changed.
     */

    /* ── Best-rally readout ──────────────────────────────────────────────── */
    /*
     * A second caption below the control hints, populated by JS only after
     * game-over and only for signed-in players bucketed into the "Best
     * rally" display (see isBestRallyBucketed in server.js). Empty/hidden
     * the rest of the time.
     */
    #pong-best-rally {
      font-size: 0.85rem;
      color: #ffe066;
      text-align: center;
      margin-top: 4px;
      font-family: monospace;
      min-height: 1.2em;
    }
    #pong-best-rally:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div id="pong-stage">
    <canvas id="gameCanvas"></canvas>
    <p id="pong-control-hints">Move: W/S or ↑/↓ &nbsp;•&nbsp; Space to play again</p>
    <p id="pong-best-rally"></p>
  </div>

  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score

    // ── Customization options (in-canvas MENU / PAUSED overlay) ────────────────
    //
    // Preset tables consumed by the settings menu below. Mirrored in
    // game-logic.js (as PADDLE_COLORS / BALL_SPEED_PRESETS / DIFFICULTY_PRESETS)
    // so the values can be unit tested in isolation; this file keeps its own
    // copy since index.html is a self-contained browser script that does not
    // import game-logic.js.

    const PADDLE_COLORS = ['#ffffff', '#00e5ff', '#ff5252', '#ffd740', '#69f0ae'];

    const BALL_SPEED_PRESETS = [
      { label: 'Slow',   mul: 0.7 },
      { label: 'Normal', mul: 1.0 },
      { label: 'Fast',   mul: 1.4 },
    ];

    const DIFFICULTY_PRESETS = [
      { label: 'Easy',   aiLerp: 3.0,   deflectMul: 0.8  },
      { label: 'Normal', aiLerp: AI_LERP, deflectMul: 1.0  },
      { label: 'Hard',   aiLerp: 6.5,   deflectMul: 1.15 },
    ];

    // Current selections — mutated by clicks on the in-canvas menu. Consumed
    // by resetBall() / the paddle-collision code / the AI movement code /
    // render() so a change takes effect immediately (including mid-rally when
    // opened via the PAUSED gear icon).
    const settings = {
      paddleColorIndex: 0,
      ballSpeedIndex:   1,
      difficultyIndex:  1,
    };

    function effectiveBallSpeedInit() {
      return BALL_SPEED_INIT * BALL_SPEED_PRESETS[settings.ballSpeedIndex].mul;
    }
    function effectiveBallSpeedMax() {
      return BALL_SPEED_MAX * BALL_SPEED_PRESETS[settings.ballSpeedIndex].mul;
    }
    function effectiveAiLerp() {
      return DIFFICULTY_PRESETS[settings.difficultyIndex].aiLerp;
    }
    function effectiveMaxDeflectAngle() {
      return MAX_DEFLECT_ANGLE * DIFFICULTY_PRESETS[settings.difficultyIndex].deflectMul;
    }

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject pulsing button animation style ─────────────────────────────────
    //
    // A <style> tag is injected once into <head> so the 'Play Again' button can
    // use a CSS keyframe animation without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }
        #pong-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.72);
          backdrop-filter: blur(2px);
          gap: 18px;
          font-family: monospace;
        }
        #pong-overlay h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: clamp(1rem, 3vw, 1.5rem);
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-play-again {
          margin-top: 8px;
          padding: 14px 40px;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Auth bar (Google OAuth) ─────────────────────────────────────── */
        #pong-auth-bar {
          position: fixed;
          top: 14px;
          right: 16px;
          z-index: 20;
          display: flex;
          align-items: center;
          gap: 10px;
          font-family: monospace;
        }
        .pong-auth-btn {
          padding: 8px 16px;
          font-family: monospace;
          font-size: 0.8rem;
          font-weight: bold;
          letter-spacing: 0.05em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s, opacity 0.15s;
        }
        .pong-auth-btn:hover,
        .pong-auth-btn:focus {
          background: #ffe066;
          outline: none;
        }
        .pong-auth-btn:disabled {
          opacity: 0.6;
          cursor: default;
        }
        .pong-auth-btn-ghost {
          background: transparent;
          color: rgba(255,255,255,0.7);
          border: 1px solid rgba(255,255,255,0.35);
        }
        .pong-auth-btn-ghost:hover,
        .pong-auth-btn-ghost:focus {
          background: rgba(255,255,255,0.1);
          color: #fff;
        }
        #pong-user-avatar {
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 1px solid rgba(255,255,255,0.4);
        }
        #pong-user-label {
          color: rgba(255,255,255,0.85);
          font-size: 0.8rem;
          letter-spacing: 0.03em;
          max-width: 160px;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }

        /* ── Recent Games panel ──────────────────────────────────────────── */
        #pong-recent-games {
          position: fixed;
          top: 58px;
          right: 16px;
          z-index: 20;
          width: 220px;
          padding: 12px 14px;
          background: rgba(0, 0, 0, 0.55);
          border: 1px solid rgba(255,255,255,0.15);
          border-radius: 6px;
          font-family: monospace;
          color: rgba(255,255,255,0.85);
        }
        #pong-recent-games h2 {
          font-size: 0.75rem;
          text-transform: uppercase;
          letter-spacing: 0.08em;
          color: rgba(255,255,255,0.5);
          margin-bottom: 8px;
        }
        #pong-recent-games ul {
          list-style: none;
          display: flex;
          flex-direction: column;
          gap: 4px;
          max-height: 200px;
          overflow-y: auto;
        }
        #pong-recent-games li {
          display: flex;
          justify-content: space-between;
          font-size: 0.8rem;
        }
        #pong-recent-games .empty {
          font-size: 0.75rem;
          color: rgba(255,255,255,0.4);
        }
      `;
      document.head.appendChild(style);
    })();

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.
    //
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // gameState can be: 'playing' | 'scored' | 'gameover'
    // (replaces the original 'won' phase; the overlay handles that display layer)
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    // Rally state — tracks consecutive paddle hits for difficulty escalation
    // and the short score-flash effect.
    //
    // maxRally tracks the highest rallyCount reached at any point during the
    // *current game* — unlike rallyCount it is never reset by a miss, only
    // by resetGame(). It's the "longest rally" value sent to POST
    // /api/scores and shown in the best-rally readout after game-over.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      maxRally:    0,   // peak rallyCount this game; resets each new game
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    // ── In-canvas menu / state machine ─────────────────────────────────────────
    //
    // uiState drives a small top-level state machine layered over the existing
    // 'game.phase' state (playing / scored / gameover):
    //   'MENU'    — start screen; the settings menu is drawn over the (static)
    //               canvas and the simulation is frozen.
    //   'PLAYING' — normal gameplay; update() runs each frame. A small gear
    //               icon is drawn top-right which transitions to 'PAUSED'.
    //   'PAUSED'  — gameplay is frozen mid-match; the same settings menu is
    //               drawn on top of the frozen frame with a 'Resume' button.
    //
    // Everything here is rendered via canvas draw calls only — no extra DOM
    // elements are introduced, consistent with the rest of this file.
    let uiState = 'MENU';

    // Mouse position in canvas coordinates (for hover highlighting) and the
    // hit-boxes computed by computeMenuLayout() each render (cheap: a handful
    // of rects) so click handling can reuse the exact same geometry as drawing.
    const mouse = { x: -1, y: -1 };
    let menuLayout = null;
    let gearRect   = null;

    // Total elapsed play time (seconds) for the current game — accumulated
    // in update() while game.phase === 'playing', reset by resetGame().
    // Sent alongside the score when the player clicks 'Save Score' so
    // GameHistory rows carry a real duration.
    let gameElapsedSeconds = 0;

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // Signed-in user (from GET /me) and whether they're in the ~50% bucket
    // shown the "Best rally" readout after game-over (see
    // isBestRallyBucketed in server.js). Both null/false until /me resolves.
    let currentUser      = null;
    let bestRallyBucket  = false;

    // ── Experiment telemetry (client-side event pings) ───────────────────────
    //
    // Fire-and-forget pings to the server so it can count a handful of
    // browser-only events (game_over_shown, play_again_click, page_reload)
    // through its OpenTelemetry instrumentation. Never affects gameplay: any
    // failure here (network, storage, etc.) is silently swallowed.

    const MENDEL_GAME_OVER_FLAG = 'mendelGameOverShown';

    function sendMendelEvent(eventName) {
      try {
        const payload = JSON.stringify({ event: eventName });
        if (navigator.sendBeacon) {
          navigator.sendBeacon('/api/client-events', new Blob([payload], { type: 'application/json' }));
        } else {
          fetch('/api/client-events', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true,
            credentials: 'same-origin',
          }).catch(() => {});
        }
      } catch (err) {
        // Telemetry must never break gameplay.
      }
    }

    // A full browser page reload while the game-over overlay was showing
    // leaves this sessionStorage flag set — it's only cleared by the in-page
    // 'Play Again' restart — so finding it set here means the page just
    // reloaded instead of restarting without a navigation.
    try {
      if (sessionStorage.getItem(MENDEL_GAME_OVER_FLAG) === '1') {
        sessionStorage.removeItem(MENDEL_GAME_OVER_FLAG);
        sendMendelEvent('page_reload');
      }
    } catch (err) {
      // sessionStorage may be unavailable (e.g. private browsing) — ignore.
    }

    // One 'visit' per page load — backs the games-started-per-visit metric
    // (games_started / visit) alongside 'game_started' below.
    sendMendelEvent('visit');

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      // Space triggers restart when overlay is visible (accessibility shortcut)
      if (e.code === 'Space' && game.phase === 'gameover') {
        startNewGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Mouse input (in-canvas menu hit-testing) ────────────────────────────
    //
    // The menu/gear icon are plain canvas draw calls, so 'clicking' them is
    // implemented as simple rectangle hit-testing against mouse coordinates
    // translated into canvas space (accounting for any CSS scaling of the
    // <canvas> element).

    function toCanvasCoords(evt) {
      const rect   = canvas.getBoundingClientRect();
      const scaleX = CANVAS_W / rect.width;
      const scaleY = CANVAS_H / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY,
      };
    }

    function pointInRect(px, py, r) {
      return !!r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    }

    canvas.addEventListener('mousemove', (evt) => {
      const p = toCanvasCoords(evt);
      mouse.x = p.x;
      mouse.y = p.y;

      // Cursor feedback: pointer over anything clickable.
      let overClickable = false;
      if (uiState === 'MENU' || uiState === 'PAUSED') {
        overClickable = hitTestMenu(mouse.x, mouse.y) !== null;
      } else if (uiState === 'PLAYING') {
        overClickable = pointInRect(mouse.x, mouse.y, gearRect);
      }
      canvas.style.cursor = overClickable ? 'pointer' : 'default';
    });

    canvas.addEventListener('mouseleave', () => {
      mouse.x = -1;
      mouse.y = -1;
      canvas.style.cursor = 'default';
    });

    canvas.addEventListener('click', (evt) => {
      const p = toCanvasCoords(evt);

      if (uiState === 'MENU' || uiState === 'PAUSED') {
        const hit = hitTestMenu(p.x, p.y);
        if (hit) handleMenuAction(hit);
        return;
      }

      if (uiState === 'PLAYING' && pointInRect(p.x, p.y, gearRect)) {
        uiState = 'PAUSED';
      }
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * Returns a value in [-effectiveMaxDeflectAngle(), +effectiveMaxDeflectAngle()],
     * scaled by the Difficulty setting (steeper max angle = harder to return).
     */
    function deflectAngle(relY) {
      const norm = clamp(relY / (PADDLE_H / 2), -1, 1);
      return norm * effectiveMaxDeflectAngle();
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     * Resets the rally counter. Initial speed honours the Ball Speed preset.
     */
    function resetBall(dirSign) {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = effectiveBallSpeedInit();
      rally.rallyCount = 0;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      ball.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(ball);
    }


    /**
     * Reset both paddles and scores; start fresh.
     */
    function resetGame() {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
      rally.rallyCount  = 0;
      rally.maxRally    = 0;
      rally.flashFrames = 0;
      gameElapsedSeconds = 0;
    }

    // ── In-canvas menu: layout, hit-testing, actions, rendering ────────────────
    //
    // The whole settings menu is a handful of rectangles computed fresh each
    // call (cheap) so that drawing and hit-testing always agree on geometry.
    // Selecting an option mutates `settings` directly, which paddle-ball
    // physics (resetBall / paddle collisions / AI movement) and render()
    // read every frame — no extra plumbing needed.

    /**
     * Compute (and cache on menuLayout) the rectangles for every clickable
     * element in the MENU / PAUSED overlay.
     */
    function computeMenuLayout() {
      const panelX = 100, panelW = 600;
      const swatchSize = 40, swatchGap = 20;
      const swatchesW = PADDLE_COLORS.length * swatchSize + (PADDLE_COLORS.length - 1) * swatchGap;
      const swatchStartX = panelX + (panelW - swatchesW) / 2;

      const paddleSwatches = PADDLE_COLORS.map((color, i) => ({
        x: swatchStartX + i * (swatchSize + swatchGap),
        y: 190,
        w: swatchSize,
        h: swatchSize,
        color,
        index: i,
        kind: 'paddleColor',
      }));

      const btnW = 150, btnH = 42, btnGap = 20;
      function buttonRow(items, y, kind) {
        const rowW = items.length * btnW + (items.length - 1) * btnGap;
        const startX = panelX + (panelW - rowW) / 2;
        return items.map((item, i) => ({
          x: startX + i * (btnW + btnGap),
          y,
          w: btnW,
          h: btnH,
          label: item.label,
          index: i,
          kind,
        }));
      }

      const speedButtons      = buttonRow(BALL_SPEED_PRESETS, 275, 'ballSpeed');
      const difficultyButtons = buttonRow(DIFFICULTY_PRESETS, 355, 'difficulty');

      const primaryW = 240, primaryH = 54;
      const primaryButton = {
        x: panelX + (panelW - primaryW) / 2,
        y: 430,
        w: primaryW,
        h: primaryH,
        kind: 'primary',
      };

      // 'Main Menu' (full reset) is only meaningful while PAUSED mid-match.
      const secondaryW = 200, secondaryH = 34;
      const secondaryButton = {
        x: panelX + (panelW - secondaryW) / 2,
        y: 430 + primaryH + 16,
        w: secondaryW,
        h: secondaryH,
        kind: 'secondary',
      };

      return { paddleSwatches, speedButtons, difficultyButtons, primaryButton, secondaryButton };
    }

    /**
     * Return the hit descriptor for whatever menu element is under (px, py),
     * or null. Uses the layout most recently drawn by renderMenuOverlay().
     */
    function hitTestMenu(px, py) {
      if (!menuLayout) return null;
      const { paddleSwatches, speedButtons, difficultyButtons, primaryButton, secondaryButton } = menuLayout;

      for (const r of paddleSwatches) if (pointInRect(px, py, r)) return r;
      for (const r of speedButtons)   if (pointInRect(px, py, r)) return r;
      for (const r of difficultyButtons) if (pointInRect(px, py, r)) return r;
      if (pointInRect(px, py, primaryButton)) return primaryButton;
      if (uiState === 'PAUSED' && pointInRect(px, py, secondaryButton)) return secondaryButton;
      return null;
    }

    /**
     * Apply the effect of clicking a menu hit-descriptor: update settings,
     * or transition uiState (Start / Resume / Main Menu).
     */
    function handleMenuAction(hit) {
      if (hit.kind === 'paddleColor') {
        settings.paddleColorIndex = hit.index;
        reportMendelEvent('customization_changed');
      } else if (hit.kind === 'ballSpeed') {
        settings.ballSpeedIndex = hit.index;
        reportMendelEvent('customization_changed');
      } else if (hit.kind === 'difficulty') {
        settings.difficultyIndex = hit.index;
        reportMendelEvent('customization_changed');
      } else if (hit.kind === 'primary') {
        if (uiState === 'PAUSED') {
          uiState = 'PLAYING';
        } else {
          startNewGame();
          uiState = 'PLAYING';
        }
      } else if (hit.kind === 'secondary') {
        // 'Main Menu' — abandon the current match and return to MENU.
        removeGameOverOverlay();
        resetGame();
        uiState = 'MENU';
      }
    }

    /**
     * Draw a single rectangular button, highlighting it when selected/hovered.
     */
    function drawMenuButton(r, label, selected) {
      const hovered = pointInRect(mouse.x, mouse.y, r);
      ctx.fillStyle = selected ? '#ffe066' : (hovered ? '#444' : '#222');
      ctx.fillRect(r.x, r.y, r.w, r.h);
      ctx.strokeStyle = selected ? '#ffe066' : 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 2;
      ctx.strokeRect(r.x, r.y, r.w, r.h);
      ctx.fillStyle = selected ? '#000' : '#fff';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
    }

    /**
     * Draw the full MENU / PAUSED settings overlay on top of whatever is
     * already on the canvas (a static start screen, or a frozen game frame).
     */
    function renderMenuOverlay() {
      menuLayout = computeMenuLayout();
      const { paddleSwatches, speedButtons, difficultyButtons, primaryButton, secondaryButton } = menuLayout;

      // Dim the frame behind the menu so it reads clearly on top of gameplay.
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.font = 'bold 40px monospace';
      ctx.fillText('PONG', CANVAS_W / 2, 110);

      ctx.font = '16px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('Paddle Color', CANVAS_W / 2, 175);

      for (const r of paddleSwatches) {
        const selected = r.index === settings.paddleColorIndex;
        const hovered  = pointInRect(mouse.x, mouse.y, r);
        ctx.fillStyle = r.color;
        ctx.fillRect(r.x, r.y, r.w, r.h);
        ctx.strokeStyle = selected ? '#ffe066' : (hovered ? '#fff' : 'rgba(255,255,255,0.4)');
        ctx.lineWidth = selected ? 4 : 2;
        ctx.strokeRect(r.x, r.y, r.w, r.h);
      }

      ctx.font = '16px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('Ball Speed', CANVAS_W / 2, 260);
      for (const r of speedButtons) {
        drawMenuButton(r, BALL_SPEED_PRESETS[r.index].label, r.index === settings.ballSpeedIndex);
      }

      ctx.font = '16px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillText('Difficulty', CANVAS_W / 2, 340);
      for (const r of difficultyButtons) {
        drawMenuButton(r, DIFFICULTY_PRESETS[r.index].label, r.index === settings.difficultyIndex);
      }

      drawMenuButton(primaryButton, uiState === 'PAUSED' ? 'Resume' : 'Start Game', false);

      if (uiState === 'PAUSED') {
        ctx.font = '14px monospace';
        ctx.fillStyle = pointInRect(mouse.x, mouse.y, secondaryButton) ? '#fff' : 'rgba(255,255,255,0.55)';
        ctx.fillText('Main Menu', secondaryButton.x + secondaryButton.w / 2, secondaryButton.y + secondaryButton.h / 2 + 5);
      }
    }

    /**
     * Draw the small clickable gear icon shown top-right during PLAYING;
     * clicking it transitions uiState to 'PAUSED' (see the click listener).
     */
    function drawGearIcon() {
      gearRect = { x: CANVAS_W - 46, y: 12, w: 30, h: 30 };
      const hovered = pointInRect(mouse.x, mouse.y, gearRect);
      ctx.fillStyle = hovered ? '#fff' : 'rgba(255,255,255,0.6)';
      ctx.font = '22px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚙', gearRect.x + gearRect.w / 2, gearRect.y + gearRect.h / 2 + 2);
    }

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a full-screen semi-transparent div injected
    // into the document via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the full-screen game-over overlay.
     * Attaches a 'Play Again' button that calls startNewGame() on click.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();

      try { sessionStorage.setItem(MENDEL_GAME_OVER_FLAG, '1'); } catch (err) { /* ignore */ }
      sendMendelEvent('game_over_shown');

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      document.body.appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    // ── Best-rally readout ────────────────────────────────────────────────
    //
    // Populates the static #pong-best-rally caption (below the canvas, not
    // part of the full-screen overlay) with this game's longest rally — but
    // only for signed-in players in the ~50% display bucket (see
    // isBestRallyBucketed in server.js / bestRallyBucket above). Everyone
    // else keeps seeing an empty (hidden) caption, exactly as before this
    // feature existed.

    function updateBestRallyDisplay() {
      const el = document.getElementById('pong-best-rally');
      if (!el) return;
      if (currentUser && bestRallyBucket) {
        const hits = rally.maxRally === 1 ? 'hit' : 'hits';
        el.textContent = `Best rally this game: ${rally.maxRally} ${hits}`;
      } else {
        el.textContent = '';
      }
    }

    function clearBestRallyDisplay() {
      const el = document.getElementById('pong-best-rally');
      if (el) el.textContent = '';
    }

    // ── Auth bar (Google OAuth) ─────────────────────────────────────────────
    //
    // A small fixed panel in the top-right corner shows either a
    // 'Sign in with Google' button (signed out) or the user's avatar/email
    // plus 'Save Score' and 'Log out' buttons (signed in). Session state is
    // fetched from GET /me on load — the actual login state lives in an
    // HttpOnly cookie set by the server, so the client never touches tokens.

    /**
     * Create (or return the existing) auth bar container element.
     */
    function getAuthBar() {
      let bar = document.getElementById('pong-auth-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'pong-auth-bar';
        document.body.appendChild(bar);
      }
      return bar;
    }

    /**
     * Render the signed-out state: a single 'Sign in with Google' button
     * that navigates to the server-side OAuth redirect endpoint.
     */
    function renderSignedOut(bar) {
      bar.innerHTML = '';

      const btn = document.createElement('button');
      btn.id = 'pong-google-signin';
      btn.className = 'pong-auth-btn';
      btn.textContent = 'Sign in with Google';
      btn.addEventListener('click', () => {
        window.location.href = '/auth/google';
      });
      bar.appendChild(btn);
    }

    /**
     * Render the signed-in state: avatar (if any), display name/email,
     * a 'Save Score' button, and a 'Log out' button.
     *
     * @param {HTMLElement} bar
     * @param {{id:string, email:?string, name:?string, avatar:?string}} user
     */
    function renderSignedIn(bar, user) {
      bar.innerHTML = '';

      if (user.avatar) {
        const img = document.createElement('img');
        img.id = 'pong-user-avatar';
        img.src = user.avatar;
        img.alt = user.name || user.email || 'Signed-in user avatar';
        bar.appendChild(img);
      }

      const label = document.createElement('span');
      label.id = 'pong-user-label';
      label.textContent = user.name || user.email || 'Signed in';
      bar.appendChild(label);

      const saveBtn = document.createElement('button');
      saveBtn.id = 'pong-save-score';
      saveBtn.className = 'pong-auth-btn';
      saveBtn.textContent = 'Save Score';
      saveBtn.addEventListener('click', () => saveScore(saveBtn));
      bar.appendChild(saveBtn);

      const logoutBtn = document.createElement('button');
      logoutBtn.id = 'pong-logout';
      logoutBtn.className = 'pong-auth-btn pong-auth-btn-ghost';
      logoutBtn.textContent = 'Log out';
      logoutBtn.addEventListener('click', () => {
        window.location.href = '/auth/logout';
      });
      bar.appendChild(logoutBtn);
    }

    /**
     * POST the player's current score to the server. No player name is
     * sent — the server resolves identity from the HttpOnly session cookie
     * established during Google OAuth login.
     *
     * @param {HTMLButtonElement} btn
     */
    async function saveScore(btn) {
      const original = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Saving…';

      try {
        const res = await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            score:        playerPaddle.score,
            duration:     Math.round(gameElapsedSeconds),
            longestRally: rally.maxRally,
          }),
        });
        btn.textContent = res.ok ? 'Saved!' : 'Failed';
        if (res.ok) refreshRecentGames();
      } catch (err) {
        btn.textContent = 'Failed';
      } finally {
        setTimeout(() => {
          btn.textContent = original;
          btn.disabled = false;
        }, 1500);
      }
    }

    /**
     * Fetch the current session's user (if any) from GET /me and render
     * the appropriate auth bar state. Called once on page load.
     */
    async function initAuthBar() {
      const bar = getAuthBar();
      try {
        const res  = await fetch('/me', { credentials: 'same-origin' });
        const data = await res.json();
        if (data && data.user) {
          currentUser     = data.user;
          bestRallyBucket = Boolean(data.bestRallyBucket);
          renderSignedIn(bar, data.user);
          refreshRecentGames();
        } else {
          currentUser     = null;
          bestRallyBucket = false;
          renderSignedOut(bar);
          removeRecentGamesPanel();
        }
      } catch (err) {
        currentUser     = null;
        bestRallyBucket = false;
        renderSignedOut(bar);
        removeRecentGamesPanel();
      }
    }

    initAuthBar();

    // ── Live-traffic experiment instrumentation (client side) ────────────────
    //
    // Fire-and-forget beacon to the server's /api/events endpoint so the
    // declared 'customization_changed' / 'game_completed' experiment metrics
    // (see mendel-metrics.js) can be counted. Never blocks or surfaces
    // errors to the player — this is purely observational.

    function reportMendelEvent(type) {
      try {
        fetch('/api/events', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          keepalive: true,
          body: JSON.stringify({ type }),
        }).catch(() => {});
      } catch (err) {
        // ignore — telemetry must never break gameplay
      }
    }

    // ── Recent Games panel ────────────────────────────────────────────────
    //
    // A small fixed panel, shown only while signed in, listing the
    // authenticated player's 10 most recent finished games (score, duration,
    // finished-at) fetched from GET /api/game-history. Refreshed each time a
    // score is successfully saved.

    /**
     * Create (or return the existing) recent-games panel element.
     */
    function getRecentGamesPanel() {
      let panel = document.getElementById('pong-recent-games');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'pong-recent-games';
        document.body.appendChild(panel);
      }
      return panel;
    }

    /**
     * Remove the recent-games panel from the DOM if present (signed-out state).
     */
    function removeRecentGamesPanel() {
      const existing = document.getElementById('pong-recent-games');
      if (existing) existing.remove();
    }

    /**
     * Render the panel from an array of { score, duration, finishedAt } entries.
     */
    function renderRecentGames(games) {
      const panel = getRecentGamesPanel();
      panel.innerHTML = '';

      const heading = document.createElement('h2');
      heading.textContent = 'Recent Games';
      panel.appendChild(heading);

      if (!games || games.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'empty';
        empty.textContent = 'No games played yet';
        panel.appendChild(empty);
        return;
      }

      const list = document.createElement('ul');
      games.forEach((g) => {
        const item = document.createElement('li');
        const when = new Date(g.finishedAt);
        const timeLabel = isNaN(when.getTime()) ? '' : when.toLocaleTimeString();
        item.innerHTML =
          `<span>Score ${g.score}</span><span>${g.duration}s · ${timeLabel}</span>`;
        list.appendChild(item);
      });
      panel.appendChild(list);
    }

    /**
     * Fetch GET /api/game-history and render the panel. Silently does
     * nothing on failure (e.g. session expired) rather than breaking gameplay.
     */
    async function refreshRecentGames() {
      try {
        const res = await fetch('/api/game-history', { credentials: 'same-origin' });
        if (!res.ok) return;
        const data = await res.json();
        renderRecentGames(data.games || []);
      } catch (err) {
        // Non-critical — leave whatever was last rendered (or nothing).
      }
    }

    /**
     * Tear down the current overlay, reset all state, and restart the animation loop.
     * Called by the 'Play Again' button click and the Space keyboard shortcut.
     */
    function startNewGame() {
      if (game.phase === 'gameover') {
        try { sessionStorage.removeItem(MENDEL_GAME_OVER_FLAG); } catch (err) { /* ignore */ }
        sendMendelEvent('play_again_click');
      }
      removeGameOverOverlay();
      clearBestRallyDisplay();
      resetGame();
      sendMendelEvent('game_started');
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The RAF loop is paused when gameover; nothing to update.
      if (game.phase === 'gameover') return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      gameElapsedSeconds += dt;

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — lerp toward ball centre; lerp speed increases
      // slightly each rally hit (difficulty escalation).
      const ballCentreY   = ball.y + BALL_SIZE / 2;
      const aiCentreY     = aiPaddle.y + PADDLE_H / 2;
      const aiDiff        = ballCentreY - aiCentreY;
      const effectiveLerp = effectiveAiLerp() + rally.rallyCount * AI_LERP_RALLY_INC;
      const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (ball.y <= 0) {
        ball.y     = 0;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y     = CANVAS_H - BALL_SIZE;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      }

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        ball.vx < 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        ball.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (ball.y + BALL_SIZE / 2) - (playerPaddle.y + PADDLE_H / 2);
        ball.angle  = deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, effectiveBallSpeedInit(), effectiveBallSpeedMax());
        syncBallVelocity(ball);
        rally.rallyCount += 1;
        if (rally.rallyCount > rally.maxRally) rally.maxRally = rally.rallyCount;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        ball.vx > 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        ball.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (ball.y + BALL_SIZE / 2) - (aiPaddle.y + PADDLE_H / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        ball.angle  = Math.PI - deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, effectiveBallSpeedInit(), effectiveBallSpeedMax());
        syncBallVelocity(ball);
        rally.rallyCount += 1;
        if (rally.rallyCount > rally.maxRally) rally.maxRally = rally.rallyCount;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        playerPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to black
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle — colour follows the Paddle Color menu selection
      ctx.fillStyle = PADDLE_COLORS[settings.paddleColorIndex];
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle — always plain white
      ctx.fillStyle = '#fff';
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // uiState gates whether update() runs at all: it is skipped entirely while
    // 'MENU' or 'PAUSED' so the simulation is genuinely frozen behind the
    // settings overlay (not just visually obscured). render() always runs so
    // the canvas has *something* to show behind the overlay (a static start
    // screen the first time, or the frozen mid-match frame after pausing).
    //
    // When game.phase becomes 'gameover' the loop stops scheduling itself and
    // shows the HTML overlay instead.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      if (uiState === 'PLAYING') {
        update(dt);
      }
      render();

      if (uiState === 'MENU' || uiState === 'PAUSED') {
        renderMenuOverlay();
      } else {
        drawGearIcon();
      }

      if (game.phase === 'gameover') {
        // Pause the loop and present the DOM overlay
        rafId = null;
        reportMendelEvent('game_completed');
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        updateBestRallyDisplay();
        showGameOverOverlay(winnerLabel, playerPaddle.score, aiPaddle.score);
        return; // do NOT schedule next frame
      }

      rafId = requestAnimationFrame(loop);
    }

    // Kick off the animation loop (starts on the in-canvas MENU screen)
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
