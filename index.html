<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    /* ── Reset & Layout ─────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
    }

    canvas {
      display: block;
      background: #000;
      /* Crisp pixel rendering for retro look */
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Auth module: register / login / logout / saveScore / getLeaderboard -->
  <script src="auth.js"></script>

  <script>
    'use strict';

    // ── Constants ──────────────────────────────────────────────────────────────
    const CANVAS_W          = 800;
    const CANVAS_H          = 600;
    const PADDLE_W          = 12;
    const PADDLE_H          = 80;
    const BALL_SIZE         = 12;
    const PADDLE_SPEED      = 350;   // px / second
    const BALL_SPEED_INIT   = 300;   // px / second (magnitude)
    const BALL_SPEED_MAX    = 700;   // px / second
    const BALL_SPEED_MUL    = 1.05;  // speed multiplier on each paddle hit
    const AI_LERP           = 4.5;   // AI lerp factor (higher = faster)
    const AI_LERP_RALLY_INC = 0.15;  // AI lerp increase per rally hit
    const MAX_DEFLECT_ANGLE = Math.PI * 75 / 180; // 75° max deflection
    const SCORE_WIN         = 7;     // first to this wins
    const DIVIDER_DASH      = 20;    // centre-line dash length
    const DIVIDER_GAP       = 10;    // centre-line gap length
    const FLASH_FRAMES      = 3;     // frames of tinted flash on score

    // ── Canvas setup ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('gameCanvas');
    const ctx    = canvas.getContext('2d');
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;

    // ── Inject pulsing button animation style ─────────────────────────────────
    //
    // A <style> tag is injected once into <head> so the 'Play Again' button can
    // use a CSS keyframe animation without inline JS timers.

    (function injectOverlayStyles() {
      const style = document.createElement('style');
      style.id = 'pong-overlay-styles';
      style.textContent = `
        @keyframes pongPulse {
          0%   { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
          50%  { transform: scale(1.06); box-shadow: 0 0 18px 6px rgba(255,255,255,0.2); }
          100% { transform: scale(1);    box-shadow: 0 0 0   0   rgba(255,255,255,0.4); }
        }
        #pong-overlay {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.72);
          backdrop-filter: blur(2px);
          gap: 18px;
          font-family: monospace;
        }
        #pong-overlay h1 {
          font-size: clamp(2rem, 6vw, 3.5rem);
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 24px rgba(255,255,255,0.5);
          text-align: center;
        }
        #pong-overlay .final-score {
          font-size: clamp(1rem, 3vw, 1.5rem);
          color: rgba(255,255,255,0.75);
          letter-spacing: 0.08em;
        }
        #pong-overlay .hint {
          font-size: 0.85rem;
          color: rgba(255,255,255,0.4);
          letter-spacing: 0.05em;
          margin-top: 4px;
        }
        #pong-play-again {
          margin-top: 8px;
          padding: 14px 40px;
          font-family: monospace;
          font-size: 1.1rem;
          font-weight: bold;
          letter-spacing: 0.1em;
          color: #000;
          background: #fff;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          animation: pongPulse 1.6s ease-in-out infinite;
          transition: background 0.15s, color 0.15s;
        }
        #pong-play-again:hover,
        #pong-play-again:focus {
          background: #ffe066;
          outline: none;
        }

        /* ── Auth overlay ─────────────────────────────────────────────────── */
        #pong-auth-overlay {
          position: fixed;
          inset: 0;
          z-index: 20;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: rgba(0, 0, 0, 0.88);
          backdrop-filter: blur(3px);
          gap: 14px;
          font-family: monospace;
        }
        #pong-auth-overlay h2 {
          font-size: 1.6rem;
          color: #fff;
          letter-spacing: 0.06em;
          text-shadow: 0 0 18px rgba(255,255,255,0.4);
        }
        #pong-auth-overlay input {
          width: 260px;
          padding: 10px 14px;
          font-family: monospace;
          font-size: 1rem;
          background: #1a1a1a;
          color: #fff;
          border: 1px solid #444;
          border-radius: 4px;
          outline: none;
          transition: border-color 0.15s;
        }
        #pong-auth-overlay input:focus {
          border-color: #fff;
        }
        .pong-auth-btns {
          display: flex;
          gap: 12px;
          margin-top: 4px;
        }
        .pong-auth-btns button {
          padding: 10px 26px;
          font-family: monospace;
          font-size: 0.95rem;
          font-weight: bold;
          letter-spacing: 0.08em;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: background 0.15s, color 0.15s;
        }
        #pong-btn-signin {
          background: #fff;
          color: #000;
        }
        #pong-btn-signin:hover,
        #pong-btn-signin:focus { background: #ffe066; outline: none; }
        #pong-btn-signup {
          background: transparent;
          color: #fff;
          border: 1px solid #555 !important;
        }
        #pong-btn-signup:hover,
        #pong-btn-signup:focus { border-color: #fff !important; outline: none; }
        #pong-auth-error {
          font-size: 0.85rem;
          color: #ff6b6b;
          min-height: 1.2em;
          text-align: center;
          max-width: 280px;
        }
        #pong-auth-skip {
          font-size: 0.8rem;
          color: rgba(255,255,255,0.35);
          background: none;
          border: none;
          cursor: pointer;
          font-family: monospace;
          letter-spacing: 0.04em;
          text-decoration: underline;
          margin-top: 2px;
        }
        #pong-auth-skip:hover { color: rgba(255,255,255,0.6); }

        /* ── Leaderboard section inside game-over overlay ───────────────── */
        #pong-leaderboard {
          width: 280px;
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.12);
          border-radius: 6px;
          padding: 12px 16px;
          font-size: 0.82rem;
          color: rgba(255,255,255,0.8);
        }
        #pong-leaderboard h3 {
          font-size: 0.9rem;
          color: #ffe066;
          letter-spacing: 0.08em;
          margin-bottom: 8px;
          text-align: center;
        }
        .pong-lb-row {
          display: flex;
          justify-content: space-between;
          padding: 3px 0;
          border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .pong-lb-row:last-child { border-bottom: none; }
        .pong-lb-rank { color: rgba(255,255,255,0.4); min-width: 22px; }
        .pong-lb-email {
          flex: 1;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
          padding: 0 6px;
        }
        .pong-lb-score { color: #ffe066; font-weight: bold; }
        .pong-lb-empty { text-align: center; color: rgba(255,255,255,0.3); font-style: italic; }

        /* ── Auth status bar ────────────────────────────────────────────── */
        #pong-status-bar {
          position: fixed;
          top: 10px;
          right: 14px;
          z-index: 5;
          font-family: monospace;
          font-size: 0.75rem;
          color: rgba(255,255,255,0.45);
          display: flex;
          align-items: center;
          gap: 8px;
          pointer-events: none;
        }
        #pong-status-bar button {
          pointer-events: auto;
          background: none;
          border: 1px solid rgba(255,255,255,0.2);
          border-radius: 3px;
          color: rgba(255,255,255,0.45);
          font-family: monospace;
          font-size: 0.72rem;
          padding: 2px 7px;
          cursor: pointer;
          transition: border-color 0.15s, color 0.15s;
        }
        #pong-status-bar button:hover { border-color: #fff; color: #fff; }

        /* ── New best score badge ────────────────────────────────────────── */
        #pong-new-best {
          font-size: 0.85rem;
          color: #ffe066;
          letter-spacing: 0.06em;
          animation: pongPulse 1.6s ease-in-out 2;
        }
      `;
      document.head.appendChild(style);
    })();

    // ── State ─────────────────────────────────────────────────────────────────
    //
    // All mutable game state lives in plain objects at module scope.
    // Ball velocity is stored as a speed scalar + angle in radians so that
    // deflection and reflection logic operates directly on the angle.
    // vx / vy are kept in sync via syncBallVelocity() for collision maths.
    //
    // resetBall() re-initialises the ball each point; resetGame() resets scores.

    const ball = {
      x:     CANVAS_W / 2 - BALL_SIZE / 2,
      y:     CANVAS_H / 2 - BALL_SIZE / 2,
      speed: 0,
      angle: 0,
      vx:    0,
      vy:    0,
      w:     BALL_SIZE,
      h:     BALL_SIZE,
    };

    // Left paddle — controlled by the player (W / S or Arrow-Up / Arrow-Down)
    const playerPaddle = {
      x: 30,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // Right paddle — controlled by the AI
    const aiPaddle = {
      x: CANVAS_W - 30 - PADDLE_W,
      y: CANVAS_H / 2 - PADDLE_H / 2,
      w: PADDLE_W,
      h: PADDLE_H,
      score: 0,
    };

    // gameState can be: 'playing' | 'scored' | 'gameover'
    // (replaces the original 'won' phase; the overlay handles that display layer)
    const game = {
      phase:      'scored',   // start in 'scored' so the ball resets at t=0
      winner:     null,       // 'player' | 'ai' | null
      pauseTimer: 1.2,        // seconds to wait before serving next ball
    };

    // Rally state — tracks consecutive paddle hits for difficulty escalation
    // and the short score-flash effect.
    const rally = {
      rallyCount:  0,   // hits since last score; resets each point
      flashFrames: 0,   // counts down from FLASH_FRAMES to 0 after scoring
    };

    // requestAnimationFrame handle — kept so the loop can be paused on gameover.
    let rafId = null;

    // ── Input ─────────────────────────────────────────────────────────────────
    //
    // Boolean map of currently-held keys.  Checked each frame in update().

    const keys = {};

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      // Prevent page scrolling for arrow keys
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
        e.preventDefault();
      }
      // Space triggers restart when overlay is visible (accessibility shortcut)
      if (e.code === 'Space' && game.phase === 'gameover') {
        startNewGame();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // ── Helpers ───────────────────────────────────────────────────────────────

    /**
     * Returns a random float in [min, max).
     */
    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    /**
     * Clamp value v between lo and hi (inclusive).
     */
    function clamp(v, lo, hi) {
      return Math.max(lo, Math.min(hi, v));
    }

    /**
     * Axis-aligned bounding-box overlap test.
     */
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx &&
             ay < by + bh && ay + ah > by;
    }

    /**
     * Synchronise ball.vx / ball.vy from ball.speed and ball.angle.
     * Call after any mutation of speed or angle.
     */
    function syncBallVelocity(b) {
      b.vx = b.speed * Math.cos(b.angle);
      b.vy = b.speed * Math.sin(b.angle);
    }

    /**
     * Compute the deflection angle from the ball's relative hit position on a
     * paddle face.  relY is positive when the ball hit below paddle centre.
     * Returns a value in [-MAX_DEFLECT_ANGLE, +MAX_DEFLECT_ANGLE].
     */
    function deflectAngle(relY) {
      const norm = clamp(relY / (PADDLE_H / 2), -1, 1);
      return norm * MAX_DEFLECT_ANGLE;
    }

    /**
     * Reset the ball to the centre and launch it in a random direction,
     * away from whichever side just scored (dirSign: +1 = toward AI, -1 = toward player).
     * Resets the rally counter.
     */
    function resetBall(dirSign) {
      ball.x     = CANVAS_W / 2 - BALL_SIZE / 2;
      ball.y     = CANVAS_H / 2 - BALL_SIZE / 2;
      ball.speed = BALL_SPEED_INIT;
      rally.rallyCount = 0;

      const baseAngle  = rand(-Math.PI / 4, Math.PI / 4);
      // dirSign >= 0 → launch right; < 0 → launch left (mirror across y-axis)
      ball.angle = dirSign >= 0 ? baseAngle : Math.PI - baseAngle;
      syncBallVelocity(ball);
    }

    /**
     * Reset both paddles and scores; start fresh.
     */
    function resetGame() {
      playerPaddle.y = CANVAS_H / 2 - PADDLE_H / 2;
      aiPaddle.y     = CANVAS_H / 2 - PADDLE_H / 2;
      playerPaddle.score = 0;
      aiPaddle.score     = 0;
      game.winner     = null;
      game.phase      = 'scored';
      game.pauseTimer = 1.5;
      rally.rallyCount  = 0;
      rally.flashFrames = 0;
    }

    // ── Auth status bar ───────────────────────────────────────────────────────
    //
    // A lightweight fixed-position bar at the top-right showing the logged-in
    // email and a Logout button, or a Sign In link when no session exists.

    /**
     * Render (or refresh) the persistent auth status bar in the top-right corner.
     */
    function refreshStatusBar() {
      let bar = document.getElementById('pong-status-bar');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'pong-status-bar';
        document.body.appendChild(bar);
      }
      bar.innerHTML = '';

      // PongAuth is exposed by auth.js; guard in case the script failed to load.
      const auth = window.PongAuth;
      if (!auth) return;

      const user = auth.getCurrentUser();
      if (user) {
        const label = document.createElement('span');
        label.textContent = user.email;
        bar.appendChild(label);

        const logoutBtn = document.createElement('button');
        logoutBtn.textContent = 'Logout';
        logoutBtn.addEventListener('click', () => {
          auth.logout();
          refreshStatusBar();
        });
        bar.appendChild(logoutBtn);
      } else {
        const signInBtn = document.createElement('button');
        signInBtn.textContent = 'Sign In';
        signInBtn.addEventListener('click', showAuthOverlay);
        bar.appendChild(signInBtn);
      }
    }

    // ── Auth overlay ──────────────────────────────────────────────────────────
    //
    // Full-screen modal for Sign In / Sign Up.  Follows the same DOM-overlay
    // pattern as the game-over overlay.

    /**
     * Build and show the auth overlay.
     *
     * @param {Function} [onSuccess] - Optional callback called with the user object
     *                                 when auth completes successfully.
     */
    function showAuthOverlay(onSuccess) {
      removeAuthOverlay();

      const overlay = document.createElement('div');
      overlay.id = 'pong-auth-overlay';

      const h2 = document.createElement('h2');
      h2.textContent = 'PONG  ·  Sign In';
      overlay.appendChild(h2);

      const emailInput = document.createElement('input');
      emailInput.type        = 'email';
      emailInput.placeholder = 'Email address';
      emailInput.autocomplete = 'email';
      overlay.appendChild(emailInput);

      const passInput = document.createElement('input');
      passInput.type        = 'password';
      passInput.placeholder = 'Password';
      passInput.autocomplete = 'current-password';
      overlay.appendChild(passInput);

      const errorEl = document.createElement('p');
      errorEl.id = 'pong-auth-error';
      overlay.appendChild(errorEl);

      const btns = document.createElement('div');
      btns.className = 'pong-auth-btns';

      const signInBtn = document.createElement('button');
      signInBtn.id          = 'pong-btn-signin';
      signInBtn.textContent = 'Sign In';

      const signUpBtn = document.createElement('button');
      signUpBtn.id          = 'pong-btn-signup';
      signUpBtn.textContent = 'Sign Up';

      btns.appendChild(signInBtn);
      btns.appendChild(signUpBtn);
      overlay.appendChild(btns);

      const skipBtn = document.createElement('button');
      skipBtn.id          = 'pong-auth-skip';
      skipBtn.textContent = 'Play without signing in';
      overlay.appendChild(skipBtn);

      document.body.appendChild(overlay);
      emailInput.focus();

      // ── Shared submit handler ───────────────────────────────────────────
      async function handleAuth(action) {
        const email    = emailInput.value;
        const password = passInput.value;
        errorEl.textContent = '';
        signInBtn.disabled  = true;
        signUpBtn.disabled  = true;
        try {
          const auth = window.PongAuth;
          let user;
          if (action === 'login') {
            user = await auth.login(email, password);
          } else {
            user = await auth.register(email, password);
          }
          removeAuthOverlay();
          refreshStatusBar();
          if (typeof onSuccess === 'function') onSuccess(user);
        } catch (err) {
          errorEl.textContent = err.message;
        } finally {
          signInBtn.disabled = false;
          signUpBtn.disabled = false;
        }
      }

      signInBtn.addEventListener('click', () => handleAuth('login'));
      signUpBtn.addEventListener('click', () => handleAuth('register'));
      skipBtn.addEventListener('click',  removeAuthOverlay);

      // Allow Enter key to submit
      function onKey(e) {
        if (e.key === 'Enter') handleAuth('login');
      }
      emailInput.addEventListener('keydown', onKey);
      passInput.addEventListener('keydown', onKey);
    }

    /**
     * Remove the auth overlay from the DOM if it exists.
     */
    function removeAuthOverlay() {
      const el = document.getElementById('pong-auth-overlay');
      if (el) el.remove();
    }

    // ── Leaderboard helpers ───────────────────────────────────────────────────

    /**
     * Build and return a leaderboard DOM element showing the top 10 scores.
     *
     * @returns {HTMLElement}
     */
    function buildLeaderboardEl() {
      const auth    = window.PongAuth;
      const section = document.createElement('div');
      section.id    = 'pong-leaderboard';

      const h3 = document.createElement('h3');
      h3.textContent = '🏆  Leaderboard';
      section.appendChild(h3);

      if (!auth) {
        const empty = document.createElement('p');
        empty.className = 'pong-lb-empty';
        empty.textContent = 'Auth unavailable';
        section.appendChild(empty);
        return section;
      }

      const entries = auth.getLeaderboard(10);
      if (entries.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'pong-lb-empty';
        empty.textContent = 'No scores yet — be the first!';
        section.appendChild(empty);
        return section;
      }

      entries.forEach((entry, i) => {
        const row = document.createElement('div');
        row.className = 'pong-lb-row';

        const rank = document.createElement('span');
        rank.className   = 'pong-lb-rank';
        rank.textContent = `${i + 1}.`;

        const email = document.createElement('span');
        email.className   = 'pong-lb-email';
        // Show only the username portion of the email for brevity
        email.textContent = entry.email.split('@')[0];
        email.title       = entry.email;

        const score = document.createElement('span');
        score.className   = 'pong-lb-score';
        score.textContent = entry.score;

        row.appendChild(rank);
        row.appendChild(email);
        row.appendChild(score);
        section.appendChild(row);
      });

      return section;
    }

    // ── DOM Overlay ───────────────────────────────────────────────────────────
    //
    // The game-over overlay is a full-screen semi-transparent div injected
    // into the document via JS DOM APIs.  It is removed (not hidden) on restart
    // so a clean element is created each game-over.

    /**
     * Build and show the full-screen game-over overlay.
     * Also saves the player's score (if logged in) and shows the leaderboard.
     *
     * @param {string} winnerLabel - Human-readable winner string (e.g. 'You win! 🎉')
     * @param {number} playerScore - Final player score
     * @param {number} aiScore     - Final AI score
     */
    function showGameOverOverlay(winnerLabel, playerScore, aiScore) {
      // Remove any pre-existing overlay (defensive guard)
      removeGameOverOverlay();

      const overlay = document.createElement('div');
      overlay.id = 'pong-overlay';

      // Winner headline
      const h1 = document.createElement('h1');
      h1.textContent = winnerLabel;
      overlay.appendChild(h1);

      // Final score line
      const scoreEl = document.createElement('p');
      scoreEl.className = 'final-score';
      scoreEl.textContent = `Final score  ${playerScore} – ${aiScore}`;
      overlay.appendChild(scoreEl);

      // Save high score if the player won and is logged in
      const auth = window.PongAuth;
      if (auth && game.winner === 'player') {
        const isNewBest = auth.saveScore(playerScore);
        if (isNewBest) {
          const newBest = document.createElement('p');
          newBest.id          = 'pong-new-best';
          newBest.textContent = '★  New personal best!';
          overlay.appendChild(newBest);
        }
      }

      // Leaderboard
      overlay.appendChild(buildLeaderboardEl());

      // Play Again button
      const btn = document.createElement('button');
      btn.id = 'pong-play-again';
      btn.textContent = 'Play Again';
      btn.addEventListener('click', startNewGame);
      overlay.appendChild(btn);

      // Keyboard hint
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = 'or press Space';
      overlay.appendChild(hint);

      document.body.appendChild(overlay);

      // Focus the button immediately so keyboard users can activate it
      btn.focus();
    }

    /**
     * Remove the game-over overlay from the DOM if it exists.
     */
    function removeGameOverOverlay() {
      const existing = document.getElementById('pong-overlay');
      if (existing) existing.remove();
    }

    /**
     * Tear down the current overlay, reset all state, and restart the animation loop.
     * Called by the 'Play Again' button click and the Space keyboard shortcut.
     */
    function startNewGame() {
      removeGameOverOverlay();
      resetGame();
      // Clear the key map so a held-Space doesn't immediately trigger movement
      Object.keys(keys).forEach((k) => { keys[k] = false; });
      // Cancel any stale RAF handle before starting a new loop
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      lastTime = null;
      rafId = requestAnimationFrame(loop);
    }

    // ── Update ────────────────────────────────────────────────────────────────
    //
    // All simulation is driven by delta-time (dt, in seconds) so the game
    // runs at the same speed regardless of frame rate.

    function update(dt) {
      // ── Phase: gameover ──────────────────────────────────────────────────────
      // The RAF loop is paused when gameover; nothing to update.
      if (game.phase === 'gameover') return;

      // ── Phase: scored (brief pause before next serve) ────────────────────
      if (game.phase === 'scored') {
        // Tick down the flash effect (set when a score just happened)
        if (rally.flashFrames > 0) rally.flashFrames -= 1;

        game.pauseTimer -= dt;
        if (game.pauseTimer <= 0) {
          // Serve toward the player who just conceded (or random on first serve)
          const dir = aiPaddle.score > playerPaddle.score ? -1 : 1;
          resetBall(dir);
          game.phase = 'playing';
        }
        return;
      }

      // ── Phase: playing ───────────────────────────────────────────────────

      // Player paddle movement — boolean key map, clamped to canvas bounds
      if (keys['KeyW'] || keys['ArrowUp']) {
        playerPaddle.y -= PADDLE_SPEED * dt;
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        playerPaddle.y += PADDLE_SPEED * dt;
      }
      playerPaddle.y = clamp(playerPaddle.y, 0, CANVAS_H - PADDLE_H);

      // AI paddle movement — lerp toward ball centre; lerp speed increases
      // slightly each rally hit (difficulty escalation).
      const ballCentreY   = ball.y + BALL_SIZE / 2;
      const aiCentreY     = aiPaddle.y + PADDLE_H / 2;
      const aiDiff        = ballCentreY - aiCentreY;
      const effectiveLerp = AI_LERP + rally.rallyCount * AI_LERP_RALLY_INC;
      const aiMove = clamp(aiDiff * effectiveLerp * dt, -PADDLE_SPEED * dt, PADDLE_SPEED * dt);
      aiPaddle.y = clamp(aiPaddle.y + aiMove, 0, CANVAS_H - PADDLE_H);

      // Move ball
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;

      // ── Ball vs top / bottom walls ────────────────────────────────────────
      // Reflect the angle across the horizontal axis (negate it).
      if (ball.y <= 0) {
        ball.y     = 0;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      } else if (ball.y + BALL_SIZE >= CANVAS_H) {
        ball.y     = CANVAS_H - BALL_SIZE;
        ball.angle = -ball.angle;
        syncBallVelocity(ball);
      }

      // ── Ball vs player paddle ─────────────────────────────────────────────
      if (
        ball.vx < 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h)
      ) {
        ball.x  = playerPaddle.x + playerPaddle.w;
        // Deflection angle: centre hit → shallow; edge hit → steep (up to ±75°).
        // The resulting angle is in the right-travelling hemisphere.
        const relY  = (ball.y + BALL_SIZE / 2) - (playerPaddle.y + PADDLE_H / 2);
        ball.angle  = deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball vs AI paddle ─────────────────────────────────────────────────
      if (
        ball.vx > 0 &&
        aabbOverlap(ball.x, ball.y, ball.w, ball.h,
                    aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h)
      ) {
        ball.x  = aiPaddle.x - BALL_SIZE;
        const relY  = (ball.y + BALL_SIZE / 2) - (aiPaddle.y + PADDLE_H / 2);
        // π - deflectAngle puts the ball in the left-travelling hemisphere.
        ball.angle  = Math.PI - deflectAngle(relY);
        ball.speed  = clamp(ball.speed * BALL_SPEED_MUL, BALL_SPEED_INIT, BALL_SPEED_MAX);
        syncBallVelocity(ball);
        rally.rallyCount += 1;
      }

      // ── Ball exits left → AI scores ───────────────────────────────────────
      if (ball.x + BALL_SIZE < 0) {
        aiPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (aiPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'ai';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }

      // ── Ball exits right → player scores ─────────────────────────────────
      if (ball.x > CANVAS_W) {
        playerPaddle.score += 1;
        rally.flashFrames = FLASH_FRAMES;
        rally.rallyCount  = 0;
        if (playerPaddle.score >= SCORE_WIN) {
          game.phase  = 'gameover';
          game.winner = 'player';
        } else {
          game.phase      = 'scored';
          game.pauseTimer = 1.2;
        }
      }
    }

    // ── Render ────────────────────────────────────────────────────────────────
    //
    // Each frame: clear the canvas then redraw all primitives from scratch.
    // The live score is rendered via fillText each frame (canvas-integrated).
    // When rally.flashFrames > 0 a tinted overlay is drawn to give visual
    // feedback that a point was just scored.

    function render() {
      // Clear to black
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      // Score flash: tinted background for a few frames after scoring
      if (rally.flashFrames > 0) {
        // Fade from solid tint toward transparent as frames count down
        const alpha = rally.flashFrames / FLASH_FRAMES * 0.35;
        ctx.fillStyle = `rgba(255, 220, 0, ${alpha})`;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
      }

      // Centre dashed divider
      ctx.setLineDash([DIVIDER_DASH, DIVIDER_GAP]);
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(CANVAS_W / 2, 0);
      ctx.lineTo(CANVAS_W / 2, CANVAS_H);
      ctx.stroke();
      ctx.setLineDash([]);

      // ── Live scores rendered on canvas each frame ─────────────────────────
      // Scores are drawn with fillText so they integrate seamlessly with gameplay.
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(playerPaddle.score, CANVAS_W / 4, 20);
      ctx.fillText(aiPaddle.score, (CANVAS_W / 4) * 3, 20);

      // Player paddle
      ctx.fillStyle = '#fff';
      ctx.fillRect(playerPaddle.x, playerPaddle.y, playerPaddle.w, playerPaddle.h);

      // AI paddle
      ctx.fillRect(aiPaddle.x, aiPaddle.y, aiPaddle.w, aiPaddle.h);

      // Ball (only when playing)
      if (game.phase === 'playing') {
        ctx.fillRect(ball.x, ball.y, ball.w, ball.h);
      }

      // 'Get ready…' hint during the inter-point pause
      if (game.phase === 'scored') {
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        ctx.font = '22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Get ready…', CANVAS_W / 2, CANVAS_H / 2);
      }

      // When gameover, the canvas shows the final frozen frame so that the
      // semi-transparent HTML overlay renders above a recognisable game state.
    }

    // ── Game loop ─────────────────────────────────────────────────────────────
    //
    // Uses requestAnimationFrame; the timestamp argument is equivalent to
    // performance.now() and is used to compute delta-time (dt, in seconds).
    // Delta-time is capped at 100 ms to avoid large jumps after tab switches.
    //
    // When game.phase becomes 'gameover' the loop stops scheduling itself and
    // shows the HTML overlay instead.

    let lastTime = null;

    function loop(timestamp) {
      if (lastTime === null) {
        lastTime = timestamp;
      }
      const dt = Math.min((timestamp - lastTime) / 1000, 0.1);  // seconds, capped
      lastTime = timestamp;

      update(dt);
      render();

      if (game.phase === 'gameover') {
        // Pause the loop and present the DOM overlay
        rafId = null;
        const winnerLabel = game.winner === 'player' ? 'You win! 🎉' : 'AI wins!';
        showGameOverOverlay(winnerLabel, playerPaddle.score, aiPaddle.score);
        return; // do NOT schedule next frame
      }

      rafId = requestAnimationFrame(loop);
    }

    // ── Initialise ────────────────────────────────────────────────────────────

    // Render the auth status bar (shows current session if any)
    refreshStatusBar();

    // Kick off the animation loop
    rafId = requestAnimationFrame(loop);
  </script>
</body>
</html>
