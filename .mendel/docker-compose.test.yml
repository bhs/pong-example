services:
  mysql:
    image: mysql:8
    command: ["mysqld"]
    environment:
      MYSQL_DATABASE: pong_test
      MYSQL_USER: pong_test
      MYSQL_PASSWORD: pong_test_password
      MYSQL_ROOT_PASSWORD: pong_test_root_password
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
    expose:
      - "3000"
    environment:
      PORT: "3000"
      DATABASE_URL: mysql://pong_test:pong_test_password@mysql:3306/pong_test
      ENABLED_STUBS: google-sign-in
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    # Healthy only once the server answers on the container's own network
    # address (not just loopback), which is how other containers reach it.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$$(hostname -i | cut -d' ' -f1):3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
