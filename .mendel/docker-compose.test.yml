services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app_test_password
      MYSQL_ROOT_PASSWORD: pong_test_root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: ..
    environment:
      DATABASE_URL: mysql://app:app_test_password@mysql:3306/app
    depends_on:
      mysql:
        condition: service_healthy
